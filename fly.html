      const j2x=j1x+Math.cos(a)*len+Math.cos(a+Math.PI/2)*sway;
      const j2y=j1y+Math.sin(a)*len+Math.sin(a+Math.PI/2)*sway;
      const tipX=j2x+Math.cos(a)*15;
      const tipY=j2y+Math.sin(a)*15;
      // 腿段
      ctx.strokeStyle="#2a1a3a";
      ctx.lineWidth=8;
      ctx.lineCap="round";
      ctx.beginPath();
      ctx.moveTo(j1x,j1y);
      ctx.lineTo(j2x,j2y);
      ctx.stroke();
      ctx.strokeStyle="#1a0a2a";
      ctx.lineWidth=4;
      ctx.beginPath();
      ctx.moveTo(j2x,j2y);
      ctx.lineTo(tipX,tipY);
      ctx.stroke();
      // 關節金邊
      ctx.fillStyle="#FFD700";
      ctx.beginPath();ctx.arc(j1x,j1y,4,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(j2x,j2y,3,0,Math.PI*2);ctx.fill();
      // 尖刺末端
      ctx.fillStyle="#c0392b";
      ctx.beginPath();
      ctx.moveTo(tipX-Math.cos(a)*3,tipY-Math.sin(a)*3);
      ctx.lineTo(tipX+Math.cos(a)*6,tipY+Math.sin(a)*6);
      ctx.lineTo(tipX-Math.cos(a+Math.PI/2)*3,tipY-Math.sin(a+Math.PI/2)*3);
      ctx.fill();
    }
    ctx.lineCap="butt";

    // ===== 主體球形 =====
    // 外殼
    const bodyR=44;
    const bodyG=ctx.createRadialGradient(cx-10,cy-10,5,cx,cy,bodyR);
    bodyG.addColorStop(0,"#6a4a8a");
    bodyG.addColorStop(0.4,"#3a1a4a");
    bodyG.addColorStop(1,"#1a0a2a");
    ctx.fillStyle=bodyG;
    ctx.beginPath();ctx.arc(cx,cy,bodyR,0,Math.PI*2);ctx.fill();
    // 金邊
    ctx.strokeStyle="#FFD700";ctx.lineWidth=2;
    ctx.shadowColor="#FFD700";ctx.shadowBlur=5;
    ctx.beginPath();ctx.arc(cx,cy,bodyR,0,Math.PI*2);ctx.stroke();
    ctx.shadowBlur=0;

    // 環狀紋飾
    ctx.strokeStyle="rgba(255,215,0,0.3)";ctx.lineWidth=1;
    for(let r=0;r<3;r++){
      ctx.beginPath();ctx.arc(cx,cy,bodyR-10-r*8,0,Math.PI*2);ctx.stroke();
    }
    // 鉚釘
    ctx.fillStyle="#FFD700";
    for(let i=0;i<6;i++){
      const a=i*Math.PI/3+frame*0.005;
      ctx.beginPath();ctx.arc(cx+Math.cos(a)*(bodyR-5),cy+Math.sin(a)*(bodyR-5),2,0,Math.PI*2);ctx.fill();
    }

    // ===== 多眼系統（8 隻紅眼）=====
    const eyeBlink=Math.sin(frame*0.15)*0.3+0.7;
    ctx.shadowColor="#FF0000";ctx.shadowBlur=10;
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4-Math.PI/2;
      const eyeR=4+(i%2)*1;
      const ex2=cx+Math.cos(a)*(bodyR-12);
      const ey2=cy+Math.sin(a)*(bodyR-12);
      const eyeG=ctx.createRadialGradient(ex2,ey2,1,ex2,ey2,eyeR);
      eyeG.addColorStop(0,"#fff");
      eyeG.addColorStop(0.4,"#FF6666");
      eyeG.addColorStop(1,enraged?"rgba(255,0,0,"+eyeBlink+")":"rgba(180,0,0,"+(eyeBlink*0.8)+")");
      ctx.fillStyle=eyeG;
      ctx.beginPath();ctx.arc(ex2,ey2,eyeR,0,Math.PI*2);ctx.fill();
    }
    ctx.shadowBlur=0;

    // ===== 中央核心（紫色能量）=====
    const corePulse=Math.sin(frame*0.1)*0.3+0.7;
    const coreG=ctx.createRadialGradient(cx,cy,3,cx,cy,20);
    coreG.addColorStop(0,"#fff");
    coreG.addColorStop(0.3,"rgba(255,100,255,"+corePulse+")");
    coreG.addColorStop(0.7,"rgba(150,50,200,"+(corePulse*0.6)+")");
    coreG.addColorStop(1,"rgba(80,0,120,0)");
    ctx.fillStyle=coreG;
    ctx.beginPath();ctx.arc(cx,cy,20,0,Math.PI*2);ctx.fill();
    // 旋轉的能量符文（六角）
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(-frame*0.04);
    ctx.strokeStyle="rgba(255,100,255,"+corePulse+")";
    ctx.lineWidth=2;
    ctx.shadowColor="#FF66FF";ctx.shadowBlur=8;
    ctx.beginPath();
    for(let i=0;i<6;i++){
      const a=i*Math.PI/3;
      const x=Math.cos(a)*12,y=Math.sin(a)*12;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
    ctx.shadowBlur=0;

    // 王冠（蜘蛛王標誌）
    ctx.fillStyle="#FFD700";
    ctx.beginPath();
    ctx.moveTo(cx-20,cy-bodyR+3);
    ctx.lineTo(cx-15,cy-bodyR-10);
    ctx.lineTo(cx-7,cy-bodyR-2);
    ctx.lineTo(cx,cy-bodyR-15);
    ctx.lineTo(cx+7,cy-bodyR-2);
    ctx.lineTo(cx+15,cy-bodyR-10);
    ctx.lineTo(cx+20,cy-bodyR+3);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle="#996600";ctx.lineWidth=1;
    ctx.stroke();
    // 王冠寶石
    ctx.fillStyle="#FF0099";
    ctx.shadowColor="#FF0099";ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(cx,cy-bodyR-9,3,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;

    // 「蛛」標誌
    ctx.save();
    ctx.shadowColor="#FFD700";ctx.shadowBlur=8;
    ctx.fillStyle="rgba(0,0,0,0.4)";
    ctx.beginPath();ctx.arc(cx,cy,12,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#FFD700";
    ctx.font="bold 16px 'Noto Serif TC',serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("蛛",cx,cy+1);
    ctx.restore();
  }

  // ===== 第 3 關 BOSS：火焰之心 =====
  function drawBossFlame(ctx,en,frame){
    const ex=en.x,ey=en.y;
    const bob=Math.sin(frame*0.07)*4;
    const cx=ex+en.w/2,cy=ey+en.h/2+bob;
    const hpRatio=en.hp/en.maxHp;
    const enraged=hpRatio<0.4;
    const intensity=enraged?1.5:1;

    // ===== 1. 外圍火焰光環（多層）=====
    for(let r=0;r<5;r++){
      const flameR=en.w*0.55+r*10+Math.sin(frame*0.1+r*0.5)*6;
      const alpha=(0.25-r*0.04)*intensity;
      ctx.save();
      ctx.shadowColor="#FF4400";ctx.shadowBlur=15;
      const fg=ctx.createRadialGradient(cx,cy,flameR*0.6,cx,cy,flameR);
      fg.addColorStop(0,"rgba(255,200,0,0)");
      fg.addColorStop(0.7,"rgba(255,100,0,"+alpha+")");
      fg.addColorStop(1,"rgba(200,0,0,0)");
      ctx.fillStyle=fg;
      ctx.beginPath();ctx.arc(cx,cy,flameR,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }

    // ===== 2. 火焰觸手（8 條向外噴）=====
    for(let t=0;t<8;t++){
      const a=t*Math.PI/4+frame*0.01;
      const len=35+Math.sin(frame*0.15+t)*12;
      const tx=cx+Math.cos(a)*len;
      const ty=cy+Math.sin(a)*len;
      // 火舌
      const g=ctx.createLinearGradient(cx,cy,tx,ty);
      g.addColorStop(0,"rgba(255,255,100,0.9)");
      g.addColorStop(0.5,"rgba(255,80,0,0.7)");
      g.addColorStop(1,"rgba(180,0,0,0)");
      ctx.strokeStyle=g;
      ctx.lineWidth=6+Math.sin(frame*0.2+t)*2;
      ctx.lineCap="round";
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      // 曲線
      const mx=cx+Math.cos(a)*(len*0.5)+Math.cos(a+Math.PI/2)*Math.sin(frame*0.2+t)*8;
      const my=cy+Math.sin(a)*(len*0.5)+Math.sin(a+Math.PI/2)*Math.sin(frame*0.2+t)*8;
      ctx.quadraticCurveTo(mx,my,tx,ty);
      ctx.stroke();
    }
    ctx.lineCap="butt";

    // ===== 3. 主體（紅黑岩漿球體）=====
    const bodyR=42;
    // 火紋外殼
    const bodyG=ctx.createRadialGradient(cx-8,cy-8,5,cx,cy,bodyR);
    bodyG.addColorStop(0,"#FF6600");
    bodyG.addColorStop(0.3,"#c0392b");
    bodyG.addColorStop(0.7,"#5a0a0a");
    bodyG.addColorStop(1,"#1a0000");
    ctx.fillStyle=bodyG;
    ctx.beginPath();ctx.arc(cx,cy,bodyR,0,Math.PI*2);ctx.fill();
    // 岩漿裂紋
    ctx.strokeStyle="rgba(255,160,0,"+(0.5+Math.sin(frame*0.1)*0.3)+")";
    ctx.lineWidth=2;
    ctx.shadowColor="#FF6600";ctx.shadowBlur=8;
    for(let i=0;i<5;i++){
      const a=i*Math.PI*2/5+frame*0.003;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*5,cy+Math.sin(a)*5);
      const ang2=a+0.3;
      ctx.lineTo(cx+Math.cos(ang2)*(bodyR-8),cy+Math.sin(ang2)*(bodyR-8));
      const ang3=a+0.5;
      ctx.lineTo(cx+Math.cos(ang3)*(bodyR-15),cy+Math.sin(ang3)*(bodyR-15));
      ctx.stroke();
    }
    ctx.shadowBlur=0;
    // 金邊
    ctx.strokeStyle="#FFD700";ctx.lineWidth=2;
    ctx.shadowColor="#FFD700";ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(cx,cy,bodyR,0,Math.PI*2);ctx.stroke();
    ctx.shadowBlur=0;

    // ===== 4. 中央火焰核心（眼睛狀）=====
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(Math.sin(frame*0.05)*0.2);
    // 外眼框
    ctx.fillStyle="#2a0000";
    ctx.beginPath();
    ctx.ellipse(0,0,28,18,0,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle="#FFD700";ctx.lineWidth=2;
    ctx.stroke();
    // 火焰瞳孔
    const eyeG=ctx.createRadialGradient(0,0,2,0,0,18);
    eyeG.addColorStop(0,"#fff");
    eyeG.addColorStop(0.2,"#FFFF00");
    eyeG.addColorStop(0.5,"#FF6600");
    eyeG.addColorStop(1,"rgba(180,0,0,0)");
    ctx.fillStyle=eyeG;
    ctx.beginPath();
    ctx.ellipse(0,0,24,15,0,0,Math.PI*2);
    ctx.fill();
    // 瞳仁（垂直細縫，惡魔感）
    ctx.fillStyle="#1a0000";
    ctx.beginPath();
    ctx.ellipse(0,0,3,12,0,0,Math.PI*2);
    ctx.fill();
    // 高光
    ctx.fillStyle="rgba(255,255,255,0.6)";
    ctx.beginPath();ctx.ellipse(-5,-4,2,3,0,0,Math.PI*2);ctx.fill();
    ctx.restore();

    // ===== 5. 上下噴火口（噴射火焰）=====
    for(let s=0;s<2;s++){
      const fy=cy+(s===0?-bodyR-5:bodyR+5);
      const dir=s===0?-1:1;
      // 火焰柱
      const flameLen=15+Math.sin(frame*0.3+s)*6;
      const fg=ctx.createLinearGradient(cx,fy,cx,fy+dir*flameLen);
      fg.addColorStop(0,"rgba(255,255,100,0.9)");
      fg.addColorStop(0.5,"rgba(255,80,0,0.7)");
      fg.addColorStop(1,"rgba(180,0,0,0)");
      ctx.fillStyle=fg;
      ctx.beginPath();
      ctx.moveTo(cx-8,fy);
      ctx.quadraticCurveTo(cx,fy+dir*flameLen*1.3,cx+8,fy);
      ctx.fill();
    }

    // ===== 6. 兩側機砲（黑色岩石材質）=====
    for(let s=0;s<2;s++){
      const sx=cx+(s===0?-bodyR-5:bodyR+5);
      const ang=s===0?Math.PI:0;
      ctx.save();
      ctx.translate(sx,cy);
      ctx.rotate(ang);
      // 砲管
      ctx.fillStyle="#1a0a0a";
      ctx.fillRect(0,-6,18,12);
      ctx.strokeStyle="#FFD700";ctx.lineWidth=1.5;
      ctx.strokeRect(0,-6,18,12);
      // 砲口火焰
      const mz=Math.sin(frame*0.2+s)*0.3+0.7;
      ctx.fillStyle="rgba(255,100,0,"+mz+")";
      ctx.shadowColor="#FF6600";ctx.shadowBlur=8;
      ctx.beginPath();ctx.arc(20,0,3,0,Math.PI*2);ctx.fill();
      ctx.restore();
      ctx.shadowBlur=0;
    }

    // ===== 7. 王冠（火焰王標誌）=====
    ctx.fillStyle="#FFD700";
    ctx.beginPath();
    ctx.moveTo(cx-22,cy-bodyR+3);
    ctx.lineTo(cx-16,cy-bodyR-12);
    ctx.lineTo(cx-8,cy-bodyR-3);
    ctx.lineTo(cx,cy-bodyR-18);
    ctx.lineTo(cx+8,cy-bodyR-3);
    ctx.lineTo(cx+16,cy-bodyR-12);
    ctx.lineTo(cx+22,cy-bodyR+3);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle="#996600";ctx.lineWidth=1.5;
    ctx.stroke();
    // 寶石
    ctx.fillStyle="#FF0000";
    ctx.shadowColor="#FF0000";ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(cx,cy-bodyR-11,3.5,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;

    // ===== 8.「魔」字標誌 =====
    ctx.save();
    ctx.shadowColor="#FFD700";ctx.shadowBlur=10;
    ctx.fillStyle="#FFD700";
    ctx.font="bold 14px 'Noto Serif TC',serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("魔",cx,cy+bodyR+10);
    ctx.restore();

    // 火焰粒子向上飄
    if(frame%4===0){
      ctx.fillStyle="rgba(255,150,0,0.7)";
      for(let p=0;p<3;p++){
        const px=cx+(Math.random()-0.5)*60;
        const py=cy+bodyR+5;
        ctx.beginPath();
        ctx.arc(px,py+Math.sin(frame*0.1+p)*5,1+Math.random()*2,0,Math.PI*2);
        ctx.fill();
      }
    }
  }

  function enemyHPBar(ctx,en){
    if(en.hp>=en.maxHp)return;
    ctx.fillStyle="rgba(0,0,0,0.5)";
    ctx.fillRect(en.x,en.y-6,en.w,3);
    ctx.fillStyle="#FF4444";
    ctx.fillRect(en.x,en.y-6,en.w*en.hp/en.maxHp,3);
  }

  function drawCrate(ctx,cr,frame){
    // 漂浮箱（有反重力推進）
    ctx.fillStyle="#8B4513";
    ctx.fillRect(cr.x,cr.y,cr.w,cr.h);
    ctx.fillStyle="#A0522D";
    ctx.fillRect(cr.x+2,cr.y+2,cr.w-4,cr.h-4);
    ctx.strokeStyle="#5a2d0c";ctx.lineWidth=2;
    ctx.strokeRect(cr.x+0.5,cr.y+0.5,cr.w-1,cr.h-1);
    ctx.beginPath();
    ctx.moveTo(cr.x,cr.y);ctx.lineTo(cr.x+cr.w,cr.y+cr.h);
    ctx.moveTo(cr.x+cr.w,cr.y);ctx.lineTo(cr.x,cr.y+cr.h);
    ctx.stroke();
    // 反重力推進閃光
    const blink=Math.floor(frame/10)%2;
    ctx.fillStyle=blink?"#00FFFF":"#0088CC";
    ctx.fillRect(cr.x+4,cr.y+cr.h-2,4,3);
    ctx.fillRect(cr.x+cr.w-8,cr.y+cr.h-2,4,3);
    // 「語」字
    ctx.fillStyle="#FFD700";
    ctx.font="bold 14px 'Noto Sans TC',sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("語",cr.x+cr.w/2,cr.y+cr.h/2+1);
    // HP 條
    if(cr.hp<cr.maxHp){
      ctx.fillStyle="rgba(0,0,0,0.5)";
      ctx.fillRect(cr.x,cr.y-6,cr.w,3);
      ctx.fillStyle="#5cdb95";
      ctx.fillRect(cr.x,cr.y-6,cr.w*cr.hp/cr.maxHp,3);
    }
  }

  function drawDrop(ctx,d,frame,i){
    const bob=Math.sin((frame+i*7)*0.07)*3;
    const x=d.x+d.w/2,y=d.y+d.h/2+bob;
    if(d.type==="weapon"){
      const w=WEAPONS[d.weapon];
      ctx.save();
      ctx.shadowColor=w.color;ctx.shadowBlur=12;
      ctx.fillStyle="rgba(0,0,0,0.4)";
      ctx.beginPath();ctx.arc(x,y,d.w/2+2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=w.color;
      ctx.beginPath();ctx.arc(x,y,d.w/2,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle="#fff";
      ctx.font="bold 16px sans-serif";
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(w.icon,x,y+1);
      ctx.restore();
    }else if(d.type==="heal"){
      ctx.save();
      ctx.shadowColor="#FF6B6B";ctx.shadowBlur=10;
      ctx.fillStyle="#FF6B6B";
      ctx.beginPath();ctx.arc(x,y,d.w/2,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle="#fff";
      ctx.fillRect(x-7,y-2,14,4);
      ctx.fillRect(x-2,y-7,4,14);
      ctx.restore();
    }else if(d.type==="coin"){
      ctx.save();
      ctx.shadowColor="#FFD700";ctx.shadowBlur=8;
      const gr=ctx.createRadialGradient(x,y,2,x,y,d.w/2);
      gr.addColorStop(0,"#fff7cc");gr.addColorStop(0.5,"#FFD700");gr.addColorStop(1,"#B8860B");
      ctx.fillStyle=gr;
      ctx.beginPath();ctx.arc(x,y,d.w/2,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      ctx.strokeStyle="#DAA520";ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(x,y,d.w/2-2,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle="#5a3000";
      ctx.font="bold 13px 'Noto Serif TC',serif";
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(d.char,x,y+1);
      if(d.life&&d.life<120&&Math.floor(d.life/8)%2===0)ctx.globalAlpha=0.4;
      ctx.restore();
    }
  }

  function drawBullet(ctx,b){
    ctx.save();
    if(b.type==="missile"){
      // 拖尾
      for(let ti=0;ti<b.trail.length;ti++){
        const tr=b.trail[ti];
        ctx.globalAlpha=ti/b.trail.length*0.7;
        ctx.fillStyle="#FF6600";
        ctx.beginPath();ctx.arc(tr.x,tr.y,b.h/2*(ti/b.trail.length),0,Math.PI*2);ctx.fill();
      }
      ctx.globalAlpha=1;
      ctx.shadowColor="#FF4500";ctx.shadowBlur=8;
      ctx.fillStyle="#888";
      ctx.fillRect(b.x,b.y+1,b.w,b.h-2);
      ctx.fillStyle="#FF4500";
      ctx.beginPath();
      ctx.moveTo(b.x+b.w,b.y-2);
      ctx.lineTo(b.x+b.w+8,b.y+b.h/2);
      ctx.lineTo(b.x+b.w,b.y+b.h+2);
      ctx.fill();
      ctx.fillStyle="#FFD700";
      ctx.fillRect(b.x-2,b.y+2,4,b.h-4);
    }else if(b.type==="laser"){
      ctx.shadowColor=b.color;ctx.shadowBlur=12;
      ctx.fillStyle="#fff";
      ctx.fillRect(b.x,b.y,b.w,b.h);
      ctx.fillStyle=b.color;
      ctx.fillRect(b.x-1,b.y-1,b.w+2,b.h+2);
      ctx.globalCompositeOperation="lighter";
      ctx.fillStyle="rgba(0,255,255,0.5)";
      ctx.fillRect(b.x-3,b.y-3,b.w+6,b.h+6);
      ctx.globalCompositeOperation="source-over";
    }else if(b.type==="spread"){
      ctx.shadowColor=b.color;ctx.shadowBlur=8;
      ctx.fillStyle=b.color;
      ctx.beginPath();ctx.ellipse(b.x+b.w/2,b.y+b.h/2,b.w/2,b.h/2,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#fff";
      ctx.beginPath();ctx.arc(b.x+b.w/2,b.y+b.h/2,b.h/3,0,Math.PI*2);ctx.fill();
    }else if(b.type==="plasma"){
      // 紫色電漿球：旋轉的能量環
      const cx=b.x+b.w/2,cy=b.y+b.h/2;
      ctx.shadowColor=b.color;ctx.shadowBlur=18;
      const gr=ctx.createRadialGradient(cx,cy,2,cx,cy,b.w/2);
      gr.addColorStop(0,"#fff");
      gr.addColorStop(0.3,"#E0B0FF");
      gr.addColorStop(0.7,b.color);
      gr.addColorStop(1,"rgba(176,92,255,0)");
      ctx.fillStyle=gr;
      ctx.beginPath();ctx.arc(cx,cy,b.w/2,0,Math.PI*2);ctx.fill();
      // 旋轉的內部三角光
      ctx.fillStyle="#fff";
      for(let i=0;i<3;i++){
        const ang=b.spinPhase+i*Math.PI*2/3;
        const x=cx+Math.cos(ang)*b.w*0.25;
        const y=cy+Math.sin(ang)*b.w*0.25;
        ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill();
      }
    }else if(b.type==="wave"){
      // 流線型波動條
      const cx=b.x+b.w/2,cy=b.y+b.h/2;
      ctx.shadowColor=b.color;ctx.shadowBlur=10;
      ctx.fillStyle=b.color;
      ctx.beginPath();
      ctx.ellipse(cx,cy,b.w/2,b.h/2,0,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle="#fff";
      ctx.beginPath();
      ctx.ellipse(cx+2,cy,b.w/3,b.h/3,0,0,Math.PI*2);
      ctx.fill();
      // 尾跡
      ctx.globalAlpha=0.4;
      ctx.fillStyle=b.color;
      ctx.beginPath();
      ctx.ellipse(cx-b.w*0.4,cy,b.w/3,b.h/3,0,0,Math.PI*2);
      ctx.fill();
    }else if(b.type==="ice"){
      // 冰晶六角星
      const cx=b.x+b.w/2,cy=b.y+b.h/2;
      ctx.shadowColor=b.color;ctx.shadowBlur=12;
      ctx.translate(cx,cy);
      ctx.rotate(b.spinPhase);
      ctx.fillStyle=b.color;
      for(let i=0;i<6;i++){
        ctx.rotate(Math.PI/3);
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.lineTo(b.w*0.45,2);
        ctx.lineTo(b.w*0.55,0);
        ctx.lineTo(b.w*0.45,-2);
        ctx.fill();
      }
      ctx.fillStyle="#fff";
      ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill();
    }else if(b.type==="flame"){
      // 火焰擴散圓
      const cx=b.x+b.w/2,cy=b.y+b.h/2;
      const lifeRatio=b.life/(b.maxLife||24);
      ctx.globalAlpha=Math.max(0.3,lifeRatio);
      ctx.shadowColor="#FF4400";ctx.shadowBlur=15;
      const gr=ctx.createRadialGradient(cx,cy,1,cx,cy,b.w/2);
      gr.addColorStop(0,"#fff");
      gr.addColorStop(0.3,"#FFFF00");
      gr.addColorStop(0.7,"#FF6600");
      gr.addColorStop(1,"rgba(180,30,0,0)");
      ctx.fillStyle=gr;
      ctx.beginPath();ctx.arc(cx,cy,b.w/2,0,Math.PI*2);ctx.fill();
    }else if(b.type==="lightning"){
      // 主彈體
      const cx=b.x+b.w/2,cy=b.y+b.h/2;
      ctx.shadowColor=b.color;ctx.shadowBlur=14;
      ctx.fillStyle="#fff";
      ctx.beginPath();ctx.ellipse(cx,cy,b.w/2,b.h/2,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=b.color;
      ctx.beginPath();ctx.ellipse(cx,cy,b.w/3,b.h/3,0,0,Math.PI*2);ctx.fill();
      // 鋸齒線
      ctx.strokeStyle=b.color;ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(b.x-4,cy);
      ctx.lineTo(b.x+3,cy-3);
      ctx.lineTo(b.x+5,cy+2);
      ctx.lineTo(b.x+10,cy-1);
      ctx.stroke();
      // 鏈段
      if(b.segments){
        for(let k=0;k<b.segments.length;k++){
          const sg=b.segments[k];
          const alpha=sg.life/14;
          ctx.globalAlpha=alpha;
          ctx.strokeStyle="#fff";ctx.lineWidth=3;
          ctx.shadowColor=b.color;ctx.shadowBlur=12;
          ctx.beginPath();
          ctx.moveTo(sg.from.x,sg.from.y);
          // 鋸齒中間點
          const mx=(sg.from.x+sg.to.x)/2+(Math.random()-0.5)*15;
          const my=(sg.from.y+sg.to.y)/2+(Math.random()-0.5)*15;
          ctx.lineTo(mx,my);
          ctx.lineTo(sg.to.x,sg.to.y);
          ctx.stroke();
          ctx.strokeStyle=b.color;ctx.lineWidth=1;
          ctx.stroke();
        }
        ctx.globalAlpha=1;
      }
    }else if(b.type==="shuriken"){
      // 旋轉迴旋鏢（綠色十字飛輪）
      const cx=b.x+b.w/2,cy=b.y+b.h/2;
      ctx.shadowColor=b.color;ctx.shadowBlur=12;
      ctx.translate(cx,cy);
      ctx.rotate(b.spinPhase);
      ctx.fillStyle=b.color;
      // 四片葉
      for(let i=0;i<4;i++){
        ctx.rotate(Math.PI/2);
        ctx.beginPath();
        ctx.moveTo(0,-2);
        ctx.lineTo(b.w*0.5,-4);
        ctx.lineTo(b.w*0.55,0);
        ctx.lineTo(b.w*0.5,4);
        ctx.lineTo(0,2);
        ctx.fill();
      }
      // 中心
      ctx.fillStyle="#FFD700";
      ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill();
    }else if(b.type==="beam"){
      // 持續光束（白色帶光暈）
      ctx.shadowColor="#FFFFFF";ctx.shadowBlur=18;
      const gr=ctx.createLinearGradient(b.x,0,b.x+b.w,0);
      gr.addColorStop(0,"rgba(255,255,255,1)");
      gr.addColorStop(0.7,"rgba(0,255,255,0.7)");
      gr.addColorStop(1,"rgba(0,200,255,0)");
      ctx.fillStyle=gr;
      ctx.fillRect(b.x,b.y-3,b.w,b.h+6);
      ctx.globalCompositeOperation="lighter";
      ctx.fillStyle="rgba(255,255,255,0.6)";
      ctx.fillRect(b.x,b.y,b.w,b.h);
      ctx.globalCompositeOperation="source-over";
    }else{
      // normal
      ctx.shadowColor=b.color;ctx.shadowBlur=8;
      ctx.fillStyle=b.color;
      ctx.fillRect(b.x,b.y,b.w,b.h);
      ctx.fillStyle="#fff";
      ctx.fillRect(b.x+b.w-4,b.y+1,4,b.h-2);
    }
    ctx.restore();
  }

  function drawHUD(ctx,g){
    ctx.fillStyle="rgba(0,0,0,0.65)";
    ctx.fillRect(0,0,VW,32);

    ctx.fillStyle="#FFD700";
    ctx.font="bold 14px 'Noto Sans TC',sans-serif";
    ctx.textAlign="left";ctx.textBaseline="middle";
    ctx.fillText("分數 "+g.score,12,16);

    // 本關進度（X / 20）+ 關卡數
    const stageCount=g.complete.length-(g.stageStartCount||0);
    const target=20;
    const reached=stageCount>=target;
    ctx.fillStyle="#FF69B4";
    ctx.font="bold 13px 'Noto Sans TC',sans-serif";
    ctx.fillText("第 "+g.stage+" 關",110,16);
    ctx.fillStyle=reached?"#FFD700":"#4ECDC4";
    ctx.font="bold 14px 'Noto Sans TC',sans-serif";
    ctx.fillText("📖 "+stageCount+" / "+target,170,16);
    // 進度條
    const barX=255,barY=10,barW=60,barH=10;
    ctx.fillStyle="rgba(0,0,0,0.5)";
    ctx.fillRect(barX,barY,barW,barH);
    const pct=Math.min(stageCount/target,1);
    const barGrad=ctx.createLinearGradient(barX,barY,barX+barW,barY);
    barGrad.addColorStop(0,"#4ECDC4");
    barGrad.addColorStop(1,reached?"#FFD700":"#5cdb95");
    ctx.fillStyle=barGrad;
    ctx.fillRect(barX,barY,barW*pct,barH);
    if(reached){
      ctx.strokeStyle="#FFD700";
      ctx.lineWidth=2;
      ctx.globalAlpha=0.5+Math.sin(g.frame*0.3)*0.5;
      ctx.strokeRect(barX-1,barY-1,barW+2,barH+2);
      ctx.globalAlpha=1;
    }

    // HP
    ctx.font="14px sans-serif";
    for(let i=0;i<g.p.maxHp;i++){
      ctx.fillText(i<g.p.hp?"❤️":"🖤",325+i*18,16);
    }

    // 武器
    const w=WEAPONS[g.p.weapon];
    ctx.fillStyle=w.color;
    ctx.font="bold 14px 'Noto Sans TC',sans-serif";
    ctx.textAlign="right";
    let wText=w.icon+" "+w.name;
    if(g.p.weapon!=="normal")wText+=" ×"+g.p.weaponAmmo;
    ctx.fillText(wText,VW-12,16);
    ctx.textAlign="left";

    // === 能量條 + 炸彈計數（左下角）===
    const eBarX=12,eBarY=VH-58,eBarW=200,eBarH=14;
    const energy=g.p.energy||0;
    const energyMax=g.p.energyMax||10;
    const ready=energy>=energyMax;

    // 炸彈圖示（在能量條正上方）— 顯示為一排炸彈
    const bombY=eBarY-38;
    const bombSize=22;
    const bombSpacing=26;
    for(let i=0;i<g.p.maxBombs;i++){
      const bx=eBarX+i*bombSpacing+bombSize/2;
      const by=bombY+bombSize/2;
      const hasBomb=i<g.p.bombs;
      ctx.save();
      if(hasBomb){
        // 有炸彈：金色發光球體
        ctx.shadowColor="#FFD700";ctx.shadowBlur=8;
        const bg=ctx.createRadialGradient(bx-3,by-3,2,bx,by,bombSize/2);
        bg.addColorStop(0,"#fff");
        bg.addColorStop(0.3,"#FFE066");
        bg.addColorStop(0.7,"#FFAA00");
        bg.addColorStop(1,"#996600");
        ctx.fillStyle=bg;
        ctx.beginPath();ctx.arc(bx,by,bombSize/2,0,Math.PI*2);ctx.fill();
        ctx.shadowBlur=0;
        // 引信
        ctx.strokeStyle="#5a3a1a";ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(bx-2,by-bombSize/2);
        ctx.quadraticCurveTo(bx+4,by-bombSize/2-5,bx+5,by-bombSize/2-3);
        ctx.stroke();
        // 引信火花
        const sparkle=Math.sin(g.frame*0.4+i)*0.5+0.5;
        ctx.fillStyle="rgba(255,200,0,"+sparkle+")";
        ctx.shadowColor="#FF8800";ctx.shadowBlur=6;
        ctx.beginPath();ctx.arc(bx+5,by-bombSize/2-3,2,0,Math.PI*2);ctx.fill();
        ctx.shadowBlur=0;
        // 高光
        ctx.fillStyle="rgba(255,255,255,0.6)";
        ctx.beginPath();ctx.ellipse(bx-4,by-4,3,2,-0.5,0,Math.PI*2);ctx.fill();
      }else{
        // 沒炸彈：暗灰空殼
        ctx.fillStyle="rgba(255,255,255,0.08)";
        ctx.beginPath();ctx.arc(bx,by,bombSize/2,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle="rgba(255,255,255,0.2)";ctx.lineWidth=1;
        ctx.stroke();
      }
      ctx.restore();
    }
    // 炸彈標籤
    ctx.fillStyle="#FFD700";
    ctx.font="bold 11px 'Noto Sans TC',sans-serif";
    ctx.textAlign="left";ctx.textBaseline="middle";
    ctx.fillText("💣 必殺 "+g.p.bombs+"/"+g.p.maxBombs,eBarX+g.p.maxBombs*bombSpacing+8,bombY+bombSize/2);

    // 能量條背景
    ctx.fillStyle="rgba(0,0,0,0.6)";
    ctx.fillRect(eBarX,eBarY,eBarW,eBarH);
    // 內容（10 格）
    const cellW=(eBarW-4)/energyMax;
    for(let k=0;k<energyMax;k++){
      const cx=eBarX+2+k*cellW;
      if(k<energy){

          onPointerUp:function(){pressBomb(false);},
          onPointerLeave:function(){pressBomb(false);},
          onPointerCancel:function(){pressBomb(false);}
        },"💣 必殺")
      )
    ),

    // 複習面板（BOSS 死後出現，要點過所有成語才有升級）
    reviewPanel?h("div",{style:{position:"fixed",inset:0,background:"radial-gradient(circle at center,rgba(30,15,70,0.95),rgba(0,0,0,0.97))",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:20,overflowY:"auto"}},
      h("div",{style:{maxWidth:760,width:"100%",textAlign:"center"}},
        h("div",{style:{fontSize:48,marginBottom:4}},"📖"),
        h("h2",{style:{color:"#FFD700",fontSize:28,margin:"0 0 4px",fontFamily:"'Orbitron','Noto Serif TC',serif",fontWeight:900,textShadow:"0 0 20px rgba(255,215,0,0.6)",letterSpacing:2}},"第 "+reviewPanel.stage+" 關 · 成語複習"),
        h("p",{style:{color:"#4ECDC4",fontSize:13,margin:"0 0 16px"}},
          "點選每個成語看看意思（"+reviewPanel.clicked.length+" / "+reviewPanel.idioms.length+"）"
        ),
        // 成語卡片網格
        h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:10,marginBottom:18}},
          reviewPanel.idioms.map(function(idiom,i){
            const isClicked=reviewPanel.clicked.includes(idiom);
            const meaning=IDIOM_MEANINGS[idiom]||"成語意思待補充";
            return h("div",{
              key:i,
              onClick:function(){
                if(isClicked)return;
                setReviewPanel(function(prev){
                  if(!prev)return prev;
                  return Object.assign({},prev,{clicked:prev.clicked.concat([idiom])});
                });
              },
              style:{
                padding:"10px 8px",
                background:isClicked?"linear-gradient(135deg,rgba(255,215,0,0.25),rgba(255,140,0,0.15))":"rgba(50,30,90,0.6)",
                border:isClicked?"2px solid #FFD700":"2px solid rgba(78,205,196,0.4)",
                borderRadius:10,
                cursor:isClicked?"default":"pointer",
                transition:"all 0.25s",
                textAlign:"center",
                minHeight:isClicked?70:50
              },
              onMouseEnter:function(e){if(!isClicked){e.currentTarget.style.background="rgba(78,205,196,0.2)";e.currentTarget.style.borderColor="#4ECDC4";}},
              onMouseLeave:function(e){if(!isClicked){e.currentTarget.style.background="rgba(50,30,90,0.6)";e.currentTarget.style.borderColor="rgba(78,205,196,0.4)";}}
            },
              h("div",{style:{color:isClicked?"#FFD700":"#fff",fontSize:18,fontWeight:800,fontFamily:"'Noto Serif TC',serif",marginBottom:isClicked?4:0,letterSpacing:1}},idiom),
              isClicked?h("div",{style:{color:"rgba(255,255,255,0.85)",fontSize:11,lineHeight:1.4,marginTop:3}},meaning):h("div",{style:{color:"rgba(255,255,255,0.4)",fontSize:10,marginTop:2}},"👆 點看意思")
            );
          })
        ),
        // 進入下一關（全部點完才可按）
        (function(){
          const allClicked=reviewPanel.clicked.length>=reviewPanel.idioms.length;
          return h("button",{
            disabled:!allClicked,
            onClick:function(){
              const g=gRef.current;
              if(!g||!allClicked)return;
              setReviewPanel(null);
              // 隨機抽 3 個升級
              const pool=UPGRADES.slice();
              const choices=[];
              for(let k=0;k<3&&pool.length>0;k++){
                const idx=Math.floor(Math.random()*pool.length);
                choices.push(pool.splice(idx,1)[0]);
              }
              setUpgradePanel({choices:choices,stage:g.stage});
            },
            style:{
              padding:"14px 36px",
              background:allClicked?"linear-gradient(135deg,#FFD700,#FF9933)":"rgba(100,100,100,0.4)",
              color:allClicked?"#1a1a2e":"rgba(255,255,255,0.4)",
              border:allClicked?"3px solid #FFD700":"3px solid rgba(255,255,255,0.15)",
              borderRadius:30,
              fontSize:16,
              fontWeight:900,
              fontFamily:"'Noto Sans TC',sans-serif",
              cursor:allClicked?"pointer":"not-allowed",
              boxShadow:allClicked?"0 6px 20px rgba(255,215,0,0.5)":"none",
              letterSpacing:2,
              transition:"all 0.2s"
            }
          },allClicked?"⚡ 繼續 — 機體升級":"請先複習所有成語（"+reviewPanel.clicked.length+"/"+reviewPanel.idioms.length+"）");
        })()
      )
    ):null,

    // 升級面板浮層（過關後出現）
    upgradePanel?h("div",{style:{position:"fixed",inset:0,background:"radial-gradient(circle at center,rgba(20,10,60,0.92),rgba(0,0,0,0.95))",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:20}},
      h("div",{style:{maxWidth:680,width:"100%",textAlign:"center"}},
        // 標題
        h("div",{style:{marginBottom:6,fontSize:54}},"🏆"),
        h("h2",{style:{color:"#FFD700",fontSize:34,margin:"0 0 6px",fontFamily:"'Orbitron','Noto Serif TC',serif",fontWeight:900,textShadow:"0 0 24px #FFD700, 0 0 50px rgba(255,215,0,0.5)",letterSpacing:3}},"第 "+upgradePanel.stage+" 關完成！"),
        h("p",{style:{color:"#00FFFF",fontSize:15,margin:"0 0 24px",letterSpacing:2}},"⚡ 選擇一項機體升級 ⚡"),
        // 三選一
        h("div",{style:{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap"}},
          upgradePanel.choices.map(function(upg,i){
            return h("button",{
              key:i,
              onClick:function(){
                const g=gRef.current;
                if(!g)return;
                applyUpgrade(g,upg);
                setUpgradePanel(null);
                nextStage(g);
              },
              style:{
                width:180,padding:"20px 16px",
                background:"linear-gradient(135deg,rgba(0,80,160,0.6),rgba(0,40,100,0.8))",
                border:"3px solid #00FFFF",borderRadius:14,
                color:"#fff",cursor:"pointer",
                fontFamily:"'Noto Sans TC',sans-serif",
                transition:"all 0.2s",
                boxShadow:"0 6px 24px rgba(0,255,255,0.3)"
              },
              onMouseEnter:function(e){e.currentTarget.style.transform="translateY(-4px) scale(1.03)";e.currentTarget.style.borderColor="#FFD700";e.currentTarget.style.boxShadow="0 10px 30px rgba(255,215,0,0.5)";},
              onMouseLeave:function(e){e.currentTarget.style.transform="";e.currentTarget.style.borderColor="#00FFFF";e.currentTarget.style.boxShadow="0 6px 24px rgba(0,255,255,0.3)";}
            },
              h("div",{style:{fontSize:42,marginBottom:6}},upg.icon),
              h("div",{style:{fontSize:17,fontWeight:800,color:"#FFD700",marginBottom:6}},upg.name),
              h("div",{style:{fontSize:11,color:"rgba(255,255,255,0.85)",lineHeight:1.5}},upg.desc)
            );
          })
        ),
        h("p",{style:{color:"rgba(255,255,255,0.4)",fontSize:11,marginTop:18}},"下一關 BOSS 會更強大⋯")
      )
    ):null
  );
}

ReactDOM.render(h(Game),document.getElementById("root"));
</script>
</body>
</html>
