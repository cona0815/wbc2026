<script>
// ===== SOUND ENGINE =====
let audioStarted=false,sfx=null;
function initAudio(){
  if(sfx)return sfx;
  const vol=new Tone.Volume(-8).toDestination();
  const shootSynth=new Tone.Synth({oscillator:{type:"square"},envelope:{attack:0.001,decay:0.04,sustain:0,release:0.02},volume:-24}).connect(vol);
  const laserSynth=new Tone.Synth({oscillator:{type:"sawtooth"},envelope:{attack:0.001,decay:0.08,sustain:0,release:0.04},volume:-20}).connect(vol);
  const explodeSynth=new Tone.NoiseSynth({noise:{type:"brown"},envelope:{attack:0.005,decay:0.3,sustain:0,release:0.2},volume:-10}).connect(vol);
  const bigExplodeSynth=new Tone.NoiseSynth({noise:{type:"pink"},envelope:{attack:0.01,decay:0.5,sustain:0.1,release:0.4},volume:-6}).connect(vol);
  const hitSynth=new Tone.NoiseSynth({noise:{type:"white"},envelope:{attack:0.001,decay:0.05,sustain:0,release:0.03},volume:-18}).connect(vol);
  const coinSynth=new Tone.Synth({oscillator:{type:"triangle"},envelope:{attack:0.005,decay:0.15,sustain:0,release:0.1},volume:-10}).connect(vol);
  const idiomSynth=new Tone.PolySynth(Tone.Synth,{oscillator:{type:"sine"},envelope:{attack:0.01,decay:0.3,sustain:0.1,release:0.5},volume:-6}).connect(vol);
  const hurtSynth=new Tone.NoiseSynth({noise:{type:"pink"},envelope:{attack:0.005,decay:0.18,sustain:0,release:0.12},volume:-8}).connect(vol);
  const powerSynth=new Tone.Synth({oscillator:{type:"sine"},envelope:{attack:0.01,decay:0.2,sustain:0.05,release:0.3},volume:-6}).connect(vol);
  const winSynth=new Tone.PolySynth(Tone.Synth,{oscillator:{type:"triangle"},envelope:{attack:0.01,decay:0.2,sustain:0.1,release:0.4},volume:-6}).connect(vol);
  const gameOverSynth=new Tone.Synth({oscillator:{type:"sawtooth"},envelope:{attack:0.01,decay:0.4,sustain:0.1,release:0.8},volume:-8}).connect(vol);
  const bossAlarmSynth=new Tone.Synth({oscillator:{type:"square"},envelope:{attack:0.005,decay:0.15,sustain:0,release:0.1},volume:-14}).connect(vol);
  const bombSynth=new Tone.PolySynth(Tone.Synth,{oscillator:{type:"sine"},envelope:{attack:0.01,decay:0.5,sustain:0.2,release:0.6},volume:-4}).connect(vol);
  const bgmSynth=new Tone.PolySynth(Tone.Synth,{oscillator:{type:"square"},envelope:{attack:0.005,decay:0.15,sustain:0.05,release:0.1},volume:-28}).connect(vol);
  const bgmBass=new Tone.Synth({oscillator:{type:"triangle"},envelope:{attack:0.005,decay:0.3,sustain:0.1,release:0.15},volume:-22}).connect(vol);
  let bgmLoop=null;
  sfx={
    shoot(){shootSynth.triggerAttackRelease("A5","32n");},
    laser(){laserSynth.triggerAttackRelease("E6","32n");},
    missile(){const t=Tone.now();shootSynth.triggerAttackRelease("D5","32n",t);shootSynth.triggerAttackRelease("F4","16n",t+0.04);},
    explode(){explodeSynth.triggerAttackRelease("8n");},
    bigExplode(){bigExplodeSynth.triggerAttackRelease("2n");},
    hit(){hitSynth.triggerAttackRelease("32n");},
    coin(p){const n=["E5","G5","B5","E6"];coinSynth.triggerAttackRelease(n[(p||0)%4],"16n");},
    idiomComplete(){const t=Tone.now();idiomSynth.triggerAttackRelease("C5","8n",t);idiomSynth.triggerAttackRelease("E5","8n",t+0.08);idiomSynth.triggerAttackRelease("G5","8n",t+0.16);idiomSynth.triggerAttackRelease("C6","4n",t+0.24);},
    hurt(){hurtSynth.triggerAttackRelease("8n");},
    powerUp(){const t=Tone.now();powerSynth.triggerAttackRelease("E5","16n",t);powerSynth.triggerAttackRelease("A5","16n",t+0.06);powerSynth.triggerAttackRelease("C6","8n",t+0.12);},
    bossAlert(){const t=Tone.now();bossAlarmSynth.triggerAttackRelease("E3","8n",t);bossAlarmSynth.triggerAttackRelease("E3","8n",t+0.2);bossAlarmSynth.triggerAttackRelease("E3","4n",t+0.4);},
    bomb(){const t=Tone.now();bombSynth.triggerAttackRelease(["C3","E3","G3","C4"],"4n",t);bigExplodeSynth.triggerAttackRelease("4n",t);},
    win(){const t=Tone.now();const notes=["C5","E5","G5","C6","E6","G6","C7"];notes.forEach(function(n,i){winSynth.triggerAttackRelease(n,"16n",t+i*0.08);});},
    gameOver(){const t=Tone.now();gameOverSynth.triggerAttackRelease("E4","8n",t);gameOverSynth.triggerAttackRelease("C4","8n",t+0.2);gameOverSynth.triggerAttackRelease("A3","4n",t+0.4);},
    startBGM(){
      if(bgmLoop)bgmLoop.stop();
      const melody=[
        ["A3"],[],["A3"],[],["C4"],[],["E4"],[],
        ["A4"],[],["G4"],[],["E4"],[],["D4"],[],
        ["F4"],[],["F4"],[],["A4"],[],["C5"],[],
        ["D5"],[],["C5"],[],["A4"],[],["F4"],[],
      ];
      const bass=["A2","A2","E2","E2","A2","A2","E2","E2","F2","F2","C3","C3","F2","F2","A2","A2"];
      let st=0;
      bgmLoop=new Tone.Loop(function(t){
        const cur=melody[st%melody.length];
        if(cur&&cur.length>0)bgmSynth.triggerAttackRelease(cur,"16n",t);
        if(st%2===0)bgmBass.triggerAttackRelease(bass[Math.floor(st/2)%bass.length],"8n",t);
        st++;
      },"16n");
      Tone.getTransport().bpm.value=150;Tone.getTransport().start();bgmLoop.start(0);
    },
    stopBGM(){if(bgmLoop){bgmLoop.stop();bgmLoop=null;}Tone.getTransport().stop();}
  };
  return sfx;
}
async function ensureAudio(){if(!audioStarted){await Tone.start();audioStarted=true;}return initAudio();}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function rectIntersect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function dist(a,b){const dx=(a.x+a.w/2)-(b.x+b.w/2),dy=(a.y+a.h/2)-(b.y+b.h/2);return Math.sqrt(dx*dx+dy*dy);}

// ===== LEVEL: 在關卡時間軸上佈置敵人波次 =====
function buildLevel(idiomQueue,df){
  const waves=[];
  // 整個成語池（不在 buildLevel 抽取，由 game loop 動態挑）
  const idiomPool=idiomQueue.slice();
  let cursor=400;

  function pushCrate(extraX){
    // 不在這裡綁定成語，改為觸發 wave 時再抽
    waves.push({triggerX:cursor+(extraX||0),type:"crate",x:VW+80,y:50+Math.random()*270});
  }
  function pushCrates(n){
    for(let i=0;i<n;i++)pushCrate(i*120);
  }
  // 武器池：所有十種武器都可能掉落（normal 不掉）
  const allWeapons=["spread","laser","missile","plasma","wave","ice","flame","lightning","shuriken","beam"];
  function randomWeapon(){return allWeapons[Math.floor(Math.random()*allWeapons.length)];}

  // ===== 第 1 段：開場（成語 + 戰機） =====
  waves.push({triggerX:cursor,type:"line",enemy:"fighter",count:5,gap:55,y:120});
  waves.push({triggerX:cursor+100,type:"line",enemy:"fighter",count:5,gap:55,y:280});
  cursor+=500;

  pushCrates(2); cursor+=300;
  waves.push({triggerX:cursor,type:"drop",dropType:"weapon",weapon:randomWeapon(),x:VW+50,y:150}); cursor+=200;

  waves.push({triggerX:cursor,type:"single",enemy:"turret",x:VW+50,y:VH-80});
  waves.push({triggerX:cursor,type:"single",enemy:"turret",x:VW+50,y:80,top:true});
  cursor+=300;

  waves.push({triggerX:cursor,type:"sine",enemy:"fighter",count:7,gap:50,amp:60,freq:0.04});
  cursor+=500;
  pushCrates(2); cursor+=250;

  // ===== 第 2 段：自爆機潮 =====
  waves.push({triggerX:cursor,type:"line",enemy:"kamikaze",count:5,gap:65,y:140});
  waves.push({triggerX:cursor+80,type:"line",enemy:"kamikaze",count:5,gap:65,y:260});
  cursor+=500;
  waves.push({triggerX:cursor,type:"drop",dropType:"weapon",weapon:randomWeapon(),x:VW+50,y:150}); cursor+=200;
  pushCrates(2); cursor+=300;

  // ===== 第 3 段：轟炸機區 =====
  waves.push({triggerX:cursor,type:"single",enemy:"bomber",x:VW+80,y:100});
  waves.push({triggerX:cursor+150,type:"single",enemy:"bomber",x:VW+80,y:220});
  cursor+=400;
  waves.push({triggerX:cursor,type:"sine",enemy:"fighter",count:8,gap:48,amp:80,freq:0.05});
  cursor+=600;
  pushCrates(3); cursor+=300;
  waves.push({triggerX:cursor,type:"drop",dropType:"heal",x:VW+50,y:200}); cursor+=200;

  // ===== 第 4 段：雙砲塔 + 中段 =====
  waves.push({triggerX:cursor,type:"single",enemy:"turret",x:VW+50,y:80,top:true});
  waves.push({triggerX:cursor,type:"single",enemy:"turret",x:VW+50,y:VH-80});
  waves.push({triggerX:cursor+100,type:"line",enemy:"fighter",count:6,gap:55,y:160});
  cursor+=500;
  pushCrates(2); cursor+=300;
  waves.push({triggerX:cursor,type:"drop",dropType:"weapon",weapon:randomWeapon(),x:VW+50,y:120}); cursor+=200;

  // ===== 第 5 段：包夾 =====
  waves.push({triggerX:cursor,type:"line",enemy:"fighter",count:6,gap:50,y:80});
  waves.push({triggerX:cursor+50,type:"line",enemy:"fighter",count:6,gap:50,y:300});
  cursor+=400;
  waves.push({triggerX:cursor,type:"line",enemy:"kamikaze",count:6,gap:60,y:190});
  cursor+=500;
  pushCrates(3); cursor+=350;

  // ===== 第 6 段：S 形大波次 =====
  waves.push({triggerX:cursor,type:"sine",enemy:"fighter",count:12,gap:42,amp:110,freq:0.05});
  cursor+=550;
  waves.push({triggerX:cursor,type:"drop",dropType:"weapon",weapon:randomWeapon(),x:VW+50,y:150}); cursor+=200;
  pushCrates(2); cursor+=300;

  // ===== 第 7 段：三轟炸機 =====
  waves.push({triggerX:cursor,type:"single",enemy:"bomber",x:VW+80,y:80});
  waves.push({triggerX:cursor+100,type:"single",enemy:"bomber",x:VW+80,y:180});
  waves.push({triggerX:cursor+200,type:"single",enemy:"bomber",x:VW+80,y:280});
  cursor+=600;
  pushCrates(2); cursor+=300;
  waves.push({triggerX:cursor,type:"drop",dropType:"heal",x:VW+50,y:200}); cursor+=200;

  // ===== 第 8 段：自爆機巨潮 =====
  waves.push({triggerX:cursor,type:"line",enemy:"kamikaze",count:9,gap:48,y:100});
  waves.push({triggerX:cursor+50,type:"line",enemy:"kamikaze",count:9,gap:48,y:280});
  cursor+=600;
  pushCrates(2); cursor+=300;

  // ===== 第 9 段：強化版砲塔陣 =====
  waves.push({triggerX:cursor,type:"single",enemy:"turret",x:VW+50,y:80,top:true});
  waves.push({triggerX:cursor+50,type:"single",enemy:"turret",x:VW+50,y:VH-80});
  waves.push({triggerX:cursor+200,type:"single",enemy:"turret",x:VW+50,y:80,top:true});
  waves.push({triggerX:cursor+250,type:"single",enemy:"turret",x:VW+50,y:VH-80});
  waves.push({triggerX:cursor+150,type:"sine",enemy:"fighter",count:8,gap:48,amp:100,freq:0.05});
  cursor+=600;
  waves.push({triggerX:cursor,type:"drop",dropType:"weapon",weapon:randomWeapon(),x:VW+50,y:120});
  waves.push({triggerX:cursor+100,type:"drop",dropType:"weapon",weapon:randomWeapon(),x:VW+50,y:240});
  cursor+=300;
  pushCrates(3); cursor+=350;

  // ===== 第 10 段：超密集大決戰前 =====
  waves.push({triggerX:cursor,type:"sine",enemy:"fighter",count:14,gap:40,amp:120,freq:0.04});
  cursor+=600;
  waves.push({triggerX:cursor,type:"line",enemy:"kamikaze",count:8,gap:55,y:200});
  cursor+=400;
  pushCrates(3); cursor+=350;
  waves.push({triggerX:cursor,type:"drop",dropType:"heal",x:VW+50,y:200});
  waves.push({triggerX:cursor+150,type:"drop",dropType:"weapon",weapon:randomWeapon(),x:VW+50,y:120});
  cursor+=400;

  // ===== BOSS 前奏 =====
  waves.push({triggerX:cursor,type:"single",enemy:"bomber",x:VW+80,y:120});
  waves.push({triggerX:cursor+150,type:"single",enemy:"bomber",x:VW+80,y:200});
  cursor+=500;
  pushCrates(2); cursor+=300;
  waves.push({triggerX:cursor,type:"drop",dropType:"heal",x:VW+50,y:200});
  cursor+=300;

  // ===== 額外延長波次：給玩家更多機會集滿 20 個成語 =====
  // 因為 BOSS 改為「集滿 20 個成語才出現」，所以這裡放循環的回波
  for(let r=0;r<3;r++){
    waves.push({triggerX:cursor,type:"sine",enemy:"fighter",count:8+r,gap:50,amp:80+r*10,freq:0.05});
    cursor+=500;
    pushCrates(3); cursor+=350;
    waves.push({triggerX:cursor,type:"line",enemy:"kamikaze",count:6+r,gap:55,y:140+r*40});
    cursor+=400;
    waves.push({triggerX:cursor,type:"single",enemy:"bomber",x:VW+80,y:100+r*50});
    cursor+=350;
    waves.push({triggerX:cursor,type:"drop",dropType:"weapon",weapon:randomWeapon(),x:VW+50,y:150});
    cursor+=200;
    pushCrates(2); cursor+=300;
    waves.push({triggerX:cursor,type:"single",enemy:"turret",x:VW+50,y:80,top:true});
    waves.push({triggerX:cursor,type:"single",enemy:"turret",x:VW+50,y:VH-80});
    cursor+=400;
    waves.push({triggerX:cursor,type:"drop",dropType:"heal",x:VW+50,y:200});
    cursor+=300;
  }

  const endX=cursor+800;

  return {
    waves:waves,
    enemies:[],
    drops:[],
    crates:[],
    endX:endX,
    bossSpawned:false,
    bossDefeated:false,
    width:endX+VW,
    parallax:{},
    idiomPool:idiomPool,    // 全部成語
    idiomCursor:0           // 輪流抽取的游標
  };
}

const h=React.createElement;

function Game(){
  const canvasRef=React.useRef(null);
  const gRef=React.useRef(null);
  const keysRef=React.useRef({up:false,down:false,left:false,right:false,bomb:false,bombPressed:false,focus:false});

  const _s=React.useState,_e=React.useEffect,_c=React.useCallback;
  const [ui,setUi]=_s(ST.MENU);

  const [upgradePanel,setUpgradePanel]=_s(null);
  const [reviewPanel,setReviewPanel]=_s(null); // {idioms:[...], stage, clicked:Set}
  const pausedRef=React.useRef(false);
  _e(function(){pausedRef.current=paused||!!upgradePanel||!!reviewPanel;},[paused,upgradePanel,reviewPanel]);
  _e(function(){mutedRef.current=muted;},[muted]);

  // 套用升級
  function applyUpgrade(g,upg){
    const p=g.p;
    if(upg.id==="hp_up"){p.maxHp+=2;p.hp=p.maxHp;setHpLeft(p.hp);}
    else if(upg.id==="speed_up"){p.speedMul=(p.speedMul||1)*1.2;}
    else if(upg.id==="fire_up"){p.cdMul=(p.cdMul||1)*0.83;}
    else if(upg.id==="bomb_up"){p.maxBombs+=1;p.bombs=Math.min(p.maxBombs,p.bombs+1);setBombCount(p.bombs);}
    else if(upg.id==="shield"){p.invinceMul=(p.invinceMul||1)*1.5;}
    else if(upg.id==="dmg_up"){p.dmgMul=(p.dmgMul||1)*1.3;}
    else if(upg.id==="magnet"){p.magnetMul=(p.magnetMul||1)*2;}
    else if(upg.id==="heal_full"){p.hp=p.maxHp;p.bombs=p.maxBombs;setHpLeft(p.hp);setBombCount(p.bombs);}
    else if(upg.id==="twin"){p.twinShot=true;}
    p.upgrades.push(upg.id);
  }

  // 進入下一關
  function nextStage(g){
    g.stage+=1;
    g.stageStartCount=g.complete.length;
    g.lvl.bossSpawned=false;
    g.lvl.bossDefeated=false;
    g.upgradeShown=false;
    g.bossDeadTimer=0;
    g.bossActive=false;
    g.bossWarning=0;
    // 把玩家拉回畫面內
    g.p.x=80;
    g.p.y=VH/2-16;
    g.p.invince=Math.max(g.p.invince,90);
    // 把 wave 重新解鎖（重置 triggered + 推進 cursor）
    for(let i=0;i<g.lvl.waves.length;i++)g.lvl.waves[i].triggered=false;
    g.worldX=0;
    g.lvl.extraSpawnTimer=0;
    // 清除舊敵人與字幣
    g.lvl.enemies=[];
    g.eBullets=[];
    g.lvl.drops=[];

    // === 切換新的成語題庫，避免重複 ===
    const allSets=Object.keys(ALL_SETS);
    const currentSets=g.selSets||[allSets[0]];
    // 找下一組「沒選過、且還沒被用過」的學期作為新題庫
    const usedSets=new Set(g.usedSets||currentSets);
    let nextSet=null;
    for(const setName of allSets){
      if(!usedSets.has(setName)){nextSet=setName;break;}
    }
    if(nextSet){
      usedSets.add(nextSet);
      g.usedSets=Array.from(usedSets);
      // 把新題庫的成語加入池
      const newPool=shuffle(ALL_SETS[nextSet].slice());
      g.lvl.idiomPool=g.lvl.idiomPool.concat(newPool);
      g.lvl.idiomCursor=0; // 重新從頭抽

    // === 第 2 關起：難度提升 ===
    // 難度倍率：第 1 關 1×、第 2 關 1.5×、第 3 關 2×、第 4+ 關 2.5× ...

      g.wingmenCanLaunch=true;
      g.wingmenMissile=true;
    }
    setStage(g.stage);
  }

  const init=_c(function(){

    gRef.current={

        combo:0,comboTimer:0,

        dmgMul:1,
        magnetMul:1,
        invinceMul:1,

        // 能量條（每集 10 個成語充滿一格 = 1 顆必殺）
        energy:0,        // 0 ~ 10
        energyMax:10
      },
      bullets:[],

      stageDifficultyMul:1,

  const start=_c(async function(){
    init();
    setScore(0);setCollected([]);setPopup(null);setPaused(false);
    try{sfxRef.current=await ensureAudio();if(!muted)sfxRef.current.startBGM();}catch(e){}
    setUi(ST.PLAY);
  },[init,muted]);

  // KEYBOARD
  _e(function(){
    function isBombKey(e){return e.key==="b"||e.key==="B"||e.key==="x"||e.key==="X"||e.key==="Shift";}
    const d=function(e){
      if(e.repeat)return;
      if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A"){keysRef.current.left=true;e.preventDefault();}
      if(e.key==="ArrowRight"||e.key==="d"||e.key==="D"){keysRef.current.right=true;e.preventDefault();}

      }
      // V 鍵 = 僚機出擊
      if(e.key==="v"||e.key==="V"){
        keysRef.current.launchPressed=true;
        e.preventDefault();
      }
      if(e.key==="Escape"){setPaused(function(prev){return !prev;});}
    };
    const u=function(e){
      if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A")keysRef.current.left=false;
      if(e.key==="ArrowRight"||e.key==="d"||e.key==="D")keysRef.current.right=false;
      if(e.key==="ArrowUp"||e.key==="w"||e.key==="W")keysRef.current.up=false;
      if(e.key==="ArrowDown"||e.key==="s"||e.key==="S")keysRef.current.down=false;
      if(isBombKey(e))keysRef.current.bomb=false;
    };
    window.addEventListener("keydown",d);
    window.addEventListener("keyup",u);
    return function(){
      window.removeEventListener("keydown",d);
      window.removeEventListener("keyup",u);
    };
  },[]);

  function fireEnemyBullet(g,en,p){
    if(en.shootCD>0){en.shootCD--;return;}
    const df=g.df;
    const stageMul=g.stageDifficultyMul||1;
    const baseCD={fighter:90,bomber:50,turret:100,boss:30,kamikaze:99999}[en.type]||100;
    // aggro 與關卡難度共同影響射速
    en.shootCD=Math.max(8,Math.floor(baseCD*(1.5-df.aggro*0.5)/stageMul));
    const cx=en.x+en.w/2,cy=en.y+en.h/2;
    const dx=p.x+p.w/2-cx,dy=p.y+p.h/2-cy;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    const baseSpd=en.type==="boss"?4:3;
    const spd=baseSpd*(0.7+df.aggro*0.4)*Math.min(stageMul,1.5);
    const s=mutedRef.current?null:sfxRef.current;

    if(en.type==="boss"){
      // boss 多段
      const phase=Math.floor(en.frame/180)%3;
      if(phase===0){
        // 三連射
        for(let i=-1;i<=1;i++){
          const ang=Math.atan2(dy,dx)+i*0.15;
          g.eBullets.push({x:cx-5,y:cy-5,w:10,h:10,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,life:160,color:"#FF00FF",type:"normal"});
        }
      }else if(phase===1){
        // 圓周彈幕
        for(let i=0;i<8;i++){
          const ang=(i/8)*Math.PI*2;
          g.eBullets.push({x:cx-4,y:cy-4,w:8,h:8,vx:Math.cos(ang)*spd*0.85,vy:Math.sin(ang)*spd*0.85,life:200,color:"#FF66CC",type:"normal"});
        }
      }else{
        // 朝玩家直射
        g.eBullets.push({x:cx-6,y:cy-6,w:12,h:12,vx:dx/d*spd*1.2,vy:dy/d*spd*1.2,life:160,color:"#FF0099",type:"big"});
      }
      if(s)try{s.shoot();}catch(e){}
    }else if(en.type==="bomber"){
      for(let i=-1;i<=1;i++){
        g.eBullets.push({x:cx-4,y:cy+12,w:8,h:8,vx:i*1.5,vy:spd,life:140,color:"#FF6600",type:"normal"});
      }
      if(s)try{s.shoot();}catch(e){}
    }else if(en.type==="turret"){
      g.eBullets.push({x:cx-4,y:cy-4,w:8,h:8,vx:dx/d*spd,vy:dy/d*spd,life:180,color:"#FF8800",type:"normal"});
      if(s)try{s.shoot();}catch(e){}
    }else if(en.type==="fighter"){
      g.eBullets.push({x:cx-4,y:cy-3,w:7,h:6,vx:-spd-1,vy:0,life:120,color:"#FFE066",type:"normal"});
      if(s)try{s.shoot();}catch(e){}
    }
  }

  // ===== MAIN LOOP =====
  _e(function(){
    if(ui!==ST.PLAY){if(animRef.current)cancelAnimationFrame(animRef.current);return;}
    const canvas=canvasRef.current;
    if(!canvas)return;
    const ctx=canvas.getContext("2d");
    ctx.imageSmoothingEnabled=false;

    function loop(){
      const g=gRef.current;
      if(!g)return;
      if(g.gameOver||g.won)return;

      if(pausedRef.current){
        drawAll(ctx,g);
        ctx.fillStyle="rgba(0,0,0,0.65)";ctx.fillRect(0,0,VW,VH);
        ctx.fillStyle="#FFD700";ctx.font="bold 32px 'Noto Sans TC',sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
        ctx.fillText("⏸ 暫停中",VW/2,VH/2-16);
        ctx.fillStyle="rgba(255,255,255,0.6)";ctx.font="14px 'Noto Sans TC',sans-serif";
        ctx.fillText("按 ESC 繼續",VW/2,VH/2+18);
        animRef.current=requestAnimationFrame(loop);
        return;
      }

      const p=g.p;
      const s=mutedRef.current?null:sfxRef.current;
      g.frame++;
      if(p.invince>0)p.invince--;
      if(p.shootCD>0)p.shootCD--;
      if(p.comboTimer>0){p.comboTimer--;if(p.comboTimer<=0)p.combo=0;}
      if(g.shakeTimer>0)g.shakeTimer--;
      if(g.flashTimer>0)g.flashTimer--;
      if(g.bossWarning>0)g.bossWarning--;

      // 捲軸推進（Boss 出現後停止）
      if(!g.bossActive)g.worldX+=SCROLL_SPEED;

      // === BOSS 觸發條件：本關集滿 20 個成語 ===
      const stageCollected=g.complete.length-g.stageStartCount;
      if(!g.lvl.bossSpawned&&stageCollected>=20){
        g.lvl.bossSpawned=true;
        g.bossWarning=180;
        if(s)try{s.bossAlert();}catch(e){}
        setTimeout(function(){
          if(gRef.current===g&&!g.gameOver){
            // BOSS 屬性隨關卡逐關強化
            const stageMul=1+(g.stage-1)*0.4;
            const boss=makeBoss(VW+100,60,g.df,g.stage);
            boss.hp=Math.ceil(boss.hp*stageMul);
            boss.maxHp=boss.hp;
            boss.stage=g.stage;
            g.lvl.enemies.push(boss);
            // === 簡單模式：BOSS 出現時，至少生成 2 個道具 ===
            if(g.df.aggro<=0.7){
              // 補血
              g.lvl.drops.push({type:"heal",x:VW+50,y:100+Math.random()*200,w:24,h:24,collected:false,bob:0});
              // 隨機武器
              const weapons=["spread","laser","missile","plasma","wave","ice","flame","lightning","shuriken","beam"];
              const w1=weapons[Math.floor(Math.random()*weapons.length)];
              g.lvl.drops.push({type:"weapon",weapon:w1,x:VW+150,y:100+Math.random()*200,w:26,h:26,collected:false,bob:0});
              spawnText(g,VW/2,VH/2-40,"💝 簡單模式補給投放！","#5cdb95");
            }
          }
        },2200);
      }

      // === 動態補波次：若所有 wave 都觸發、但 BOSS 還沒到，持續生木箱與小敵人 ===
      if(!g.lvl.bossSpawned){
        g.lvl.extraSpawnTimer=(g.lvl.extraSpawnTimer||0)+1;
        if(g.lvl.extraSpawnTimer>=90){
          let hasPending=false;
          for(let i=0;i<g.lvl.waves.length;i++){
            if(!g.lvl.waves[i].triggered){hasPending=true;break;}
          }
          if(!hasPending){
            g.lvl.extraSpawnTimer=0;
            // 場上有未擊破的木箱時，只補木箱，不補敵人
            const stillCrate=g.lvl.crates.some(function(c){return c.alive;});
            if(stillCrate){
              // 已有木箱：不補東西，等玩家先處理
            }
            // 簡單模式（aggro<=0.7）：場上已有敵人時不補新敵人
            else if(g.df.aggro<=0.7&&g.lvl.enemies.some(function(e){return e.alive&&e.type!=="boss";})){
              // 等場上敵人清完
            }
            // 70% 機率產木箱，30% 機率產小敵編隊
            else if(Math.random()<0.7){
              spawnWave(g,{type:"crate",x:VW+80,y:50+Math.random()*270});
            }else{
              const r=Math.random();
              if(r<0.4){
                for(let k=0;k<5;k++)g.lvl.enemies.push(makeEnemy("fighter",VW+k*55,80+Math.random()*240,g.df,{movement:"sine",baseY:80+Math.random()*240,amp:50+Math.random()*60,freq:0.04+Math.random()*0.02,phase:k*0.5}));
              }else if(r<0.7){
                for(let k=0;k<4;k++)g.lvl.enemies.push(makeEnemy("kamikaze",VW+k*65,100+Math.random()*180,g.df,{}));
              }else{
                if(Math.random()<0.5)g.lvl.enemies.push(makeEnemy("turret",VW+50,Math.random()<0.5?80:VH-80,g.df,{top:Math.random()<0.5}));
                else g.lvl.enemies.push(makeEnemy("bomber",VW+80,100+Math.random()*120,g.df,{}));
              }
            }
          }
        }
      }

      // 場上有未擊破的木箱時，暫停觸發敵人（讓玩家專心學成語）
      const hasCrate=g.lvl.crates.some(function(c){return c.alive;});
      // 簡單模式（aggro<=0.7）：限制場上敵人類型只能有 1 種
      const isEasy=g.df.aggro<=0.7;
      let existingTypes=null;
      if(isEasy){
        existingTypes=new Set();
        for(let i=0;i<g.lvl.enemies.length;i++){
          const e=g.lvl.enemies[i];
          if(e.alive&&e.type!=="boss")existingTypes.add(e.type);
        }
      }

      // 觸發敵人波次
      for(let i=0;i<g.lvl.waves.length;i++){
        const w=g.lvl.waves[i];
        if(w.triggered)continue;
        if(g.worldX>=w.triggerX){
          // 木箱在場時，只觸發木箱/補給/BOSS 警告，跳過敵人波
          const isEnemyWave=w.type==="line"||w.type==="sine"||w.type==="single";
          if(hasCrate&&isEnemyWave)continue;
          // 簡單模式：場上已有一種以上敵人時，跳過會引入新類型的波
          if(isEasy&&isEnemyWave&&existingTypes.size>=1){
            // 看看這波會帶入的敵人類型
            const newType=w.enemy;
            if(newType&&!existingTypes.has(newType))continue;
          }
          w.triggered=true;
          spawnWave(g,w);
          // 觸發後立刻把這波敵人類型加入 set
          if(isEasy&&w.enemy)existingTypes.add(w.enemy);
        }
      }

      // 結束條件：BOSS 死亡後播 1.5 秒撤離動畫，再展示複習面板
      if(g.lvl.bossDefeated&&!g.upgradeShown){
        g.bossDeadTimer=(g.bossDeadTimer||0)+1;
        p.vx=4;p.vy*=0.9;
        p.x+=p.vx;p.y+=p.vy;
        if(g.bossDeadTimer>=72||p.x>VW+10){
          g.upgradeShown=true;
          // 找出本關完成的成語清單
          const stageCompletedIdioms=g.complete.slice(g.stageStartCount);
          // 彈出複習面板
          setReviewPanel({
            idioms:stageCompletedIdioms,
            stage:g.stage,
            clicked:[] // 用 array 存已點選的成語
          });
        }
        setScore(g.score);
        drawAll(ctx,g);
        animRef.current=requestAnimationFrame(loop);
        return;
      }

      // 玩家輸入
      keysRef.current.bombPressed=keysRef.current.bombPressed; // noop
      if(keysRef.current.bombPressed){keysRef.current.bombPressed=false;triggerBomb(g);}

      const moveMul=(keysRef.current.focus?0.5:1)*(p.speedMul||1);
      p.vx=(keysRef.current.right?MV:0)+(keysRef.current.left?-MV:0);
      p.vy=(keysRef.current.down?MV:0)+(keysRef.current.up?-MV:0);
      p.vx*=moveMul;p.vy*=moveMul;
      p.x+=p.vx;p.y+=p.vy;
      // 限制於畫面內
      if(p.x<0)p.x=0;
      if(p.x>VW-p.w)p.x=VW-p.w;
      if(p.y<32)p.y=32; // 留 HUD 空間
      if(p.y>VH-p.h-8)p.y=VH-p.h-8;
      p.thrustFrame++;

      // 持續射擊（自動連發）
      fireBullet(g,p);

      // === 僚機系統 ===
      if(g.wingmen&&g.wingmen.length>0){
        // 出擊鈕
        if(keysRef.current.launchPressed){
          keysRef.current.launchPressed=false;
          if(g.wingmenCanLaunch&&g.wingmenLaunched<=0){
            g.wingmenLaunched=300; // 5 秒 = 300 幀
            spawnText(g,p.x,p.y-40,"🤖 僚機出擊！","#00FFFF");
            for(let wm=0;wm<g.wingmen.length;wm++){
              g.wingmen[wm].launchTarget=null;
              g.wingmen[wm].launchX=p.x+200+wm*50;
              g.wingmen[wm].launchY=80+wm*180;
            }
          }
        }
        if(g.wingmenLaunched>0)g.wingmenLaunched--;
        for(let wi=0;wi<g.wingmen.length;wi++){
          const wm=g.wingmen[wi];
          wm.frame++;
          if(g.wingmenLaunched>0){
            // === 出擊模式：自主前進攻擊 ===
            // 找最近的敵人
            let nearest=null,nd=99999;
            for(let j=0;j<g.lvl.enemies.length;j++){
              const en=g.lvl.enemies[j];
              if(!en.alive)continue;
              const dx=en.x-wm.x,dy=en.y-wm.y;
              const dd=Math.sqrt(dx*dx+dy*dy);
              if(dd<nd){nd=dd;nearest=en;}
            }
            if(nearest){
              const dx=nearest.x-wm.x,dy=nearest.y-wm.y;
              const dd=Math.sqrt(dx*dx+dy*dy)||1;
              wm.x+=dx/dd*4;
              wm.y+=dy/dd*4;
            }else{
              // 沒敵人就往右飛
              wm.x+=3;
            }
            // 邊界
            if(wm.x>VW-30)wm.x=VW-30;
            if(wm.y<35)wm.y=35;
            if(wm.y>VH-30)wm.y=VH-30;
            // 出擊期間射速加倍
            if(wm.shootCD>0)wm.shootCD--;
            else{
              wm.shootCD=20;
              fireWingmanBullet(g,wm);
            }
            // 飛彈也加快
            if(g.wingmenMissile){
              if(wm.missileCD>0)wm.missileCD--;
              else{
                wm.missileCD=90;
                fireWingmanMissile(g,wm);
              }
            }
          }else{
            // === 平常跟隨模式 ===
            const targetX=p.x+wm.offX;
            const targetY=p.y+wm.offY;
            wm.bob+=0.05;
            const tx=targetX+Math.sin(wm.bob)*3;
            const ty=targetY+Math.cos(wm.bob)*2;
            wm.x+=(tx-wm.x)*0.15;
            wm.y+=(ty-wm.y)*0.15;
            // 每 1 秒（60 幀）發射子彈
            if(wm.shootCD>0)wm.shootCD--;
            else{
              wm.shootCD=60;
              fireWingmanBullet(g,wm);
            }
            // 第 3 關起：每 3 秒發射追蹤飛彈
            if(g.wingmenMissile){
              if(wm.missileCD>0)wm.missileCD--;
              else{
                wm.missileCD=180;
                fireWingmanMissile(g,wm);
              }
            }
          }
        }
      }

      // 玩家子彈
      for(let i=g.bullets.length-1;i>=0;i--){
        const b=g.bullets[i];
        // 追蹤導彈
        if(b.type==="missile"){
          if(!b.target||!b.target.alive){
            let best=null,bd=99999;
            for(let j=0;j<g.lvl.enemies.length;j++){
              const en=g.lvl.enemies[j];
              if(!en.alive)continue;
              const dx=en.x-b.x,dy=en.y-b.y;
              const d=Math.sqrt(dx*dx+dy*dy);
              if(d<bd){bd=d;best=en;}
            }
            b.target=best;
          }
          if(b.target&&b.target.alive){
            const dx=b.target.x+b.target.w/2-(b.x+b.w/2);
            const dy=b.target.y+b.target.h/2-(b.y+b.h/2);
            const d=Math.sqrt(dx*dx+dy*dy)||1;
            b.vx+=dx/d*0.5;b.vy+=dy/d*0.5;
            const sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
            if(sp>9){b.vx*=9/sp;b.vy*=9/sp;}
          }
          b.trail.push({x:b.x+b.w/2,y:b.y+b.h/2});
          if(b.trail.length>6)b.trail.shift();
        }
        // 波動砲：上下正弦移動
        if(b.type==="wave"){
          b.age++;
          b.y=b.initY+Math.sin(b.age*b.freq)*b.amp*b.phaseDir;
        }
        // 電漿球旋轉
        if(b.type==="plasma"||b.type==="shuriken"||b.type==="ice"){
          b.spinPhase=(b.spinPhase||0)+(b.type==="shuriken"?0.5:0.2);
        }
        // 迴旋鏢：飛出後減速、反向回來
        if(b.type==="shuriken"){
          b.age++;
          if(b.age<35){b.vx=b.initVx*(1-b.age/40);}
          else if(b.age<65){b.vx-=0.5;}
          else{b.vx=Math.max(b.vx,-13);}
          b.hit.clear(); // 回程可再傷害一次
        }
        // 火焰：擴大後消散
        if(b.type==="flame"){
          b.age++;
          b.w+=0.6;b.h+=0.6;
          b.vx*=0.92;
        }
        b.x+=b.vx;b.y+=b.vy;b.life--;

        // beam 持續光束：每幀重設位置在玩家前方
        if(b.type==="beam"){
          b.x=p.x+p.w;
          b.y=p.y+p.h/2-3;
          b.w=VW-b.x;
        }

        if(b.life<=0||b.x<-80||b.x>VW+80||b.y<-50||b.y>VH+50){g.bullets.splice(i,1);continue;}
        // 撞敵
        let removed=false;
        for(let j=0;j<g.lvl.enemies.length;j++){
          const en=g.lvl.enemies[j];
          if(!en.alive||b.hit.has(en))continue;
          if(rectIntersect(b,en)){
            damageEnemy(g,en,b.dmg);
            b.hit.add(en);
            // 冰凍效果
            if(b.type==="ice"){en.frozen=Math.max(en.frozen||0,90);}
            // 閃電鏈：跳到附近其他敵人
            if(b.type==="lightning"&&b.chainsLeft>0){
              b.chainsLeft--;
              let next=null,nd=180;
              for(let k=0;k<g.lvl.enemies.length;k++){
                const e2=g.lvl.enemies[k];
                if(!e2.alive||b.hit.has(e2))continue;
                const dx=e2.x-en.x,dy=e2.y-en.y;
                const dd=Math.sqrt(dx*dx+dy*dy);
                if(dd<nd){nd=dd;next=e2;}
              }
              if(next){
                b.segments.push({from:{x:en.x+en.w/2,y:en.y+en.h/2},to:{x:next.x+next.w/2,y:next.y+next.h/2},life:14});
                damageEnemy(g,next,b.dmg);
                b.hit.add(next);
                // 繼續鏈
                let last=next;
                while(b.chainsLeft>0){
                  let nx=null,nxd=180;
                  for(let k=0;k<g.lvl.enemies.length;k++){
                    const e3=g.lvl.enemies[k];
                    if(!e3.alive||b.hit.has(e3))continue;
                    const dx=e3.x-last.x,dy=e3.y-last.y;
                    const dd=Math.sqrt(dx*dx+dy*dy);
                    if(dd<nxd){nxd=dd;nx=e3;}
                  }
                  if(!nx)break;
                  b.chainsLeft--;
                  b.segments.push({from:{x:last.x+last.w/2,y:last.y+last.h/2},to:{x:nx.x+nx.w/2,y:nx.y+nx.h/2},life:14});
                  damageEnemy(g,nx,b.dmg);
                  b.hit.add(nx);
                  last=nx;
                }
              }
            }
            if(!b.piercing){
              if(b.explode)spawnExplosion(g,b.x+b.w/2,b.y+b.h/2,70);
              g.bullets.splice(i,1);
              removed=true;
              break;
            }
          }
        }
        if(removed)continue;
        // 撞箱
        for(let j=0;j<g.lvl.crates.length;j++){
          const cr=g.lvl.crates[j];
          if(!cr.alive)continue;
          if(rectIntersect(b,cr)){
            damageCrate(g,cr,b.dmg);
            if(!b.piercing){
              if(b.explode)spawnExplosion(g,b.x+b.w/2,b.y+b.h/2,70);
              g.bullets.splice(i,1);
              break;
            }
          }
        }
        // 更新閃電鏈線段倒數
        if(b.type==="lightning"&&b.segments){
          for(let k=b.segments.length-1;k>=0;k--){
            b.segments[k].life--;
            if(b.segments[k].life<=0)b.segments.splice(k,1);
          }
        }
      }

      // 敵彈
      for(let i=g.eBullets.length-1;i>=0;i--){
        const b=g.eBullets[i];
        b.x+=b.vx;b.y+=b.vy;b.life--;
        if(b.life<=0||b.x<-50||b.x>VW+50||b.y<-50||b.y>VH+50){g.eBullets.splice(i,1);continue;}
        // 僚機擋彈（不扣血，子彈消失）
        if(g.wingmen&&g.wingmen.length>0){
          let blocked=false;
          for(let wi=0;wi<g.wingmen.length;wi++){
            const wm=g.wingmen[wi];
            if(rectIntersect(b,wm)){
              // 僚機閃光（擋彈視覺）
              wm.hitFlash=8;
              spawnBurst(g,b.x+b.w/2,b.y+b.h/2,4,["#00FFFF","#fff"],3);
              g.eBullets.splice(i,1);
              blocked=true;
              break;
            }
          }
          if(blocked)continue;
        }
        if(p.invince<=0&&rectIntersect(b,p)){hurtPlayer(g);g.eBullets.splice(i,1);}
      }

      // 敵人
      for(let i=0;i<g.lvl.enemies.length;i++){
        const en=g.lvl.enemies[i];
        if(!en.alive)continue;
        en.frame++;
        const aggro=g.df.aggro;

        // 冰凍：暫停所有移動與射擊
        if(en.frozen>0){
          en.frozen--;
          // 還是要檢查碰撞
          if(en.alive&&rectIntersect(p,en)&&p.invince<=0){
            if(en.type==="kamikaze"){damageEnemy(g,en,99);spawnExplosion(g,en.x+en.w/2,en.y+en.h/2,40);}
            hurtPlayer(g);
          }
          continue;
        }

        if(en.type==="fighter"){
          // 困難時 fighter 移動更快、會主動朝玩家略偏移
          en.x+=en.vx*(0.85+aggro*0.25);
          if(en.movement==="sine"){
            en.y=en.baseY+Math.sin(en.frame*en.freq+en.phase)*en.amp;
            // aggro 高時加上對玩家 y 的輕微追蹤
            if(aggro>1){
              const dy=p.y-en.y;
              en.baseY+=Math.sign(dy)*0.3*(aggro-1);
            }
          }else{
            en.y+=en.vy;
          }
          fireEnemyBullet(g,en,p);
        }else if(en.type==="kamikaze"){
          // aggro 越高，追擊力與最大速度越高
          const dx=p.x-en.x,dy=p.y-en.y;
          const d=Math.sqrt(dx*dx+dy*dy)||1;
          const accel=0.04+aggro*0.04;
          en.vx+=(dx/d-en.vx*0.05)*accel;
          en.vy+=(dy/d-en.vy*0.05)*accel;
          const maxSp=2.5+aggro*1.8;
          const sp=Math.sqrt(en.vx*en.vx+en.vy*en.vy);
          if(sp>maxSp){en.vx*=maxSp/sp;en.vy*=maxSp/sp;}
          en.x+=en.vx;en.y+=en.vy;
        }else if(en.type==="bomber"){
          en.x+=en.vx;
          if(en.x>VW*0.55)en.vx=Math.max(en.vx-0.02*(0.8+aggro*0.3),-0.5*(0.7+aggro*0.4));
          else en.vx=Math.min(en.vx+0.01,0);
          // aggro 高時轟炸機略追擊玩家垂直方向
          if(aggro>1){
            const dy=p.y-en.y;
            en.y+=Math.sign(dy)*Math.min(Math.abs(dy)*0.01,0.6)*(aggro-0.5);
          }
          fireEnemyBullet(g,en,p);
        }else if(en.type==="turret"){
          if(!g.bossActive)en.x-=SCROLL_SPEED;
          fireEnemyBullet(g,en,p);
        }else if(en.type==="boss"){
          if(!en.active){
            en.x=Math.max(en.x-1.2,VW-en.w-30);
            if(en.x<=VW-en.w-30){en.active=true;g.bossActive=true;}
          }else{
            // aggro 越高，boss 擺動越快
            en.bossPhase=(en.bossPhase||0)+0.012+aggro*0.008;
            en.y=60+Math.sin(en.bossPhase)*60;
            en.x=VW-en.w-30+Math.sin(en.bossPhase*0.5)*20;
            fireEnemyBullet(g,en,p);
          }
        }

        // 玩家撞敵 (kamikaze 一撞自爆)
        if(en.alive&&rectIntersect(p,en)&&p.invince<=0){
          if(en.type==="kamikaze"){
            damageEnemy(g,en,99);
            spawnExplosion(g,en.x+en.w/2,en.y+en.h/2,40);
          }
          hurtPlayer(g);
        }

        // 離開畫面則消失
        if(en.x<-100||en.x>VW+400&&en.type!=="boss"&&!en.beforeBoss){
          // 還沒進場前在 VW+ 範圍內等，不刪除
        }
        if(en.x<-100||en.y>VH+100||en.y<-100){en.alive=false;}
      }

      // crates
      for(let i=0;i<g.lvl.crates.length;i++){
        const cr=g.lvl.crates[i];
        if(!cr.alive)continue;
        if(!g.bossActive)cr.x-=SCROLL_SPEED;
        // 空中飄浮
        cr.bobPhase+=0.04;
        cr.y=cr.baseY+Math.sin(cr.bobPhase)*cr.bobAmp;
        if(rectIntersect(p,cr)&&p.invince<=0){damageCrate(g,cr,1);hurtPlayer(g);}
        if(cr.x<-80){cr.alive=false;}
      }

      // drops
      for(let i=g.lvl.drops.length-1;i>=0;i--){
        const d=g.lvl.drops[i];
        if(d.collected){g.lvl.drops.splice(i,1);continue;}

        if(d.floating){
          // 飄浮型字幣：朝預定的 targetX/Y 緩動定位，到位後鎖定在原處飄浮
          if(!d.locked){
            // 先用初始速度散開一小段
            d.x+=d.vx;
            d.y+=d.vy;
            d.vx*=0.92;
            d.vy*=0.92;
            // 接近目標位置時，緩動鎖定
            if(d.targetX!==undefined){
              const dx=d.targetX-d.x,dy=d.targetY-d.y;
              const dd=Math.sqrt(dx*dx+dy*dy);
              if(dd<2.5){
                d.x=d.targetX;d.y=d.targetY;
                d.locked=true;
                d.baseY=d.y;
                d.bobAmp=3+Math.random()*2;
              }else{
                // 朝目標緩動
                d.x+=dx*0.18;
                d.y+=dy*0.18;
              }
            }
          }
          if(d.locked){
            // 跟著世界捲軸往左飄
            if(!g.bossActive)d.x-=SCROLL_SPEED;
            d.bob=(d.bob||0)+0.06;
            d.y=d.baseY+Math.sin(d.bob)*d.bobAmp;
          }
          // 邊界保護
          if(d.y<40){d.y=40;}
          if(d.y>VH-50){d.y=VH-50;}
        }else if(d.vy!==undefined){
          // 舊行為（兼容）
          d.vy+=0.15;
          if(d.vy>5)d.vy=5;
          d.x+=d.vx;d.y+=d.vy;
          d.vx*=0.96;
          if(d.y>VH-30){d.y=VH-30;d.vy*=-0.4;d.vx*=0.8;}
        }else{
          // 武器、補血等補給：靜止只跟著捲軸左飄
          if(!g.bossActive)d.x-=SCROLL_SPEED+0.5;
        }
        if(d.life!==undefined){d.life--;if(d.life<=0){g.lvl.drops.splice(i,1);continue;}}
        if(d.x<-60){g.lvl.drops.splice(i,1);continue;}
        // 磁吸：玩家靠近時拉過去
        const magnetRange=80*(p.magnetMul||1);
        if(dist(p,d)<magnetRange){
          const dx=p.x+p.w/2-(d.x+d.w/2),dy=p.y+p.h/2-(d.y+d.h/2);
          const dd=Math.sqrt(dx*dx+dy*dy)||1;
          d.x+=dx/dd*3.5;d.y+=dy/dd*3.5;
        }
        if(rectIntersect(p,d)){
          d.collected=true;
          if(d.type==="weapon"){
            const w=WEAPONS[d.weapon];
            p.weapon=d.weapon;
            // 不同武器不同彈藥
            const ammoMap={missile:35,laser:90,spread:70,plasma:50,wave:80,ice:60,flame:140,lightning:30,shuriken:50,beam:150};
            p.weaponAmmo=ammoMap[d.weapon]||60;
            setCurWeapon(d.weapon);
            spawnText(g,d.x,d.y-10,w.icon+" "+w.name,w.color);
            spawnBurst(g,d.x+d.w/2,d.y+d.h/2,12,[w.color,"#fff"],5);
            if(s)try{s.powerUp();}catch(e){}
          }else if(d.type==="heal"){
            if(p.hp<p.maxHp){p.hp++;setHpLeft(p.hp);spawnText(g,d.x,d.y-10,"+❤️","#FF6B6B");}
            else{g.score+=200;spawnText(g,d.x,d.y-10,"+200","#FFD700");}
            spawnBurst(g,d.x+d.w/2,d.y+d.h/2,10,["#FF6B6B","#fff"],5);
            if(s)try{s.powerUp();}catch(e){}
          }else if(d.type==="bomb"){
            if(p.bombs<p.maxBombs){p.bombs++;setBombCount(p.bombs);spawnText(g,d.x,d.y-10,"+💣","#FFD700");}
            else{g.score+=500;spawnText(g,d.x,d.y-10,"+500","#FFD700");}
            if(s)try{s.powerUp();}catch(e){}
          }else if(d.type==="coin"){
            g.score+=100;
            p.combo++;p.comboTimer=120;
            if(p.combo>1){const bonus=p.combo*20;g.score+=bonus;spawnText(g,d.x,d.y-15,p.combo+" 連擊 +"+bonus,"#FF69B4");}
            if(s)try{s.coin(g.frame%4);}catch(e){}
            if(!g.charMap[d.idiom])g.charMap[d.idiom]=new Set();
            g.charMap[d.idiom].add(d.idx);
            if(g.charMap[d.idiom].size===4){
              g.complete.push(d.idiom);
              g.score+=1000;
              if(s)try{s.idiomComplete();}catch(e){}
              spawnBurst(g,p.x+p.w/2,p.y,20,["#FFD700","#FF6B6B","#4ECDC4","#E056A0","#fff"],8);
              spawnText(g,p.x,p.y-30,"✨ "+d.idiom+" +1000","#FFD700");
              if(p.hp<p.maxHp){p.hp++;setHpLeft(p.hp);spawnText(g,p.x+30,p.y-15,"+❤️","#FF6B6B");}
              // === 累積能量 ===
              p.energy++;
              if(p.energy>=p.energyMax){
                p.energy=0;
                if(p.bombs<p.maxBombs)p.bombs++;
                else g.score+=500; // 已滿則加分
                setBombCount(p.bombs);
                spawnText(g,p.x,p.y-50,"⚡ 必殺 +1！","#FFD700");
                spawnBurst(g,p.x+p.w/2,p.y+p.h/2,25,["#FFD700","#fff","#FFAA00"],10);
                if(s)try{s.powerUp();}catch(e){}
              }
            }
            spawnBurst(g,d.x+d.w/2,d.y+d.h/2,5,["#FFD700","#fff7cc"],3);
          }
        }
      }

      // 爆炸
      for(let i=g.explosions.length-1;i>=0;i--){
        const ex=g.explosions[i];
        ex.r+=(ex.maxR-ex.r)*0.2;
        ex.life--;
        if(ex.life<=0){g.explosions.splice(i,1);continue;}
      }

      // 粒子 / 文字
      g.particles=g.particles.filter(function(pt){pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.08;pt.life--;return pt.life>0;});
      g.texts=g.texts.filter(function(t){t.y+=t.vy;t.life--;return t.life>0;});

      // 星空背景
      for(let i=0;i<g.stars.length;i++){
        g.stars[i].x+=g.stars[i].vx;
        if(g.stars[i].x<0){g.stars[i].x=VW;g.stars[i].y=Math.random()*VH;}
      }
      for(let i=0;i<g.farStars.length;i++){
        g.farStars[i].x+=g.farStars[i].vx;
        if(g.farStars[i].x<0){g.farStars[i].x=VW;g.farStars[i].y=Math.random()*VH;}
      }
      for(let i=0;i<g.clouds.length;i++){
        g.clouds[i].x+=g.clouds[i].vx;
        if(g.clouds[i].x<-200){g.clouds[i].x=VW+50;g.clouds[i].y=Math.random()*VH;}
      }

      setScore(g.score);

      drawAll(ctx,g);

      if(g.gameOver){
        if(s)try{s.stopBGM();s.gameOver();}catch(e){}
        setCollected([].concat(g.complete));
        setHi(function(prev){return Math.max(prev,g.score);});
        setTimeout(function(){setUi(ST.OVER);},900);
        return;
      }
      if(g.won){
        if(s)try{s.stopBGM();s.win();}catch(e){}
        setCollected([].concat(g.complete));
        setHi(function(prev){return Math.max(prev,g.score);});
        setTimeout(function(){setUi(ST.WIN);},1200);
        return;
      }

      animRef.current=requestAnimationFrame(loop);
    }
    animRef.current=requestAnimationFrame(loop);
    return function(){if(animRef.current)cancelAnimationFrame(animRef.current);};
  },[ui]);

  function spawnWave(g,w){
    const df=g.df;
    const s=mutedRef.current?null:sfxRef.current;
    if(w.type==="line"){
      for(let i=0;i<w.count;i++){
        g.lvl.enemies.push(makeEnemy(w.enemy,VW+i*w.gap,w.y,df,{movement:"straight"}));
      }
    }else if(w.type==="sine"){
      for(let i=0;i<w.count;i++){
        g.lvl.enemies.push(makeEnemy(w.enemy,VW+i*w.gap,VH/2,df,{movement:"sine",baseY:VH/2,amp:w.amp,freq:w.freq,phase:i*0.5}));
      }
    }else if(w.type==="single"){
      const opts={};
      if(w.top)opts.top=true;
      g.lvl.enemies.push(makeEnemy(w.enemy,w.x,w.y,df,opts));
    }else if(w.type==="crate"){
      // 動態挑一個「尚未完成」的成語，輪流出題
      const pool=g.lvl.idiomPool;
      let chosen=null;
      const completedSet=new Set(g.complete);
      // 從游標位置開始繞一圈找未完成的
      for(let k=0;k<pool.length;k++){
        const idx=(g.lvl.idiomCursor+k)%pool.length;
        const candidate=pool[idx];
        if(!completedSet.has(candidate)){
          chosen=candidate;
          g.lvl.idiomCursor=(idx+1)%pool.length;
          break;
        }
      }
      // 全部都完成了？略過這個木箱
      if(!chosen)return;
      const py=w.y!==undefined?w.y:60+Math.random()*260;
      g.lvl.crates.push({
        x:w.x,y:py,w:38,h:38,
        baseY:py,bobPhase:Math.random()*Math.PI*2,bobAmp:8+Math.random()*8,
        hp:3,maxHp:3,idiom:chosen,alive:true
      });
    }else if(w.type==="drop"){
      if(w.dropType==="weapon"){
        g.lvl.drops.push({type:"weapon",weapon:w.weapon,x:w.x,y:w.y,w:26,h:26,collected:false,bob:0});
      }else if(w.dropType==="heal"){
        g.lvl.drops.push({type:"heal",x:w.x,y:w.y,w:24,h:24,collected:false,bob:0});
      }
    }else if(w.type==="bossWarning"){
      g.bossWarning=180;
      if(s)try{s.bossAlert();}catch(e){}
    }else if(w.type==="boss"){
      g.lvl.enemies.push(makeBoss(w.x,w.y,df));
    }
  }

  function makeEnemy(type,x,y,df,opts){
    opts=opts||{};
    if(type==="fighter"){
      return {type:"fighter",x:x,y:y,w:36,h:26,vx:-2,vy:0,
        hp:Math.ceil(2*df.enemyHp),maxHp:Math.ceil(2*df.enemyHp),
        alive:true,shootCD:60+Math.floor(Math.random()*40),frame:0,
        movement:opts.movement||"straight",baseY:opts.baseY||y,amp:opts.amp||0,freq:opts.freq||0,phase:opts.phase||0};
    }
    if(type==="kamikaze"){
      return {type:"kamikaze",x:x,y:y,w:30,h:22,vx:-3,vy:0,
        hp:Math.ceil(1*df.enemyHp),maxHp:Math.ceil(1*df.enemyHp),
        alive:true,shootCD:99999,frame:0};
    }
    if(type==="bomber"){
      return {type:"bomber",x:x,y:y,w:60,h:42,vx:-1.5,vy:0,
        hp:Math.ceil(8*df.enemyHp),maxHp:Math.ceil(8*df.enemyHp),
        alive:true,shootCD:90,frame:0};
    }
    if(type==="turret"){
      return {type:"turret",x:x,y:y,w:36,h:28,vx:0,vy:0,
        hp:Math.ceil(5*df.enemyHp),maxHp:Math.ceil(5*df.enemyHp),
        alive:true,shootCD:120,frame:0,top:opts.top||false};
    }
    return null;
  }
  function makeBoss(x,y,df,stage){
    // 不同關卡的 BOSS 主題：1=皇冠戰艦, 2=機械蛛, 3=火焰之心, 4+=循環
    const theme=((stage||1)-1)%3;
    return {type:"boss",x:x,y:y,w:120,h:140,vx:0,vy:0,
      hp:df.bossHp,maxHp:df.bossHp,
      alive:true,shootCD:60,frame:0,bossPhase:0,active:false,
      theme:theme,stage:stage||1};
  }

  // ===== DRAW =====
  function drawAll(ctx,g){
    const shake=g.shakeTimer>0?(Math.random()-0.5)*7:0;
    ctx.save();
    ctx.translate(shake,shake);

    // 太空 / 雲層背景
    const sky=ctx.createLinearGradient(0,0,0,VH);
    sky.addColorStop(0,"#0a0a3c");
    sky.addColorStop(0.5,"#1a1a5e");
    sky.addColorStop(1,"#1a1a3c");
    ctx.fillStyle=sky;
    ctx.fillRect(0,0,VW,VH);

    // 遠星
    for(let i=0;i<g.farStars.length;i++){
      const st=g.farStars[i];
      ctx.fillStyle=st.col;
      ctx.fillRect(st.x,st.y,st.size,st.size);
    }
    // 雲（半透明大圈）
    for(let i=0;i<g.clouds.length;i++){
      const c=g.clouds[i];
      ctx.fillStyle="rgba(180,200,255,"+c.alpha+")";
      ctx.beginPath();
      ctx.arc(c.x,c.y,c.size,0,Math.PI*2);
      ctx.arc(c.x+c.size*0.6,c.y+c.size*0.2,c.size*0.7,0,Math.PI*2);
      ctx.arc(c.x-c.size*0.5,c.y-c.size*0.1,c.size*0.6,0,Math.PI*2);
      ctx.fill();
    }
    // 近星
    for(let i=0;i<g.stars.length;i++){
      const st=g.stars[i];
      ctx.fillStyle="rgba(255,255,255,"+(0.6+st.size*0.3).toFixed(2)+")";
      ctx.fillRect(st.x,st.y,st.size,st.size);
    }

    // 地面（底部裝飾）
    const groundG=ctx.createLinearGradient(0,VH-30,0,VH);
    groundG.addColorStop(0,"rgba(40,30,20,0)");
    groundG.addColorStop(1,"rgba(60,40,20,0.6)");
    ctx.fillStyle=groundG;
    ctx.fillRect(0,VH-30,VW,30);
    // 地形剪影（前景）
    ctx.fillStyle="rgba(20,10,30,0.8)";
    const off=(g.worldX*0.8)%180;
    for(let i=-1;i<6;i++){
      const bx=i*180-off;
      ctx.beginPath();
      ctx.moveTo(bx,VH);
      ctx.lineTo(bx,VH-15);
      ctx.lineTo(bx+30,VH-22);
      ctx.lineTo(bx+50,VH-12);
      ctx.lineTo(bx+80,VH-25);
      ctx.lineTo(bx+110,VH-15);
      ctx.lineTo(bx+140,VH-30);
      ctx.lineTo(bx+170,VH-12);
      ctx.lineTo(bx+180,VH);
      ctx.fill();
    }

    // Crates
    for(let i=0;i<g.lvl.crates.length;i++){
      const cr=g.lvl.crates[i];
      if(!cr.alive)continue;
      drawCrate(ctx,cr,g.frame);
    }

    // Drops
    for(let i=0;i<g.lvl.drops.length;i++){
      const d=g.lvl.drops[i];
      if(d.collected)continue;
      drawDrop(ctx,d,g.frame,i);
    }

    // Enemies
    for(let i=0;i<g.lvl.enemies.length;i++){
      const en=g.lvl.enemies[i];
      if(!en.alive)continue;
      drawEnemy(ctx,en,g.frame);
    }

    // 子彈
    for(let i=0;i<g.bullets.length;i++)drawBullet(ctx,g.bullets[i]);

    // 敵彈
    for(let i=0;i<g.eBullets.length;i++){
      const b=g.eBullets[i];
      ctx.save();
      ctx.shadowColor=b.color;ctx.shadowBlur=8;
      ctx.fillStyle=b.color;
      ctx.beginPath();ctx.arc(b.x+b.w/2,b.y+b.h/2,b.w/2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#fff";
      ctx.beginPath();ctx.arc(b.x+b.w/2,b.y+b.h/2,b.w/4,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }

    // 爆炸
    for(let i=0;i<g.explosions.length;i++){
      const ex=g.explosions[i];
      const t=ex.life/30;
      const grad=ctx.createRadialGradient(ex.x,ex.y,ex.r*0.2,ex.x,ex.y,ex.r);
      grad.addColorStop(0,"rgba(255,255,200,"+(t*0.9).toFixed(2)+")");
      grad.addColorStop(0.5,"rgba(255,140,0,"+(t*0.7).toFixed(2)+")");
      grad.addColorStop(1,"rgba(255,0,0,0)");
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.arc(ex.x,ex.y,ex.r,0,Math.PI*2);ctx.fill();
    }

    // Player
    drawPlayer(ctx,g.p,g.frame);

    // 繪製僚機
    if(g.wingmen&&g.wingmen.length>0){
      for(let wi=0;wi<g.wingmen.length;wi++){
        drawWingman(ctx,g.wingmen[wi],g.frame,g.wingmenLaunched>0);
      }
    }

    // 粒子
    for(let i=0;i<g.particles.length;i++){
      const p2=g.particles[i];
      ctx.globalAlpha=Math.min(p2.life/30,1);
      ctx.fillStyle=p2.color;
      ctx.beginPath();ctx.arc(p2.x,p2.y,p2.size||3,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;

    // 文字
    for(let i=0;i<g.texts.length;i++){
      const t=g.texts[i];
      ctx.globalAlpha=Math.min(t.life/20,1);
      ctx.fillStyle=t.color;
      ctx.font="bold 14px 'Noto Sans TC',sans-serif";
      ctx.textAlign="center";
      ctx.strokeStyle="rgba(0,0,0,0.85)";ctx.lineWidth=3;
      ctx.strokeText(t.text,t.x,t.y);
      ctx.fillText(t.text,t.x,t.y);
    }
    ctx.globalAlpha=1;

    // 紅閃
    if(g.flashTimer>0){
      ctx.fillStyle="rgba(255,255,255,"+g.flashTimer*0.04+")";
      ctx.fillRect(0,0,VW,VH);
    }

    // Boss warning
    if(g.bossWarning>0){
      const alpha=Math.sin(g.frame*0.3)*0.5+0.5;
      ctx.fillStyle="rgba(255,0,0,"+(alpha*0.25).toFixed(2)+")";
      ctx.fillRect(0,0,VW,VH);
      ctx.fillStyle="#FF0000";
      ctx.font="bold 38px 'Noto Sans TC',sans-serif";
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.strokeStyle="#000";ctx.lineWidth=4;
      ctx.strokeText("⚠ 集滿 20 成語 — BOSS 出現！",VW/2,VH/2);
      ctx.fillText("⚠ 集滿 20 成語 — BOSS 出現！",VW/2,VH/2);
    }

    // HUD
    drawHUD(ctx,g);

    ctx.restore();
  }

  function drawWingman(ctx,wm,frame,launched){
    const px=wm.x,py=wm.y;
    if(wm.hitFlash>0)wm.hitFlash--;
    ctx.save();
    // 擋彈閃光（白色光環）
    if(wm.hitFlash>0){
      ctx.strokeStyle="rgba(255,255,255,"+(wm.hitFlash/8)+")";
      ctx.lineWidth=3;
      ctx.shadowColor="#fff";ctx.shadowBlur=12;
      ctx.beginPath();
      ctx.ellipse(px+wm.w/2,py+wm.h/2,wm.w/2+6,wm.h/2+6,0,0,Math.PI*2);
      ctx.stroke();
      ctx.shadowBlur=0;
    }
    // 出擊時發紅光、平常發青光
    const glow=launched?"#FF4500":"#00FFFF";
    ctx.shadowColor=glow;ctx.shadowBlur=launched?12:6;

    // 機翼
    ctx.fillStyle=launched?"#8b3a3a":"#2a4a5e";
    ctx.beginPath();
    ctx.moveTo(px+5,py);
    ctx.lineTo(px+wm.w-3,py+2);
    ctx.lineTo(px+wm.w-5,py+6);
    ctx.lineTo(px+5,py+6);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(px+5,py+wm.h);
    ctx.lineTo(px+wm.w-3,py+wm.h-2);
    ctx.lineTo(px+wm.w-5,py+wm.h-6);
    ctx.lineTo(px+5,py+wm.h-6);
    ctx.fill();

    // 機身（小型菱形）
    const bg=ctx.createLinearGradient(px,py,px+wm.w,py);
    if(launched){
      bg.addColorStop(0,"#aa3030");
      bg.addColorStop(0.5,"#FF4500");
      bg.addColorStop(1,"#aa3030");
    }else{
      bg.addColorStop(0,"#2a4a5e");
      bg.addColorStop(0.5,"#5cabe0");
      bg.addColorStop(1,"#2a4a5e");
    }
    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.moveTo(px+2,py+wm.h/2);
    ctx.lineTo(px+wm.w*0.4,py+3);
    ctx.lineTo(px+wm.w,py+wm.h/2-1);
    ctx.lineTo(px+wm.w,py+wm.h/2+1);
    ctx.lineTo(px+wm.w*0.4,py+wm.h-3);
    ctx.fill();
    ctx.shadowBlur=0;

    // 機頭尖
    ctx.fillStyle="#FFD700";
    ctx.beginPath();
    ctx.moveTo(px+wm.w-2,py+wm.h/2-2);
    ctx.lineTo(px+wm.w+5,py+wm.h/2);
    ctx.lineTo(px+wm.w-2,py+wm.h/2+2);
    ctx.fill();

    // 駕駛艙小窗
    ctx.fillStyle=launched?"#FFFF00":"#00FFFF";
    ctx.beginPath();
    ctx.ellipse(px+wm.w*0.55,py+wm.h/2,3.5,2,0,0,Math.PI*2);
    ctx.fill();

    // 噴射尾流
    const thrust=Math.sin(frame*0.4)*0.5+1;
    const tg=ctx.createLinearGradient(px-8,0,px,0);
    tg.addColorStop(0,launched?"rgba(255,80,0,0)":"rgba(0,200,255,0)");
    tg.addColorStop(1,launched?"rgba(255,255,200,0.8)":"rgba(255,255,255,0.7)");
    ctx.fillStyle=tg;
    ctx.beginPath();
    ctx.moveTo(px-6*thrust,py+wm.h*0.4);
    ctx.lineTo(px+2,py+wm.h*0.4);
    ctx.lineTo(px+2,py+wm.h*0.6);
    ctx.lineTo(px-6*thrust,py+wm.h*0.6);
    ctx.fill();

    // 出擊狀態 - 外圍紅色光環
    if(launched){
      ctx.strokeStyle="rgba(255,100,0,"+(0.4+Math.sin(frame*0.3)*0.3)+")";
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.ellipse(px+wm.w/2,py+wm.h/2,wm.w/2+5,wm.h/2+5,0,0,Math.PI*2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPlayer(ctx,p,frame){
    const px=p.x,py=p.y;
    const g=gRef.current;
    const sh=g&&g.ship?g.ship:{color1:"#3a7eb5",color2:"#5cabe0",accent:"#FFD700",cockpit:"#00FFFF"};
    ctx.save();
    if(p.invince>0&&frame%6<3)ctx.globalAlpha=0.4;

    // 引擎噴射
    const thrust=Math.sin(frame*0.4)*0.5+1;
    const tg=ctx.createLinearGradient(px-12,0,px,0);
    tg.addColorStop(0,"rgba(0,200,255,0)");
    tg.addColorStop(0.5,"rgba(0,200,255,0.5)");
    tg.addColorStop(1,"rgba(255,255,255,0.9)");
    ctx.fillStyle=tg;
    ctx.beginPath();
    ctx.moveTo(px-10*thrust,py+p.h*0.35);
    ctx.lineTo(px+2,py+p.h*0.42);
    ctx.lineTo(px+2,py+p.h*0.58);
    ctx.lineTo(px-10*thrust,py+p.h*0.65);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(px-6*thrust,py+p.h*0.15);
    ctx.lineTo(px+4,py+p.h*0.22);
    ctx.lineTo(px+4,py+p.h*0.32);
    ctx.lineTo(px-6*thrust,py+p.h*0.39);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(px-6*thrust,py+p.h*0.68);
    ctx.lineTo(px+4,py+p.h*0.75);
    ctx.lineTo(px+4,py+p.h*0.85);
    ctx.lineTo(px-6*thrust,py+p.h*0.92);
    ctx.fill();

    // 機翼下
    ctx.fillStyle=sh.color1;
    ctx.beginPath();
    ctx.moveTo(px+8,py+p.h);
    ctx.lineTo(px+p.w-6,py+p.h-2);
    ctx.lineTo(px+p.w-10,py+p.h-10);
    ctx.lineTo(px+12,py+p.h-10);
    ctx.fill();
    // 機翼上
    ctx.beginPath();
    ctx.moveTo(px+8,py);
    ctx.lineTo(px+p.w-6,py+2);
    ctx.lineTo(px+p.w-10,py+10);
    ctx.lineTo(px+12,py+10);
    ctx.fill();

    // 主機身（菱形）
    const bg=ctx.createLinearGradient(px,py,px+p.w,py);
    bg.addColorStop(0,sh.color1);
    bg.addColorStop(0.5,sh.color2);
    bg.addColorStop(1,sh.color1);
    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.moveTo(px+2,py+p.h/2);
    ctx.lineTo(px+p.w*0.4,py+4);
    ctx.lineTo(px+p.w,py+p.h/2-2);
    ctx.lineTo(px+p.w,py+p.h/2+2);
    ctx.lineTo(px+p.w*0.4,py+p.h-4);
    ctx.fill();

    // 機頭尖
    ctx.fillStyle=sh.accent;
    ctx.beginPath();
    ctx.moveTo(px+p.w-2,py+p.h/2-3);
    ctx.lineTo(px+p.w+8,py+p.h/2);
    ctx.lineTo(px+p.w-2,py+p.h/2+3);
    ctx.fill();

    // 駕駛艙
    ctx.fillStyle=sh.cockpit;
    ctx.beginPath();
    ctx.ellipse(px+p.w*0.55,py+p.h/2,7,4,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="rgba(255,255,255,0.8)";
    ctx.beginPath();
    ctx.ellipse(px+p.w*0.55,py+p.h/2-1,3,1.5,0,0,Math.PI*2);
    ctx.fill();

    // 高光
    ctx.fillStyle="rgba(255,255,255,0.4)";
    ctx.beginPath();
    ctx.moveTo(px+p.w*0.3,py+p.h/2-6);
    ctx.lineTo(px+p.w*0.7,py+p.h/2-4);
    ctx.lineTo(px+p.w*0.7,py+p.h/2-2);
    ctx.lineTo(px+p.w*0.3,py+p.h/2-4);
    ctx.fill();

    // 兩側機砲
    ctx.fillStyle="#222";
    ctx.fillRect(px+p.w-8,py+5,4,3);
    ctx.fillRect(px+p.w-8,py+p.h-8,4,3);

    ctx.restore();

    // 無敵時護盾
    if(p.invince>0){
      ctx.strokeStyle="rgba(0,191,255,"+(0.3+Math.sin(frame*0.2)*0.2).toFixed(2)+")";
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.ellipse(p.x+p.w/2,p.y+p.h/2,p.w/2+8,p.h/2+8,0,0,Math.PI*2);
      ctx.stroke();
    }
  }

  function drawEnemy(ctx,en,frame){
    const ex=en.x,ey=en.y;
    // 冰凍時藍色色調
    if(en.frozen>0){
      ctx.save();
      ctx.filter="hue-rotate(180deg) brightness(1.2) saturate(2)";
    }
    drawEnemyBody(ctx,en,frame,ex,ey);
    if(en.frozen>0){
      ctx.restore();
      // 冰塊外框
      ctx.strokeStyle="rgba(136,229,255,0.85)";ctx.lineWidth=2;
      ctx.shadowColor="#88E5FF";ctx.shadowBlur=12;
      ctx.strokeRect(en.x-3,en.y-3,en.w+6,en.h+6);
      ctx.shadowBlur=0;
      // 冰晶粒子
      for(let k=0;k<3;k++){
        const ph=frame*0.1+k*2;
        ctx.fillStyle="rgba(255,255,255,0.7)";
        ctx.fillRect(en.x+Math.cos(ph)*en.w*0.4+en.w/2,en.y+Math.sin(ph)*en.h*0.4+en.h/2,2,2);
      }
    }
  }

  function drawEnemyBody(ctx,en,frame,ex,ey){
    if(en.type==="fighter"){
      // 紅色小戰機（朝左）
      ctx.fillStyle="#8B0000";
      ctx.beginPath();
      ctx.moveTo(ex+en.w-2,ey+en.h/2);
      ctx.lineTo(ex+en.w*0.6,ey+4);
      ctx.lineTo(ex+2,ey+en.h/2-2);
      ctx.lineTo(ex+2,ey+en.h/2+2);
      ctx.lineTo(ex+en.w*0.6,ey+en.h-4);
      ctx.fill();
      // 機翼
      ctx.fillStyle="#c0392b";
      ctx.beginPath();
      ctx.moveTo(ex+en.w*0.7,ey);
      ctx.lineTo(ex+en.w*0.3,ey+2);
      ctx.lineTo(ex+en.w*0.4,ey+10);
      ctx.lineTo(ex+en.w*0.7,ey+8);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(ex+en.w*0.7,ey+en.h);
      ctx.lineTo(ex+en.w*0.3,ey+en.h-2);
      ctx.lineTo(ex+en.w*0.4,ey+en.h-10);
      ctx.lineTo(ex+en.w*0.7,ey+en.h-8);
      ctx.fill();
      // 機頭
      ctx.fillStyle="#222";
      ctx.beginPath();
      ctx.moveTo(ex+2,ey+en.h/2-2);
      ctx.lineTo(ex-6,ey+en.h/2);
      ctx.lineTo(ex+2,ey+en.h/2+2);
      ctx.fill();
      // 駕駛艙
      ctx.fillStyle="#FF6B6B";
      ctx.beginPath();
      ctx.ellipse(ex+en.w*0.55,ey+en.h/2,4,3,0,0,Math.PI*2);
      ctx.fill();
      // 引擎噴射
      ctx.fillStyle="rgba(255,200,0,0.6)";
      ctx.beginPath();
      ctx.moveTo(ex+en.w-2,ey+en.h*0.4);
      ctx.lineTo(ex+en.w+8+Math.sin(frame*0.3)*2,ey+en.h/2);
      ctx.lineTo(ex+en.w-2,ey+en.h*0.6);
      ctx.fill();
      enemyHPBar(ctx,en);
    }else if(en.type==="kamikaze"){
      // 自爆機 - 黃色三角，閃紅燈
      const blink=Math.floor(frame/8)%2;
      ctx.fillStyle=blink?"#FF6600":"#FFD700";
      ctx.beginPath();
      ctx.moveTo(ex-4,ey+en.h/2);
      ctx.lineTo(ex+en.w*0.7,ey);
      ctx.lineTo(ex+en.w*0.7,ey+en.h);
      ctx.fill();
      // 機翼
      ctx.fillStyle="#c0392b";
      ctx.beginPath();
      ctx.moveTo(ex+en.w*0.5,ey-2);
      ctx.lineTo(ex+en.w*0.8,ey+en.h*0.3);
      ctx.lineTo(ex+en.w*0.5,ey+en.h*0.3);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(ex+en.w*0.5,ey+en.h+2);
      ctx.lineTo(ex+en.w*0.8,ey+en.h*0.7);
      ctx.lineTo(ex+en.w*0.5,ey+en.h*0.7);
      ctx.fill();
      // 警告燈
      ctx.fillStyle=blink?"#FF0000":"#660000";
      ctx.beginPath();
      ctx.arc(ex+en.w*0.4,ey+en.h/2,3,0,Math.PI*2);
      ctx.fill();
      // X 標誌
      ctx.strokeStyle="#000";ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(ex+en.w*0.3,ey+en.h*0.35);
      ctx.lineTo(ex+en.w*0.5,ey+en.h*0.65);
      ctx.moveTo(ex+en.w*0.5,ey+en.h*0.35);
      ctx.lineTo(ex+en.w*0.3,ey+en.h*0.65);
      ctx.stroke();
    }else if(en.type==="bomber"){
      // 大型轟炸機（朝左）
      // 機翼
      ctx.fillStyle="#444";
      ctx.beginPath();
      ctx.moveTo(ex+10,ey);
      ctx.lineTo(ex+en.w-10,ey-3);
      ctx.lineTo(ex+en.w-10,ey+10);
      ctx.lineTo(ex+10,ey+15);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(ex+10,ey+en.h);
      ctx.lineTo(ex+en.w-10,ey+en.h+3);
      ctx.lineTo(ex+en.w-10,ey+en.h-10);
      ctx.lineTo(ex+10,ey+en.h-15);
      ctx.fill();
      // 機身
      ctx.fillStyle="#666";
      ctx.beginPath();
      ctx.moveTo(ex-4,ey+en.h/2);
      ctx.lineTo(ex+12,ey+6);
      ctx.lineTo(ex+en.w,ey+10);
      ctx.lineTo(ex+en.w,ey+en.h-10);
      ctx.lineTo(ex+12,ey+en.h-6);
      ctx.fill();
      // 機頂亮邊
      ctx.fillStyle="#888";
      ctx.fillRect(ex+15,ey+11,en.w-20,3);
      // 駕駛艙
      ctx.fillStyle="#00FFFF";
      ctx.beginPath();
      ctx.ellipse(ex+8,ey+en.h/2,6,4,0,0,Math.PI*2);
      ctx.fill();
      // 引擎 x2
      ctx.fillStyle="#222";
      ctx.fillRect(ex+en.w-12,ey+10,8,6);
      ctx.fillRect(ex+en.w-12,ey+en.h-16,8,6);
      ctx.fillStyle="rgba(255,150,0,0.7)";
      ctx.fillRect(ex+en.w-4,ey+10,8,6);
      ctx.fillRect(ex+en.w-4,ey+en.h-16,8,6);
      enemyHPBar(ctx,en);
    }else if(en.type==="turret"){
      // 砲塔（地面/天花）
      const isTop=en.top;
      const baseY=isTop?ey:ey+en.h-12;
      ctx.fillStyle="#444";
      ctx.fillRect(ex,baseY,en.w,12);
      ctx.fillStyle="#666";
      ctx.fillRect(ex+2,baseY+2,en.w-4,8);
      // 砲管底
      const cx=ex+en.w/2,cy=isTop?ey+12:ey+en.h-12;
      ctx.fillStyle="#222";
      ctx.beginPath();
      ctx.arc(cx,cy,8,0,Math.PI*2);
      ctx.fill();
      // 砲管（指向玩家）
      const p=gRef.current.p;
      const ang=Math.atan2(p.y+p.h/2-cy,p.x+p.w/2-cx);
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(ang);
      ctx.fillStyle="#555";
      ctx.fillRect(0,-3,16,6);
      ctx.fillStyle="#888";
      ctx.fillRect(12,-4,4,8);
      ctx.restore();
      // 警示燈
      const blink=Math.floor(frame/20)%2;
      ctx.fillStyle=blink?"#FF0000":"#660000";
      ctx.beginPath();
      ctx.arc(ex+5,baseY+6,2,0,Math.PI*2);
      ctx.fill();
      enemyHPBar(ctx,en);
    }else if(en.type==="boss"){
      if(!en.active&&en.x>VW-en.w-30+5){
        ctx.globalAlpha=0.5;
      }
      const theme=en.theme||0;
      if(theme===1){drawBossSpider(ctx,en,frame);ctx.globalAlpha=1;return;}
      if(theme===2){drawBossFlame(ctx,en,frame);ctx.globalAlpha=1;return;}
      // theme 0：原本的皇冠戰艦
      const bob=Math.sin(frame*0.05)*3;
      const cx=ex+en.w/2,cy=ey+en.h/2+bob;
      const stage=en.stage||1;
      const phase=Math.floor(en.frame/180)%3;

      // ===== 1. 外圍光環（旋轉能量場）=====
      ctx.save();
      ctx.translate(cx,cy);
      const haloRot=frame*0.015;
      for(let r=0;r<3;r++){
        ctx.rotate(haloRot+(r%2===0?0:Math.PI/4));
        ctx.strokeStyle="rgba(255,0,150,"+(0.15+Math.sin(frame*0.08+r)*0.1)+")";
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.arc(0,0,en.w*0.7+r*8,0,Math.PI*2);
        ctx.stroke();
      }
      // 光環符文（八角）
      ctx.strokeStyle="rgba(255,215,0,"+(0.3+Math.sin(frame*0.1)*0.2)+")";
      ctx.lineWidth=1.5;
      for(let i=0;i<8;i++){
        const ang=i*Math.PI/4+frame*0.01;
        const rOut=en.w*0.85;
        ctx.beginPath();
        ctx.moveTo(Math.cos(ang)*rOut,Math.sin(ang)*rOut);
        ctx.lineTo(Math.cos(ang)*(rOut-12),Math.sin(ang)*(rOut-12));
        ctx.stroke();
      }
      ctx.restore();

      // ===== 2. 能量觸手（從反應爐延伸出）=====
      for(let t=0;t<4;t++){
        const tAng=t*Math.PI/2+frame*0.02;
        const tLen=20+Math.sin(frame*0.1+t)*15;
        ctx.strokeStyle="rgba(0,255,255,"+(0.4+Math.sin(frame*0.15+t)*0.3)+")";
        ctx.lineWidth=3;
        ctx.shadowColor="#00FFFF";ctx.shadowBlur=8;
        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.lineTo(cx+Math.cos(tAng)*tLen,cy+Math.sin(tAng)*tLen);
        ctx.stroke();
        ctx.shadowBlur=0;
      }

      // ===== 3. 機翼裝飾（發光金邊）=====
      // 下機翼
      const wingG=ctx.createLinearGradient(ex,ey+en.h-15,ex+en.w,ey+en.h);
      wingG.addColorStop(0,"#3a1a4a");
      wingG.addColorStop(0.5,"#7a3a8a");
      wingG.addColorStop(1,"#3a1a4a");
      ctx.fillStyle=wingG;
      ctx.beginPath();
      ctx.moveTo(ex+15,ey+en.h-10+bob);
      ctx.lineTo(ex+en.w-15,ey+en.h-10+bob);
      ctx.lineTo(ex+en.w-5,ey+en.h+10+bob);
      ctx.lineTo(ex+5,ey+en.h+10+bob);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle="#FFD700";ctx.lineWidth=2;
      ctx.shadowColor="#FFD700";ctx.shadowBlur=8;
      ctx.stroke();
      ctx.shadowBlur=0;
      // 上機翼
      ctx.fillStyle=wingG;
      ctx.beginPath();
      ctx.moveTo(ex+15,ey+10+bob);
      ctx.lineTo(ex+en.w-15,ey+10+bob);
      ctx.lineTo(ex+en.w-5,ey-10+bob);
      ctx.lineTo(ex+5,ey-10+bob);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle="#FFD700";ctx.lineWidth=2;
      ctx.shadowColor="#FFD700";ctx.shadowBlur=8;
      ctx.stroke();
      ctx.shadowBlur=0;

      // ===== 4. 主體（紫黑金屬戰艦）=====
      const bodyG=ctx.createLinearGradient(ex,ey,ex,ey+en.h);
      bodyG.addColorStop(0,"#1a0a2e");
      bodyG.addColorStop(0.3,"#4a2a5e");
      bodyG.addColorStop(0.5,"#6a3a7e");
      bodyG.addColorStop(0.7,"#4a2a5e");
      bodyG.addColorStop(1,"#1a0a2e");
      ctx.fillStyle=bodyG;
      ctx.fillRect(ex,ey+20+bob,en.w,en.h-40);
      // 上下護甲斜面
      ctx.fillStyle="#3a1a4e";
      ctx.beginPath();
      ctx.moveTo(ex,ey+20+bob);
      ctx.lineTo(ex+en.w-8,ey+bob);
      ctx.lineTo(ex+en.w,ey+15+bob);
      ctx.lineTo(ex,ey+20+bob);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(ex,ey+en.h-20+bob);
      ctx.lineTo(ex+en.w-8,ey+en.h+bob);
      ctx.lineTo(ex+en.w,ey+en.h-15+bob);
      ctx.lineTo(ex,ey+en.h-20+bob);
      ctx.fill();
      // 金邊線
      ctx.strokeStyle="#FFD700";ctx.lineWidth=1.5;
      ctx.shadowColor="#FFD700";ctx.shadowBlur=4;
      ctx.strokeRect(ex+0.5,ey+20+bob,en.w-1,en.h-40);
      ctx.shadowBlur=0;
      // 護甲鉚釘
      ctx.fillStyle="#FFD700";
      for(let r=0;r<5;r++){
        ctx.fillRect(ex+10+r*22,ey+25+bob,3,3);
        ctx.fillRect(ex+10+r*22,ey+en.h-28+bob,3,3);
      }
      // 紋飾條紋
      ctx.fillStyle="rgba(255,215,0,0.3)";
      ctx.fillRect(ex+5,ey+30+bob,en.w-10,2);
      ctx.fillRect(ex+5,ey+en.h-32+bob,en.w-10,2);

      // ===== 5. 王冠（boss 標誌）=====
      ctx.fillStyle="#FFD700";
      ctx.beginPath();
      ctx.moveTo(ex+en.w*0.3,ey-8+bob);
      ctx.lineTo(ex+en.w*0.35,ey-18+bob);
      ctx.lineTo(ex+en.w*0.42,ey-12+bob);
      ctx.lineTo(ex+en.w*0.5,ey-22+bob);
      ctx.lineTo(ex+en.w*0.58,ey-12+bob);
      ctx.lineTo(ex+en.w*0.65,ey-18+bob);
      ctx.lineTo(ex+en.w*0.7,ey-8+bob);
      ctx.lineTo(ex+en.w*0.7,ey-3+bob);
      ctx.lineTo(ex+en.w*0.3,ey-3+bob);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle="#FFAA00";ctx.lineWidth=1.5;
      ctx.stroke();
      // 王冠寶石
      ctx.fillStyle="#FF0066";
      ctx.shadowColor="#FF0066";ctx.shadowBlur=6;
      ctx.beginPath();ctx.arc(ex+en.w*0.5,ey-18+bob,2.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#00FFFF";
      ctx.shadowColor="#00FFFF";
      ctx.beginPath();ctx.arc(ex+en.w*0.35,ey-13+bob,1.8,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(ex+en.w*0.65,ey-13+bob,1.8,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;

      // ===== 6. 中央反應爐（多層強化版）=====
      const cor=Math.sin(frame*0.1)*0.3+0.7;
      // 外層光暈
      const coreG=ctx.createRadialGradient(cx,cy,4,cx,cy,32);
      coreG.addColorStop(0,"rgba(255,255,255,"+cor+")");
      coreG.addColorStop(0.3,"rgba(0,255,255,"+(cor*0.8)+")");
      coreG.addColorStop(0.7,"rgba(0,180,255,"+(cor*0.4)+")");
      coreG.addColorStop(1,"rgba(0,100,200,0)");
      ctx.fillStyle=coreG;
      ctx.beginPath();ctx.arc(cx,cy,32,0,Math.PI*2);ctx.fill();
      // 旋轉的六角能量環
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(frame*0.05);
      ctx.strokeStyle="#00FFFF";ctx.lineWidth=2;
      ctx.shadowColor="#00FFFF";ctx.shadowBlur=10;
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const a=i*Math.PI/3;
        const x=Math.cos(a)*18,y=Math.sin(a)*18;
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
      // 內核
      ctx.fillStyle="#fff";
      ctx.shadowColor="#00FFFF";ctx.shadowBlur=12;
      ctx.beginPath();ctx.arc(cx,cy,7,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;

      // ===== 7. 雙肩重型砲管 =====
      ctx.fillStyle="#1a1a2e";
      ctx.fillRect(ex-16,ey+30+bob,20,12);
      ctx.fillRect(ex-16,ey+en.h-42+bob,20,12);
      ctx.fillStyle="#4a4a6e";
      ctx.fillRect(ex-14,ey+32+bob,16,8);
      ctx.fillRect(ex-14,ey+en.h-40+bob,16,8);
      // 砲口能量
      const muzzle=Math.sin(frame*0.2)*0.3+0.7;
      ctx.fillStyle="rgba(255,0,150,"+muzzle+")";
      ctx.shadowColor="#FF0099";ctx.shadowBlur=8;
      ctx.beginPath();ctx.arc(ex-16,ey+36+bob,3,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(ex-16,ey+en.h-36+bob,3,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      // 金邊
      ctx.strokeStyle="#FFD700";ctx.lineWidth=1;
      ctx.strokeRect(ex-16,ey+30+bob,20,12);
      ctx.strokeRect(ex-16,ey+en.h-42+bob,20,12);

      // ===== 8. 機頭眼睛（雙紅光）=====
      const eb=Math.sin(frame*0.15)*0.3+0.7;
      ctx.shadowColor="#FF0000";ctx.shadowBlur=18;
      const eyeG=ctx.createRadialGradient(ex-4,ey+en.h*0.35+bob,1,ex-4,ey+en.h*0.35+bob,8);
      eyeG.addColorStop(0,"#fff");
      eyeG.addColorStop(0.3,"#FF6666");
      eyeG.addColorStop(1,"rgba(255,0,0,"+eb+")");
      ctx.fillStyle=eyeG;
      ctx.beginPath();ctx.arc(ex-4,ey+en.h*0.35+bob,7,0,Math.PI*2);ctx.fill();
      const eyeG2=ctx.createRadialGradient(ex-4,ey+en.h*0.65+bob,1,ex-4,ey+en.h*0.65+bob,8);
      eyeG2.addColorStop(0,"#fff");
      eyeG2.addColorStop(0.3,"#FF6666");
      eyeG2.addColorStop(1,"rgba(255,0,0,"+eb+")");
      ctx.fillStyle=eyeG2;
      ctx.beginPath();ctx.arc(ex-4,ey+en.h*0.65+bob,7,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;

      // ===== 9. 「敵」字標誌（金底紅字、發光）=====
      ctx.save();
      ctx.shadowColor="#FFD700";ctx.shadowBlur=10;
      // 金色徽章背景
      ctx.fillStyle="#FFD700";
      ctx.beginPath();
      ctx.arc(ex+en.w*0.75,ey+en.h/2+bob,15,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle="#c0392b";
      ctx.beginPath();
      ctx.arc(ex+en.w*0.75,ey+en.h/2+bob,12,0,Math.PI*2);
      ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle="#FFD700";
      ctx.font="bold 22px 'Noto Serif TC',serif";
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText("敵",ex+en.w*0.75,ey+en.h/2+bob+1);
      ctx.restore();

      // ===== 10. 引擎噴射（背面）=====
      const thrustLen=20+Math.sin(frame*0.3)*5;
      const thrustG=ctx.createLinearGradient(ex+en.w,0,ex+en.w+thrustLen,0);
      thrustG.addColorStop(0,"rgba(0,255,255,0.9)");
      thrustG.addColorStop(0.5,"rgba(255,100,255,0.5)");
      thrustG.addColorStop(1,"rgba(255,100,255,0)");
      ctx.fillStyle=thrustG;
      ctx.beginPath();
      ctx.moveTo(ex+en.w,ey+30+bob);
      ctx.lineTo(ex+en.w+thrustLen,ey+40+bob);
      ctx.lineTo(ex+en.w+thrustLen,ey+50+bob);
      ctx.lineTo(ex+en.w,ey+45+bob);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(ex+en.w,ey+en.h-50+bob);
      ctx.lineTo(ex+en.w+thrustLen,ey+en.h-40+bob);
      ctx.lineTo(ex+en.w+thrustLen,ey+en.h-30+bob);
      ctx.lineTo(ex+en.w,ey+en.h-45+bob);
      ctx.fill();

      // ===== 11. 階段顯示（圍繞 BOSS 的光環粒子）=====
      for(let p=0;p<6;p++){
        const pa=frame*0.04+p*Math.PI/3;
        const pr=en.w*0.6+Math.sin(frame*0.08+p)*8;
        const px2=cx+Math.cos(pa)*pr;
        const py2=cy+Math.sin(pa)*pr*0.7;
        ctx.fillStyle="rgba(255,215,0,"+(0.4+Math.sin(frame*0.1+p)*0.3)+")";
        ctx.shadowColor="#FFD700";ctx.shadowBlur=6;
        ctx.beginPath();ctx.arc(px2,py2,3,0,Math.PI*2);ctx.fill();
        ctx.shadowBlur=0;
      }

      // 攻擊階段視覺提示（中央反應爐顏色變化）
      if(phase===2){
        // 蓄力時內核變紅
        ctx.fillStyle="rgba(255,0,100,"+(0.3+Math.sin(frame*0.3)*0.3)+")";
        ctx.beginPath();ctx.arc(cx,cy,10,0,Math.PI*2);ctx.fill();
      }

      ctx.globalAlpha=1;
    }
  }

  // ===== BOSS 主題 2：機械蜘蛛 =====
  function drawBossSpider(ctx,en,frame){
    const ex=en.x,ey=en.y;
    const bob=Math.sin(frame*0.06)*4;
    const cx=ex+en.w/2,cy=ey+en.h/2+bob;
    // 8 隻機械腳
    for(let i=0;i<8;i++){
      const ang=(i/8)*Math.PI*2+frame*0.01;
      const len=45+Math.sin(frame*0.1+i)*8;
      const legX=cx+Math.cos(ang)*len;
      const legY=cy+Math.sin(ang)*len*0.7;
      const midX=cx+Math.cos(ang)*len*0.5;
      const midY=cy+Math.sin(ang)*len*0.5*0.7-10;
      ctx.strokeStyle="#2a1a1a";ctx.lineWidth=5;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.lineTo(midX,midY);
      ctx.lineTo(legX,legY);
      ctx.stroke();
      ctx.strokeStyle="#8a6a3a";ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.lineTo(midX,midY);
      ctx.lineTo(legX,legY);
      ctx.stroke();
      // 腳尖
      ctx.fillStyle="#FF0000";
      ctx.shadowColor="#FF0000";ctx.shadowBlur=4;
      ctx.beginPath();ctx.arc(legX,legY,3,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    }
    // 圓形身體
    const bodyG=ctx.createRadialGradient(cx-10,cy-10,5,cx,cy,40);
    bodyG.addColorStop(0,"#9a5a2a");
    bodyG.addColorStop(0.5,"#6a3a1a");
    bodyG.addColorStop(1,"#2a1a0a");
    ctx.fillStyle=bodyG;
    ctx.beginPath();ctx.arc(cx,cy,40,0,Math.PI*2);ctx.fill();
    // 金屬條紋
    ctx.strokeStyle="#FFD700";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,cy,38,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cy,28,0,Math.PI*2);ctx.stroke();
    // 八隻紅眼（圓形排列）
    for(let i=0;i<8;i++){
      const a=(i/8)*Math.PI*2;
      const ex2=cx+Math.cos(a)*18;
      const ey2=cy+Math.sin(a)*18;
      const blink=Math.sin(frame*0.15+i*0.5)*0.3+0.7;
      ctx.shadowColor="#FF0000";ctx.shadowBlur=10;
      ctx.fillStyle="rgba(255,0,0,"+blink+")";
      ctx.beginPath();ctx.arc(ex2,ey2,4,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle="#fff";
      ctx.beginPath();ctx.arc(ex2,ey2,1.5,0,Math.PI*2);ctx.fill();
    }
    // 中央獠牙（朝左/玩家）
    ctx.fillStyle="#fff";
    ctx.beginPath();
    ctx.moveTo(cx-30,cy-8);ctx.lineTo(cx-45,cy);ctx.lineTo(cx-30,cy+8);ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx-25,cy-12);ctx.lineTo(cx-40,cy-5);ctx.lineTo(cx-25,cy+2);ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx-25,cy+12);ctx.lineTo(cx-40,cy+5);ctx.lineTo(cx-25,cy-2);ctx.fill();
    // 中央核心
    const cor=Math.sin(frame*0.12)*0.3+0.7;
    ctx.shadowColor="#FF00FF";ctx.shadowBlur=14;
    ctx.fillStyle="rgba(255,0,255,"+cor+")";
    ctx.beginPath();ctx.arc(cx,cy,10,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle="#fff";
    ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);ctx.fill();
    // 「敵」標誌
    ctx.fillStyle="#FFD700";
    ctx.font="bold 14px 'Noto Serif TC',serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("第二關 BOSS",cx,cy-32);
    // 圍繞粒子
    for(let i=0;i<6;i++){
      const pa=frame*0.04+i*Math.PI/3;
      const pr=55+Math.sin(frame*0.08+i)*8;
      const px2=cx+Math.cos(pa)*pr;
      const py2=cy+Math.sin(pa)*pr*0.8;
      ctx.fillStyle="rgba(255,0,150,"+(0.5+Math.sin(frame*0.1+i)*0.3)+")";
      ctx.shadowColor="#FF0099";ctx.shadowBlur=6;
      ctx.beginPath();ctx.arc(px2,py2,3,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    }
  }

  // ===== BOSS 主題 3：火焰之心 / 龍王 =====
  function drawBossFlame(ctx,en,frame){
    const ex=en.x,ey=en.y;
    const bob=Math.sin(frame*0.07)*5;
    const cx=ex+en.w/2,cy=ey+en.h/2+bob;
    // 外層火焰光暈
    for(let r=3;r>=0;r--){
      const haloR=80-r*15+Math.sin(frame*0.1+r)*5;
      const g=ctx.createRadialGradient(cx,cy,haloR*0.4,cx,cy,haloR);
      g.addColorStop(0,"rgba(255,200,0,0)");
      g.addColorStop(0.5,"rgba(255,100,0,"+(0.2+r*0.05)+")");
      g.addColorStop(1,"rgba(180,0,0,0)");
      ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(cx,cy,haloR,0,Math.PI*2);ctx.fill();
    }
    // 旋轉火焰光環
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(frame*0.02);
    for(let i=0;i<8;i++){
      ctx.rotate(Math.PI/4);
      const flameLen=22+Math.sin(frame*0.15+i)*8;
      ctx.fillStyle="rgba(255,"+(80+i*15)+",0,0.7)";
      ctx.shadowColor="#FF6600";ctx.shadowBlur=8;
      ctx.beginPath();
      ctx.moveTo(0,-44);
      ctx.lineTo(-8,-44-flameLen);
      ctx.lineTo(0,-44-flameLen*1.3);
      ctx.lineTo(8,-44-flameLen);
      ctx.closePath();
      ctx.fill();
    }
    ctx.shadowBlur=0;
    ctx.restore();
    // 龍頭主體（菱形）
    const bodyG=ctx.createRadialGradient(cx-15,cy-15,5,cx,cy,45);
    bodyG.addColorStop(0,"#FFFFFF");
    bodyG.addColorStop(0.2,"#FFD700");
    bodyG.addColorStop(0.5,"#FF4500");
    bodyG.addColorStop(0.9,"#8B0000");
    bodyG.addColorStop(1,"#2a0000");
    ctx.fillStyle=bodyG;
    ctx.beginPath();
    ctx.moveTo(cx,cy-45);
    ctx.lineTo(cx+45,cy);
    ctx.lineTo(cx,cy+45);
    ctx.lineTo(cx-45,cy);
    ctx.closePath();
    ctx.fill();
    // 龍角（左右兩支朝外的金角）
    ctx.fillStyle="#FFD700";
    ctx.shadowColor="#FFD700";ctx.shadowBlur=8;
    ctx.beginPath();
    ctx.moveTo(cx-30,cy-20);ctx.lineTo(cx-50,cy-40);ctx.lineTo(cx-32,cy-12);ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx+30,cy-20);ctx.lineTo(cx+50,cy-40);ctx.lineTo(cx+32,cy-12);ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx-30,cy+20);ctx.lineTo(cx-50,cy+40);ctx.lineTo(cx-32,cy+12);ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx+30,cy+20);ctx.lineTo(cx+50,cy+40);ctx.lineTo(cx+32,cy+12);ctx.fill();
    ctx.shadowBlur=0;
    // 龍眼（雙眼朝左發藍光）
    const eb=Math.sin(frame*0.15)*0.3+0.7;
    ctx.shadowColor="#00FFFF";ctx.shadowBlur=14;
    ctx.fillStyle="rgba(0,255,255,"+eb+")";
    ctx.beginPath();ctx.arc(cx-10,cy-8,6,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx-10,cy+8,6,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle="#000";
    ctx.beginPath();ctx.arc(cx-12,cy-8,2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx-12,cy+8,2,0,Math.PI*2);ctx.fill();
    // 龍嘴（朝左尖端，吐火）
    ctx.fillStyle="#000";
    ctx.beginPath();
    ctx.moveTo(cx-35,cy-3);ctx.lineTo(cx-48,cy);ctx.lineTo(cx-35,cy+3);ctx.fill();
    // 嘴中吐出的火
    const flameOut=8+Math.sin(frame*0.3)*4;
    ctx.shadowColor="#FF6600";ctx.shadowBlur=12;
    ctx.fillStyle="rgba(255,200,0,0.9)";
    ctx.beginPath();
    ctx.moveTo(cx-48,cy);
    ctx.lineTo(cx-48-flameOut,cy-4);
    ctx.lineTo(cx-48-flameOut*1.5,cy);
    ctx.lineTo(cx-48-flameOut,cy+4);
    ctx.fill();
    ctx.shadowBlur=0;
    // 中央發光核心
    ctx.shadowColor="#FFFF00";ctx.shadowBlur=14;
    ctx.fillStyle="rgba(255,255,200,"+(0.7+Math.sin(frame*0.1)*0.2)+")";
    ctx.beginPath();ctx.arc(cx+10,cy,8,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    // 「敵」紋
    ctx.fillStyle="#000";
    ctx.font="bold 14px 'Noto Serif TC',serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("龍",cx+18,cy);
    // 周圍火星
    for(let i=0;i<10;i++){
      const a=frame*0.05+i*Math.PI/5;
      const r=60+Math.sin(frame*0.13+i)*15;
      const px2=cx+Math.cos(a)*r;
      const py2=cy+Math.sin(a)*r;
      ctx.fillStyle="rgba(255,"+(150+Math.floor(Math.random()*100))+",0,"+(0.6+Math.sin(frame*0.1+i)*0.3)+")";
      ctx.shadowColor="#FF6600";ctx.shadowBlur=6;
      ctx.beginPath();ctx.arc(px2,py2,2.5,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    }
  }

  // ===== 第 2 關 BOSS：機械八腳蜘蛛 =====
  function drawBossSpider(ctx,en,frame){
    const ex=en.x,ey=en.y;
    const bob=Math.sin(frame*0.06)*4;
    const cx=ex+en.w/2,cy=ey+en.h/2+bob;
    const hpRatio=en.hp/en.maxHp;
    const enraged=hpRatio<0.4;

    // 外圍紅色能量場（怒氣時）
    if(enraged){
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(frame*0.02);
      ctx.strokeStyle="rgba(255,0,80,"+(0.3+Math.sin(frame*0.2)*0.2)+")";
      ctx.lineWidth=2;
      for(let r=0;r<3;r++){
        ctx.beginPath();
        ctx.arc(0,0,en.w*0.6+r*8,0,Math.PI*2);
        ctx.stroke();
      }
      ctx.restore();
    }

    // ===== 八隻機械腳（圍繞身體）=====
    for(let leg=0;leg<8;leg++){
      const a=leg*Math.PI/4+frame*0.003;
      const len=42;
      // 腿關節
      const j1x=cx+Math.cos(a)*22,j1y=cy+Math.sin(a)*22;
      const swayPhase=frame*0.1+leg*0.7;
      const sway=Math.sin(swayPhase)*8;
