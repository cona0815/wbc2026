// ===== SOUND ENGINE =====
let audioStarted=false,sfx=null;
function initAudio(){
  if(sfx)return sfx;
  const vol=new Tone.Volume(-6).toDestination();
  const coinSynth=new Tone.Synth({oscillator:{type:"triangle"},envelope:{attack:0.005,decay:0.15,sustain:0,release:0.1},volume:-8}).connect(vol);
  const idiomSynth=new Tone.PolySynth(Tone.Synth,{oscillator:{type:"sine"},envelope:{attack:0.01,decay:0.3,sustain:0.1,release:0.5},volume:-6}).connect(vol);
  const landSynth=new Tone.MembraneSynth({pitchDecay:0.01,octaves:2,envelope:{attack:0.005,decay:0.08,sustain:0,release:0.05},volume:-18}).connect(vol);
  const noiseSynth=new Tone.NoiseSynth({noise:{type:"white"},envelope:{attack:0.002,decay:0.06,sustain:0,release:0.03},volume:-16}).connect(vol);
  const gameOverSynth=new Tone.Synth({oscillator:{type:"sawtooth"},envelope:{attack:0.01,decay:0.4,sustain:0.1,release:0.8},volume:-8}).connect(vol);
  const warnSynth=new Tone.Synth({oscillator:{type:"square"},envelope:{attack:0.005,decay:0.08,sustain:0,release:0.05},volume:-20}).connect(vol);
  const powerSynth=new Tone.Synth({oscillator:{type:"sine"},envelope:{attack:0.01,decay:0.2,sustain:0.05,release:0.3},volume:-6}).connect(vol);
  const hurtSynth=new Tone.NoiseSynth({noise:{type:"pink"},envelope:{attack:0.005,decay:0.12,sustain:0,release:0.08},volume:-10}).connect(vol);
  const springS=new Tone.Synth({oscillator:{type:"triangle"},envelope:{attack:0.005,decay:0.2,sustain:0,release:0.15},volume:-8}).connect(vol);
  const comboS=new Tone.PolySynth(Tone.Synth,{oscillator:{type:"triangle"},envelope:{attack:0.005,decay:0.15,sustain:0,release:0.2},volume:-8}).connect(vol);
  const bgmSynth=new Tone.PolySynth(Tone.Synth,{oscillator:{type:"sine"},envelope:{attack:0.05,decay:0.3,sustain:0.2,release:0.4},volume:-22}).connect(vol);
  let bgmLoop=null;
  sfx={
    coin(p){const n=["C5","D5","E5","G5"];coinSynth.triggerAttackRelease(n[(p||0)%4],"16n");},
    idiomComplete(){const t=Tone.now();idiomSynth.triggerAttackRelease("C5","8n",t);idiomSynth.triggerAttackRelease("E5","8n",t+0.08);idiomSynth.triggerAttackRelease("G5","8n",t+0.16);idiomSynth.triggerAttackRelease("C6","4n",t+0.24);},
    land(){landSynth.triggerAttackRelease("C2","32n");},
    crack(){noiseSynth.triggerAttackRelease("32n");},
    gameOver(){const t=Tone.now();gameOverSynth.triggerAttackRelease("E4","8n",t);gameOverSynth.triggerAttackRelease("C4","8n",t+0.2);gameOverSynth.triggerAttackRelease("A3","4n",t+0.4);},
    warn(){warnSynth.triggerAttackRelease("A5","32n");},
    powerUp(){const t=Tone.now();powerSynth.triggerAttackRelease("E5","16n",t);powerSynth.triggerAttackRelease("A5","16n",t+0.06);powerSynth.triggerAttackRelease("C6","8n",t+0.12);},
    hurt(){hurtSynth.triggerAttackRelease("16n");},
    spring(){springS.triggerAttackRelease("G5","16n");},
    combo(n){const notes=["C5","E5","G5","C6","E6"];comboS.triggerAttackRelease(notes[Math.min(n||0,4)],"16n");},
    startBGM(){if(bgmLoop)bgmLoop.stop();const pat=[["C4","E4"],["G4"],["E4","C4"],["G4"],["A3","C4"],["E4"],["D4","F4"],["G4"]];let st=0;bgmLoop=new Tone.Loop(function(t){bgmSynth.triggerAttackRelease(pat[st%pat.length],"8n",t);st++;},"4n");Tone.getTransport().bpm.value=110;Tone.getTransport().start();bgmLoop.start(0);},
    stopBGM(){if(bgmLoop){bgmLoop.stop();bgmLoop=null;}Tone.getTransport().stop();}
  };
  return sfx;
}
async function ensureAudio(){if(!audioStarted){await Tone.start();audioStarted=true;}return initAudio();}

const CW=400,CH=700,PW=90,PH=16,PLW=28,PLH=32,CR=20;
const GRAV=0.38,GAP=95;

// ===== DIFFICULTY PRESETS =====
const DIFF={
  easy:{
    label:"😊 簡單",desc:"5條命 · 速度慢 · 障礙少 · 道具多",color:"#5cdb95",
    hp:5, spd0:0.5, spdFrame:0.0003, spdScore:0.001, mv:4.0,
    platWarmup:10, obstacleRate:0.08, powerupGap:6, batSpd:1.2,
    platDist:function(r){if(r<0.55)return"normal";if(r<0.70)return"moving";if(r<0.80)return"fragile";if(r<0.88)return"spring";if(r<0.94)return"ice";return"conveyor";}
  },
  normal:{
    label:"😤 普通",desc:"3條命 · 標準速度 · 各式障礙",color:"#f7dc6f",
    hp:3, spd0:0.8, spdFrame:0.0006, spdScore:0.0015, mv:4.2,
    platWarmup:5, obstacleRate:0.18, powerupGap:10, batSpd:1.8,
    platDist:function(r){if(r<0.40)return"normal";if(r<0.55)return"moving";if(r<0.68)return"fragile";if(r<0.78)return"spring";if(r<0.86)return"ice";if(r<0.93)return"conveyor";return"vanish";}
  },
  hard:{
    label:"💀 困難",desc:"2條命 · 速度快 · 障礙密集 · 道具稀少",color:"#e74c3c",
    hp:2, spd0:1.2, spdFrame:0.001, spdScore:0.002, mv:4.5,
    platWarmup:3, obstacleRate:0.30, powerupGap:16, batSpd:2.5,
    platDist:function(r){if(r<0.28)return"normal";if(r<0.42)return"moving";if(r<0.56)return"fragile";if(r<0.64)return"spring";if(r<0.74)return"ice";if(r<0.86)return"conveyor";return"vanish";}
  }
};

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function genPlatforms(startY,count,df){
  const ps=[];for(let i=0;i<count;i++){const x=20+Math.random()*(CW-PW-40),y=startY+i*GAP,r=Math.random();let type="normal";
  if(i>df.platWarmup){type=df.platDist(r);}
  else{type=r<0.7?"normal":r<0.85?"moving":"fragile";}
  ps.push({x:x,y:y,w:PW,h:PH,type:type,dir:Math.random()>0.5?1:-1,life:30,vanTimer:0,convDir:Math.random()>0.5?1:-1});}return ps;
}
function genObstacles(platforms,df){
  const obs=[];for(let i=8;i<platforms.length;i++){if(Math.random()<df.obstacleRate){const p=platforms[i],r=Math.random();
  if(r<0.4)obs.push({type:"spike",x:p.x,y:p.y-12,w:p.w,h:12});
  else if(r<0.7)obs.push({type:"bat",x:Math.random()*CW,y:p.y-40,w:24,h:18,dir:Math.random()>0.5?1:-1,speed:df.batSpd+Math.random()*1.0,frame:0});
  else obs.push({type:"fire",x:p.x+p.w/2,y:p.y-50,baseY:p.y-50,w:18,h:18,phase:Math.random()*Math.PI*2});}}return obs;
}
function genPowerups(platforms,df){
  const pus=[];for(let i=10;i<platforms.length;i+=Math.floor(df.powerupGap+Math.random()*6)){const p=platforms[i];const types=["shield","magnet","slow","doubleScore"];
  pus.push({type:types[Math.floor(Math.random()*types.length)],x:p.x+p.w/2-10,y:p.y-50,w:20,h:20,collected:false});}return pus;
}
function genCoins(platforms,queue){
  const coins=[];let idx=0;for(let i=0;i<platforms.length;i++){if(i%3===1&&idx<queue.length){const idiom=queue[idx],chars=idiom.split(""),p=platforms[i];
  for(let c=0;c<4;c++){coins.push({x:p.x+(c-1.5)*34+p.w/2-18,y:p.y-40,char:chars[c],idiom:idiom,collected:false,idx:c});}idx++;}}return coins;
}

// ===== LEADERBOARD SYSTEM =====
// ★★★ 將這裡換成你的 Google Apps Script 部署網址 ★★★
var GAS_URL = 'https://script.google.com/macros/s/AKfycbwMcG9WPcG3NML-5Xr1Nw7XLbThrE4cG1qDSqIyQX2qPInH4vu-UiSSnaiapwHCGc18gQ/exec';

function getTitle(score){
  if(score>=2000)return'🐉 成語龍王';if(score>=1500)return'👑 成語帝王';if(score>=1000)return'🏆 成語大師';
  if(score>=700)return'🎓 成語學霸';if(score>=500)return'📚 成語達人';if(score>=300)return'✨ 成語新星';
  if(score>=150)return'🌱 成語學徒';if(score>=50)return'🐣 成語新手';return'🥚 初出茅廬';
}

var BAD_WORDS=["幹","靠北","靠杯","媽的","他媽","你媽","去死","白癡","白痴","智障","廢物","賤","婊","屄","屌","雞掰","機掰","北七","腦殘","傻逼","操你","草你","肏","王八","混蛋","蠢貨","狗屎","變態","色狼","流氓","屎","淫","蕩","妓","嫖","fuck","shit","ass","dick","cock","pussy","bitch","damn","bastard","slut","whore","nigger","nigga","penis","vagina","sex","porn","nude","kill","drug","ㄍㄢ","ㄇㄉ","ㄊㄇㄉ","ㄅ7"];
function isNameOK(name){
  if(!name||name.trim().length===0||name.trim().length>12)return false;
  var low=name.toLowerCase();for(var i=0;i<BAD_WORDS.length;i++){if(low.indexOf(BAD_WORDS[i].toLowerCase())>=0)return false;}
  return true;
}

async function fetchLeaderboard(){
  if(!GAS_URL)return null;
  try{var r=await fetch(GAS_URL+'?action=getLeaderboard&diff=all');var d=await r.json();return d.success?d.leaderboard:null;}catch(e){return null;}
}

async function submitToLeaderboard(diff,name,score,idioms){
  if(!GAS_URL)return{success:false,error:'排行榜未設定'};
  try{
    var r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'submitScore',diff:diff,name:name,score:score,idioms:idioms})});
    return await r.json();
  }catch(e){return{success:false,error:'連線失敗'};}
}

const h=React.createElement;
const ST={MENU:0,PLAY:1,OVER:2,BOARD:3};

function Game(){
  const canvasRef=React.useRef(null),gRef=React.useRef(null),keysRef=React.useRef({left:false,right:false});
  const animRef=React.useRef(null),sfxRef=React.useRef(null),mutedRef=React.useRef(false);
  const _s=React.useState,_r=React.useRef,_e=React.useEffect,_c=React.useCallback;
  const [ui,setUi]=_s(ST.MENU),[score,setScore]=_s(0),[collected,setCollected]=_s([]);
  const [selSets,setSelSets]=_s(["三年級上學期"]),[hi,setHi]=_s(0),[popup,setPopup]=_s(null);
  const [muted,setMuted]=_s(false);
  const [diff,setDiff]=_s("normal");
  const [paused,setPaused]=_s(false);
  const diffRef=React.useRef("normal");
  const pausedRef=React.useRef(false);
  _e(function(){diffRef.current=diff;},[diff]);
  _e(function(){pausedRef.current=paused;},[paused]);

  // Leaderboard states
  const [lbData,setLbData]=_s(null);
  const [lbLoading,setLbLoading]=_s(false);
  const [lbTab,setLbTab]=_s("normal");
  const [submitName,setSubmitName]=_s("");
  const [submitStatus,setSubmitStatus]=_s(null); // null | 'submitting' | {success,message,rank,title} | {error}
  const [nameError,setNameError]=_s("");
  const [myTitle,setMyTitle]=_s("");

  // Load leaderboard
  var loadLB=function(){
    setLbLoading(true);
    fetchLeaderboard().then(function(data){setLbData(data);setLbLoading(false);}).catch(function(){setLbLoading(false);});
  };

  // Submit score
  var doSubmit=async function(){
    var name=submitName.trim();
    if(!isNameOK(name)){setNameError("名字不符規定（1-12字，不可含不雅字詞）");return;}
    setNameError("");setSubmitStatus("submitting");
    var res=await submitToLeaderboard(diff,name,score,collected.length);
    if(res.success){setSubmitStatus(res);setMyTitle(res.title);loadLB();}
    else{setSubmitStatus({error:res.error||"提交失敗"});}
  };

  _e(function(){mutedRef.current=muted;},[muted]);

  const spawnText=function(g,x,y,text,color){g.texts.push({x:x,y:y,text:text,color:color||"#FFD700",life:50,vy:-1.5});};
  const spawnBurst=function(g,x,y,count,colors,spread){
    for(let i=0;i<count;i++){g.particles.push({x:x,y:y,vx:(Math.random()-0.5)*(spread||5),vy:-Math.random()*3-1,life:30+Math.random()*20,color:colors[Math.floor(Math.random()*colors.length)],size:2+Math.random()*2});}
  };

  const init=_c(function(){
    const df=DIFF[diff];
    const pool=[];selSets.forEach(function(s){pool.push.apply(pool,ALL_SETS[s]);});
    const queue=shuffle(pool),plats=genPlatforms(120,250,df);
    plats.unshift({x:CW/2-PW/2,y:80,w:PW,h:PH,type:"normal",dir:0,life:999,vanTimer:0,convDir:1});
    gRef.current={p:{x:CW/2-PLW/2,y:48,vy:0,vx:0,onGround:false,facing:1,hp:df.hp,maxHp:df.hp,invince:0,combo:0,comboTimer:0},
      plats:plats,coins:genCoins(plats,queue),obstacles:genObstacles(plats,df),powerups:genPowerups(plats,df),
      queue:queue,cam:0,spd:df.spd0,score:0,charMap:{},complete:[],over:false,frame:0,particles:[],ceil:-20,texts:[],
      fx:{shield:0,magnet:0,slow:0,doubleScore:0},shakeTimer:0,flashTimer:0,warmup:240};
  },[selSets,diff]);

  const start=_c(async function(){
    init();setScore(0);setCollected([]);setPopup(null);setPaused(false);setSubmitStatus(null);setSubmitName("");setNameError("");setMyTitle("");
    try{sfxRef.current=await ensureAudio();if(!muted)sfxRef.current.startBGM();}catch(e){}
    setUi(ST.PLAY);
  },[init,muted]);

  _e(function(){
    const d=function(e){if(e.key==="ArrowLeft"||e.key==="a")keysRef.current.left=true;if(e.key==="ArrowRight"||e.key==="d")keysRef.current.right=true;
      if(e.key==="Escape"){setPaused(function(prev){return !prev;});}};
    const u=function(e){if(e.key==="ArrowLeft"||e.key==="a")keysRef.current.left=false;if(e.key==="ArrowRight"||e.key==="d")keysRef.current.right=false;};
    window.addEventListener("keydown",d);window.addEventListener("keyup",u);
    return function(){window.removeEventListener("keydown",d);window.removeEventListener("keyup",u);};
  },[]);

  // ===== GAME LOOP =====
  _e(function(){
    if(ui!==ST.PLAY){if(animRef.current)cancelAnimationFrame(animRef.current);return;}
    const canvas=canvasRef.current;if(!canvas)return;
    const ctx=canvas.getContext("2d");

    function loop(){
      const g=gRef.current;if(!g||g.over)return;

      // --- PAUSE ---
      if(pausedRef.current){
        // Draw pause overlay
        ctx.fillStyle="rgba(0,0,0,0.55)";ctx.fillRect(0,0,CW,CH);
        ctx.fillStyle="#FFD700";ctx.font="bold 32px 'Noto Sans TC',sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
        ctx.fillText("⏸ 暫停中",CW/2,CH/2-20);
        ctx.fillStyle="rgba(255,255,255,0.45)";ctx.font="16px 'Noto Sans TC',sans-serif";
        ctx.fillText("按 ESC 或暫停鍵繼續",CW/2,CH/2+20);
        animRef.current=requestAnimationFrame(loop);return;
      }

      const p=g.p,s=mutedRef.current?null:sfxRef.current;g.frame++;
      if(g.warmup>0)g.warmup--;
      if(p.invince>0)p.invince--;if(p.comboTimer>0){p.comboTimer--;if(p.comboTimer<=0)p.combo=0;}
      if(g.shakeTimer>0)g.shakeTimer--;if(g.flashTimer>0)g.flashTimer--;
      Object.keys(g.fx).forEach(function(k){if(g.fx[k]>0)g.fx[k]--;});

      const spdMul=g.fx.slow>0?0.6:1;
      var df=DIFF[diffRef.current];
      if(keysRef.current.left)p.vx=-df.mv;else if(keysRef.current.right)p.vx=df.mv;else p.vx*=0.78;
      p.vy+=GRAV;if(p.vy>10)p.vy=10;p.y+=p.vy;p.x+=p.vx;
      if(p.x<-PLW)p.x=CW;if(p.x>CW)p.x=-PLW;
      if(p.vx>0.5)p.facing=1;if(p.vx<-0.5)p.facing=-1;

      const tc=p.y-CH*0.35;if(tc>g.cam)g.cam+=(tc-g.cam)*0.1;
      // Warmup: ceiling doesn't move, then ramps up gradually
      var warmFactor=g.warmup>0?0:Math.min((g.frame-240)/300,1);
      g.ceil+=g.spd*spdMul*warmFactor;g.spd=df.spd0+g.frame*df.spdFrame+g.score*df.spdScore;if(g.ceil>g.cam)g.cam=g.ceil;
      const ceilDist=p.y-g.cam;if(ceilDist<80&&ceilDist>5&&g.frame%30===0&&s)try{s.warn();}catch(e){}
      if(p.y<g.cam+5||p.y>g.cam+CH+30)g.over=true;
      const lowP=g.plats.reduce(function(m,pt){return pt.y>m?pt.y:m;},0);if(p.y>lowP+200)g.over=true;

      function hurtPlayer(){
        if(p.invince>0)return;
        if(g.fx.shield>0){g.fx.shield=0;spawnText(g,p.x,p.y-10,"護盾擋住了！","#00BFFF");if(s)try{s.crack();}catch(e){}return;}
        p.hp--;p.invince=90;g.shakeTimer=12;g.flashTimer=8;if(s)try{s.hurt();}catch(e){}
