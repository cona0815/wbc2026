// 不雅文字前端檢查
const BAD_LIST = ["87","78","56","038","幹","靠北","靠杯","媽的","他媽","你媽","垃圾","白痴","智障","腦殘","廢物","去死","混蛋","笨蛋","變態","屌","機掰","雞掰","婊","賤","fuck","shit","ass","dick","bitch","idiot","stupid","sex","porn","kill","die"];
function isNameOk(name) {
  if (!name || name.trim().length < 1 || name.trim().length > 10) return false;
  const l = name.toLowerCase().replace(/\s/g,"");
  for (const b of BAD_LIST) { if (l.includes(b.toLowerCase())) return false; }
  if (/(.)\1{2,}/.test(l)) return false;
  return true;
}

function freeCell(snk, fds) {
  const occ = new Set();
  snk.forEach(s => occ.add(s.x + "," + s.y));
  fds.forEach(f => occ.add(f.x + "," + f.y));
  let x, y;
  do { x = ri(G); y = ri(G); } while (occ.has(x + "," + y));
  return { x, y };
}

function makeFoods(snk, idiom, idx, wrongCount = 3, pool = ALL_IDIOMS) {
  const t = idiom[idx];
  const fds = [];
  fds.push({ ...freeCell(snk, fds), char: t, ok: true });
  for (let i = 0; i < wrongCount; i++) {
    let w = rp(pool)[ri(4)];
    while (w === t) w = rp(pool)[ri(4)];
    fds.push({ ...freeCell(snk, fds), char: w, ok: false });
  }
  return fds;
}

// Simple audio via AudioContext
const audioCtx = { current: null };
function beep(freq, dur, type = "sine", vol = 0.15) {
  try {
    if (!audioCtx.current) audioCtx.current = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = audioCtx.current;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = vol;
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  } catch (e) {}
}
function sfxEat(c) { const f = [523, 587, 659, 698, 784, 880, 988]; beep(f[Math.min(c, 6) % 7], 0.12); }
function sfxWrong() { beep(150, 0.25, "sawtooth", 0.1); }
function sfxComplete() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.2, "triangle", 0.12), i * 60)); setTimeout(() => beep(1318, 0.3, "sine", 0.08), 300); }
function sfxDie() { beep(100, 0.5, "sawtooth", 0.12); setTimeout(() => beep(80, 0.4, "sawtooth", 0.08), 100); setTimeout(() => beep(60, 0.5, "sawtooth", 0.06), 250); }

// BGM - chiptune loop via AudioContext
const bgm = { playing: false, iv: null, step: 0 };
const BGM_NOTES = [
  // A catchy 8-bit loop: pentatonic melody with rhythm
  [392,0.15],[0,0.05],[440,0.15],[0,0.05],[523,0.15],[0,0.05],[587,0.15],[0,0.05],
  [659,0.3],[0,0.1],[587,0.15],[0,0.05],[523,0.3],[0,0.1],
  [440,0.15],[0,0.05],[523,0.15],[0,0.05],[392,0.3],[0,0.1],
  [349,0.15],[0,0.05],[392,0.15],[0,0.05],[440,0.15],[0,0.05],[523,0.15],[0,0.05],
  [587,0.3],[0,0.1],[523,0.15],[0,0.05],[440,0.3],[0,0.1],
  [392,0.15],[0,0.05],[349,0.15],[0,0.05],[330,0.3],[0,0.2],
];
function startBGM() {
  if (bgm.playing) return;
  bgm.playing = true;
  bgm.step = 0;
  function playNext() {
    if (!bgm.playing) return;
    const [freq, dur] = BGM_NOTES[bgm.step % BGM_NOTES.length];
    if (freq > 0) beep(freq, dur, "square", 0.04);
    bgm.step++;
    bgm.iv = setTimeout(playNext, dur * 1000 + 20);
  }
  playNext();
}
function stopBGM() {
  bgm.playing = false;
  if (bgm.iv) { clearTimeout(bgm.iv); bgm.iv = null; }
}

    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    @keyframes tGlow{0%,100%{text-shadow:0 0 20px #ffe14d55,0 0 40px #ffe14d22}50%{text-shadow:0 0 40px #ffe14dcc,0 0 80px #ffe14d55}}
    @keyframes flashIn{from{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(-3deg)}to{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}}
    @keyframes compFlash{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}15%{transform:translate(-50%,-50%) scale(1.3);opacity:1}30%{transform:translate(-50%,-50%) scale(.9)}50%{transform:translate(-50%,-50%) scale(1.05)}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
    @keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
    @keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,5px)}80%{transform:translate(3px,-5px)}}
    @keyframes cFire{0%,100%{text-shadow:0 0 6px #ff6b6b,0 0 12px #ff4500}50%{text-shadow:0 0 14px #ff6b6b,0 0 28px #ff4500,0 0 42px #ff0000}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes menuBg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
    @keyframes borderGlow{0%,100%{box-shadow:0 0 15px ${mc}33,inset 0 0 30px rgba(0,0,0,.5)}50%{box-shadow:0 0 30px ${mc}55,inset 0 0 30px rgba(0,0,0,.5)}}
    @keyframes foodSpin{0%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-3px) rotate(3deg)}50%{transform:translateY(0) rotate(0deg)}75%{transform:translateY(-2px) rotate(-3deg)}100%{transform:translateY(0) rotate(0deg)}}
    @keyframes correctPop{0%{transform:translate(-50%,-50%) scale(0) rotate(-10deg);opacity:0}40%{transform:translate(-50%,-50%) scale(1.4) rotate(3deg);opacity:1}70%{transform:translate(-50%,-50%) scale(.9) rotate(-1deg)}100%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}}
    @keyframes wrongShake{0%,100%{transform:translate(-50%,-50%)}20%{transform:translate(calc(-50% - 8px),-50%)}40%{transform:translate(calc(-50% + 8px),-50%)}60%{transform:translate(calc(-50% - 4px),-50%)}80%{transform:translate(calc(-50% + 4px),-50%)}}
    @keyframes starTwinkle{0%,100%{opacity:.2}50%{opacity:.8}}
    @keyframes headGlow{0%,100%{box-shadow:0 0 12px ${mc}88,0 0 4px ${mc}}50%{box-shadow:0 0 24px ${mc}cc,0 0 8px ${mc},0 0 40px ${mc}44}}
    @keyframes comboScale{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
    @keyframes progressFill{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  `;

  // ═══════════ MENU ═══════════
  if (gs === "menu") {
    return (
      <div style={{ minHeight: "100vh", background: "linear-gradient(135deg,#050510,#0a0a2e,#150530,#0a0a2e,#050510)", backgroundSize: "400% 400%", animation: "menuBg 12s ease infinite", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Noto Serif TC',serif", padding: 20, position: "relative", overflow: "hidden" }}>
        <style>{CSS}</style>
        <div style={{ position: "absolute", inset: 0, overflow: "hidden", opacity: 0.03, fontSize: 26, color: "#fff", fontWeight: 900, lineHeight: "40px", wordBreak: "break-all", padding: 20, letterSpacing: 4 }}>
          {ALL_IDIOMS.join("").repeat(2)}
        </div>
        <div style={{ textAlign: "center", zIndex: 1, maxWidth: 520 }}>
          <div style={{ fontSize: 80, marginBottom: 4, animation: "float 3s ease-in-out infinite", filter: "drop-shadow(0 0 20px rgba(255,225,77,.3))" }}>🐍</div>
          <h1 style={{ fontSize: 46, fontWeight: 900, color: "#ffe14d", margin: "0 0 4px", animation: "tGlow 3s ease-in-out infinite", letterSpacing: 8 }}>成語貪食蛇</h1>
          <p style={{ color: "#6a6a8e", fontSize: 15, margin: "0 0 12px", letterSpacing: 2 }}>按順序吃字・完成成語・挑戰高分</p>
          <p style={{ color: "#555", fontSize: 13, margin: "0 0 20px" }}>三～五年級共 200 個成語</p>

          {/* 年級勾選 */}
          <div style={{ display: "flex", gap: 10, justifyContent: "center", marginBottom: 20, flexWrap: "wrap" }}>
            {["三年級","四年級","五年級"].map(g => {
              const on = grades[g];
              const cnt = IDIOMS_BY_GRADE[g].length;
              const clr = g === "三年級" ? "#7dff6a" : g === "四年級" ? "#ffe14d" : "#a78bfa";
              return (
                <button key={g} onClick={() => setGrades(prev => {
                  const nv = { ...prev, [g]: !prev[g] };
                  if (!nv["三年級"] && !nv["四年級"] && !nv["五年級"]) return prev;
                  return nv;
                })} style={{
                  padding: "8px 16px", borderRadius: 8,
                  border: on ? `2px solid ${clr}` : "2px solid #2a2a4a",
                  background: on ? `${clr}15` : "transparent",
                  color: on ? clr : "#444", fontSize: 14, fontWeight: 700, cursor: "pointer",
                  fontFamily: "'Noto Serif TC',serif", transition: "all .2s",
                }}>
                  {on ? "✓ " : ""}{g} ({cnt})
                </button>
              );
            })}
          </div>
          <div style={{ color: "#444", fontSize: 11, marginBottom: 20 }}>
            已選 {Object.entries(grades).filter(([_,v]) => v).map(([k]) => k).join("＋")} 共 {(() => { let n = 0; if (grades["三年級"]) n += 40; if (grades["四年級"]) n += 60; if (grades["五年級"]) n += 100; return n; })()} 個成語
          </div>

          <div style={{ display: "flex", flexDirection: "column", gap: 12, alignItems: "center", marginBottom: 28 }}>
            {/* Hint toggle */}
            <div style={{ display: "flex", justifyContent: "center", marginBottom: 14 }}>
              <button onClick={() => setHintOn(v => !v)} style={{
                padding: "8px 20px", borderRadius: 8,
                border: hintOn ? "2px solid #ffe14d" : "2px solid #555",
                background: hintOn ? "rgba(255,225,77,.1)" : "rgba(255,255,255,.03)",
                color: hintOn ? "#ffe14d" : "#666", fontSize: 13, fontWeight: 700, cursor: "pointer",
                fontFamily: "'Noto Serif TC',serif",
              }}>
                {hintOn ? "💡 提示開：正確字會發光" : "🔒 提示關：只提示第一字（進階）"}
              </button>
            </div>

            <div style={{ color: "#8888aa", fontSize: 11, marginBottom: 2, letterSpacing: 3, fontFamily: "'Press Start 2P',monospace" }}>SELECT DIFFICULTY</div>

            {[1, 2, 3].map(d => {
              const cfg = DIFF_CFG[d];
              return (
                <button key={d} onClick={() => startGame(d)} style={{
                  width: 320, padding: "16px 24px", borderRadius: 14, border: `2px solid ${cfg.color}`,
                  background: `linear-gradient(135deg,${cfg.color}12,${cfg.color}04)`, cursor: "pointer",
                  fontFamily: "'Noto Serif TC',serif", transition: "all .3s", textAlign: "left",
                  boxShadow: `0 0 20px ${cfg.color}15`,
                }}
                  onMouseEnter={e => { e.currentTarget.style.boxShadow = `0 0 35px ${cfg.color}30`; e.currentTarget.style.transform = "scale(1.03)"; }}
                  onMouseLeave={e => { e.currentTarget.style.boxShadow = `0 0 20px ${cfg.color}15`; e.currentTarget.style.transform = "scale(1)"; }}
                >
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                    <div>
                      <div style={{ fontFamily: "'Press Start 2P',monospace", fontSize: 10, color: cfg.color, letterSpacing: 2, marginBottom: 6 }}>{cfg.emoji} {cfg.label}</div>
                      <div style={{ fontSize: 14, color: "#888", marginTop: 2 }}>{cfg.desc}</div>
                      <div style={{ fontSize: 12, color: "#555", marginTop: 4 }}>目標：完成 {cfg.target} 個成語</div>
                    </div>
                    <div style={{ fontSize: 36 }}>{cfg.emoji}</div>
                  </div>
                </button>
              );
            })}
          </div>

          {/* Audio & Leaderboard */}
          <div style={{ marginBottom: 16, display: "flex", gap: 10, justifyContent: "center" }}>
            <button onClick={() => setBgmOn(v => { if (v) stopBGM(); return !v; })} style={{ fontFamily: "'Press Start 2P',monospace", fontSize: 8, padding: "5px 14px", borderRadius: 4, border: "1px solid #333", background: "transparent", color: bgmOn ? "#ffe14d" : "#444", cursor: "pointer" }}>
              {bgmOn ? "♪ BGM ON" : "♪ BGM OFF"}
            </button>
            <button onClick={() => { fetchLB(); setShowLB(true); }} style={{ fontFamily: "'Press Start 2P',monospace", fontSize: 8, padding: "5px 14px", borderRadius: 4, border: "1px solid #333", background: "transparent", color: "#a78bfa", cursor: "pointer" }}>
              🏆 排行榜
            </button>
          </div>

          {/* 排行榜彈窗 */}
          {showLB && (
            <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.85)", zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }} onClick={() => setShowLB(false)}>
              <div onClick={e => e.stopPropagation()} style={{ background: "#12122a", borderRadius: 16, border: "2px solid #3a3a6a", padding: "20px 24px", maxWidth: 460, width: "100%", maxHeight: "80vh", overflowY: "auto" }}>
                <div style={{ fontFamily: "'Press Start 2P',monospace", fontSize: 12, color: "#ffe14d", letterSpacing: 3, marginBottom: 16, textAlign: "center" }}>🏆 排行榜</div>
                {["簡單","普通","困難"].map((d,di) => {
                  const items = leaderboard[d] || [];
                  const clr = ["#7dff6a","#ffe14d","#ff2d95"][di];
                  return (
                    <div key={d} style={{ marginBottom: 16 }}>
                      <div style={{ fontFamily: "'Press Start 2P',monospace", fontSize: 9, color: clr, letterSpacing: 2, marginBottom: 6 }}>{["🌱","⚔️","🔥"][di]} {d}</div>
                      {items.length === 0 ? (
                        <div style={{ fontSize: 12, color: "#444", marginBottom: 4 }}>尚無記錄</div>
                      ) : (
                        <div style={{ background: "rgba(255,255,255,.02)", borderRadius: 6, border: "1px solid #1a1a3a", overflow: "hidden" }}>
                          {items.map((e, i) => (
                            <div key={i} style={{ display: "flex", alignItems: "center", padding: "5px 10px", borderBottom: i < items.length - 1 ? "1px solid #111" : "none" }}>
                              <span style={{ fontFamily: "'Press Start 2P',monospace", fontSize: 9, color: i < 3 ? ["#ffe14d","#c0c0c0","#cd7f32"][i] : "#444", width: 28, textAlign: "center" }}>{["🥇","🥈","🥉"][i] || `${i+1}`}</span>
                              <span style={{ flex: 1, fontSize: 13, fontWeight: 700, color: "#ccc", marginLeft: 6 }}>{e.name}</span>
                              <span style={{ fontSize: 10, color: "#666", marginRight: 6 }}>{e.title}</span>
                              <span style={{ fontFamily: "'Press Start 2P',monospace", fontSize: 9, color: clr, width: 45, textAlign: "right" }}>{e.score}</span>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
                <button onClick={() => setShowLB(false)} style={{ width: "100%", padding: "10px", borderRadius: 8, border: "1px solid #444", background: "transparent", color: "#888", fontSize: 14, cursor: "pointer", fontFamily: "'Noto Serif TC',serif", marginTop: 8 }}>關閉</button>
              </div>
            </div>
          )}

          <div style={{ color: "#445", fontSize: 11, lineHeight: 2.4, fontFamily: "'Press Start 2P',monospace", letterSpacing: 1 }}>
            <div style={{ color: "#667" }}>WASD / 方向鍵 / 滑動</div>
            <div style={{ color: "#556" }}>按順序吃字組成語</div>
            <div style={{ color: "#445" }}>連擊加分 COMBO!</div>
          </div>
        </div>
      </div>
    );
  }

  // ═══════════ VICTORY / GAME OVER (結果畫面 + 加分環節) ═══════════
  if (gs === "victory" || gs === "gameover") {
    const cfg = DIFF_CFG[diff];
    const isWin = gs === "victory";
    const titleStr = myTitle || getTitle(score + bonusScore, diff);
    const lbData = leaderboard[cfg.label] || [];
    const totalSc = score + bonusScore;

    // Victory character evolution
    const winChars = ["🐍⚔️","🐉🛡️","🐲👑","🏆✨"];
    const winChar = isWin ? winChars[Math.min(diff, 3)] : "🐍";
    const winTitles = {
      1: ["🌱 成語小蛇", "🌿 成語青蛇", "🐍 成語靈蛇", "🐉 成語蛟龍", "👑 成語龍王"],
      2: ["⚔️ 成語劍蛇", "🛡️ 成語鐵蛇", "🗡️ 成語戰蛇", "🐉 成語神蛇", "🏆 成語霸蛇"],
      3: ["🔥 烈焰蛇", "💎 鑽石蛇", "⚡ 雷霆蛇", "🌟 星辰蛇", "🌌 宇宙蛇王"],
    };
    const getWinTitle = (s, d) => {
      const list = winTitles[d] || winTitles[2];
      const thresholds = [0, 150, 350, 600, 1000];
      let idx = 0;
      for (let i = 0; i < thresholds.length; i++) { if (s >= thresholds[i]) idx = i; }
      return list[idx];
    };
    const displayTitle = isWin ? getWinTitle(totalSc, diff) : "🐍💧 再接再厲";

    // Bonus round: pool of idioms the player encountered (done + current)
    const bonusPool = [...new Set([...done, idiom].filter(Boolean))];
    // Also add some random ones they haven't seen
    const pool2 = getPool();
    while (bonusPool.length < 8 && pool2.length > 0) {
      const r = rp(pool2);
      if (!bonusPool.includes(r)) bonusPool.push(r);
    }

    const handleBonusTap = (id) => {
      if (bonusTapped.has(id)) return;
      sfxEat(bonusTapped.size);
      const nt = new Set(bonusTapped);
      nt.add(id);
      setBonusTapped(nt);
      setBonusScore(prev => prev + 100);
      setBonusShow({ idiom: id, desc: IDIOM_DESC[id] || "查無解釋" });
      setTimeout(() => setBonusShow(null), 2500);
    };

    // Name input
    const nameForm = !submitted ? (
      <div style={{ marginTop: 12, marginBottom: 8 }}>
        <div style={{ fontFamily: "'Press Start 2P',monospace", fontSize: 8, color: "#888", marginBottom: 6, letterSpacing: 1 }}>輸入名字登錄排行榜</div>
        <div style={{ display: "flex", gap: 8, justifyContent: "center", alignItems: "center" }}>
          <input value={playerName} onChange={e => { setPlayerName(e.target.value); setNameError(""); }}
            placeholder="你的名字"
            maxLength={10}
            style={{ width: 160, padding: "8px 12px", borderRadius: 8, border: "2px solid #3a3a5a", background: "#12122a", color: "#fff", fontSize: 16, fontFamily: "'Noto Serif TC',serif", fontWeight: 700, outline: "none", textAlign: "center" }}
            onKeyDown={e => { if (e.key === "Enter") submitScore(); }}
          />
          <button onClick={submitScore} disabled={submitting} style={{
            padding: "8px 18px", borderRadius: 8, border: "2px solid #ffe14d",
            background: submitting ? "#333" : "linear-gradient(135deg,#ffe14d,#ffa94d)",
            color: "#0a0a1a", fontSize: 14, fontWeight: 900, cursor: submitting ? "wait" : "pointer",
            fontFamily: "'Noto Serif TC',serif",
          }}>{submitting ? "..." : "送出"}</button>
        </div>
        {nameError && <div style={{ color: "#ff6b6b", fontSize: 12, marginTop: 4 }}>{nameError}</div>}
      </div>
    ) : (
      <div style={{ marginTop: 8 }}>
        {myRank > 0 && <div style={{ fontFamily: "'Press Start 2P',monospace", fontSize: 10, color: "#ffe14d", marginTop: 4 }}>🏅 排行榜第 {myRank} 名！</div>}
      </div>
    );

    // Leaderboard
    const lbTable = lbData.length > 0 ? (
      <div style={{ marginTop: 10, width: "100%", maxWidth: 380 }}>
        <div style={{ fontFamily: "'Press Start 2P',monospace", fontSize: 8, color: "#888", letterSpacing: 2, marginBottom: 4 }}>🏆 {cfg.label} TOP 10</div>
        <div style={{ background: "rgba(255,255,255,.03)", borderRadius: 6, border: "1px solid #2a2a4a", overflow: "hidden", maxHeight: 120, overflowY: "auto" }}>
          {lbData.map((entry, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", padding: "4px 10px", borderBottom: i < lbData.length - 1 ? "1px solid #1a1a3a" : "none", background: entry.name === playerName ? "rgba(255,225,77,.08)" : "transparent" }}>
              <span style={{ fontFamily: "'Press Start 2P',monospace", fontSize: 9, color: i < 3 ? ["#ffe14d","#c0c0c0","#cd7f32"][i] : "#444", width: 26, textAlign: "center" }}>{["🥇","🥈","🥉"][i] || `${i+1}`}</span>
              <span style={{ flex: 1, fontSize: 13, fontWeight: 700, color: entry.name === playerName ? "#ffe14d" : "#bbb", marginLeft: 6 }}>{entry.name}</span>
              <span style={{ fontFamily: "'Press Start 2P',monospace", fontSize: 9, color: "#ffe14d", width: 45, textAlign: "right" }}>{entry.score}</span>
            </div>
          ))}
        </div>
      </div>
    ) : null;

    return (
      <div style={{ minHeight: "100vh", background: isWin ? "radial-gradient(ellipse at 50% 30%,#1a1a00,#0a0a10 60%,#030308)" : "radial-gradient(ellipse at 50% 30%,#1a0a1e,#0a0510 60%,#050508)", display: "flex", alignItems: "flex-start", justifyContent: "center", fontFamily: "'Noto Serif TC',serif", padding: "16px 12px", overflowY: "auto" }}>
        <style>{CSS}</style>
        <div style={{ textAlign: "center", maxWidth: 480, width: "100%" }}>
          {/* Character */}
          <div style={{ fontSize: isWin ? 56 : 48, marginBottom: 4, animation: isWin ? "float 2s ease-in-out infinite" : "none" }}>
            {isWin ? winChar : "🐍😢"}
          </div>
          {/* Title */}
          <div style={{ fontFamily: "'Press Start 2P',monospace", fontSize: isWin ? 14 : 12, color: isWin ? "#ffe14d" : "#ff6b6b", letterSpacing: 3, marginBottom: 2, animation: isWin ? "tGlow 2s ease-in-out infinite" : "none" }}>
            {isWin ? "YOU WIN!" : "嗚嗚…下次加油！"}
          </div>
          {/* Cool title */}
          <div style={{ fontSize: 20, fontWeight: 900, color: isWin ? "#fff" : "#aaa", marginBottom: 8, textShadow: isWin ? `0 0 20px ${mc}` : "none" }}>{displayTitle}</div>
          <div style={{ fontSize: 14, color: cfg.color, marginBottom: 6 }}>{cfg.emoji} {cfg.label}模式</div>
          {/* Score */}
          <div style={{ fontSize: 44, fontWeight: 900, color: "#ffe14d", textShadow: "0 0 20px #ffe14d44" }}>{totalSc}</div>
          <div style={{ fontFamily: "'Press Start 2P',monospace", fontSize: 8, color: "#555", letterSpacing: 2, marginBottom: 6 }}>{bonusScore > 0 ? `遊戲 ${score} + 加分 ${bonusScore}` : "SCORE"}</div>
          <div style={{ color: "#888", fontSize: 14, marginBottom: 8 }}>
            完成 <span style={{ color: isWin ? "#7dff6a" : mc, fontWeight: 900, fontSize: 20 }}>{done.length}</span> / {cfg.target} 個成語
          </div>

          {/* ═══ 加分環節 ═══ */}
          <div style={{ background: "rgba(255,255,255,.03)", borderRadius: 12, border: "1px solid #2a2a4a", padding: "12px", marginBottom: 10 }}>
            <div style={{ fontFamily: "'Press Start 2P',monospace", fontSize: 9, color: "#a78bfa", letterSpacing: 2, marginBottom: 3 }}>📚 加分環節</div>
            <div style={{ fontSize: 11, color: "#666", marginBottom: 8 }}>點擊成語查看解釋，每個 +100 分！</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, justifyContent: "center", marginBottom: 6 }}>
              {bonusPool.map((id, i) => {
                const tapped = bonusTapped.has(id);
                return (
                  <button key={id} onClick={() => handleBonusTap(id)} style={{
                    padding: "6px 12px", borderRadius: 6, fontSize: 15, fontWeight: 900, cursor: tapped ? "default" : "pointer",
                    fontFamily: "'Noto Serif TC',serif",
                    border: tapped ? "2px solid #7dff6a44" : `2px solid ${NEON[i % NEON.length]}44`,
                    background: tapped ? "rgba(125,255,106,.08)" : `${NEON[i % NEON.length]}12`,
                    color: tapped ? "#7dff6a88" : NEON[i % NEON.length],
                    textDecoration: tapped ? "none" : "none",
                    transition: "all .2s",
                  }}>{tapped ? "✓ " : ""}{id}</button>
                );
              })}
            </div>
            {/* Show description popup */}
            {bonusShow && (
              <div style={{ background: "rgba(255,225,77,.08)", border: "1px solid #ffe14d44", borderRadius: 8, padding: "10px 14px", marginTop: 6, animation: "slideIn .3s ease-out" }}>
                <div style={{ fontSize: 20, fontWeight: 900, color: "#ffe14d", marginBottom: 4 }}>{bonusShow.idiom}</div>
                <div style={{ fontSize: 14, color: "#ccc", lineHeight: 1.6 }}>{bonusShow.desc}</div>
                <div style={{ fontFamily: "'Press Start 2P',monospace", fontSize: 8, color: "#7dff6a", marginTop: 4 }}>+100!</div>
              </div>
            )}
          </div>

          {nameForm}
          {lbTable}

          {/* Buttons */}
          <div style={{ display: "flex", gap: 12, justifyContent: "center", flexWrap: "wrap", marginTop: 10, marginBottom: 20 }}>
            <button onClick={() => { setSubmitted(false); setPlayerName(""); setNameError(""); setMyRank(-1); setBonusScore(0); setBonusTapped(new Set()); setBonusShow(null); startGame(diff); }} style={{
              padding: "10px 32px", borderRadius: 10, border: "2px solid #ffe14d",
              background: "linear-gradient(135deg,#ffe14d,#ffa94d)", color: "#0a0a1a",
              fontSize: 16, fontWeight: 900, cursor: "pointer", fontFamily: "'Noto Serif TC',serif",
              boxShadow: "0 0 20px rgba(255,225,77,.3)", letterSpacing: 2,
            }}>{isWin ? "再玩一次" : "RETRY"}</button>
            <button onClick={goHome} style={{
              padding: "10px 20px", borderRadius: 10, border: "2px solid #444",
              background: "transparent", color: "#888", fontSize: 14, cursor: "pointer",
              fontFamily: "'Noto Serif TC',serif",
            }}>🏠 首頁</button>
          </div>
        </div>
      </div>
    );
  }

  // ═══════════ PLAYING / PAUSED ═══════════
  const progress = (
    <div style={{ display: "flex", gap: 8, justifyContent: "center", marginBottom: 6 }}>
      {idiom && idiom.split("").map((ch, i) => {
        const filled = i < ci, active = i === ci;
        return (
          <div key={i} style={{
            width: 56, height: 56, display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: 28, fontWeight: 900, borderRadius: 10, fontFamily: "'Noto Serif TC',serif",
            border: active && (hintOn || ci === 0) ? `2px solid ${mc}` : "2px solid #2a2a4a",
            background: filled ? mc : active && (hintOn || ci === 0) ? "rgba(255,255,255,.05)" : "rgba(255,255,255,.02)",
            color: filled ? "#0a0a1a" : active && (hintOn || ci === 0) ? "#fff" : "#333",
            transition: "all .3s cubic-bezier(.34,1.56,.64,1)",
            transform: active && (hintOn || ci === 0) ? "scale(1.12)" : "scale(1)",
            boxShadow: filled ? `0 0 24px ${mc}88, inset 0 0 10px rgba(255,255,255,.2)` : active && (hintOn || ci === 0) ? `0 0 18px ${mc}44` : "none",
            animation: filled ? "progressFill .4s ease-out" : active && (hintOn || ci === 0) ? "pulse 1.5s ease-in-out infinite" : "none",
          }}>
            {filled ? ch : active && (hintOn || ci === 0) ? <span style={{ opacity: 0.4, fontSize: 18 }}>?</span> : ""}
          </div>
        );
      })}
    </div>
  );

  const board = (
    <div style={{ position: "relative", animation: shaking ? "shake .2s ease" : "none" }}>
      <div onTouchStart={onTS} onTouchEnd={onTE} style={{
        width: B, height: B, position: "relative",
        background: "radial-gradient(ellipse at 30% 30%,#12122a,#0a0a18 60%,#060610)",
        borderRadius: 14, border: `2px solid ${mc}44`, overflow: "hidden", touchAction: "none",
        animation: "borderGlow 3s ease-in-out infinite",
      }}>
        {/* CRT */}
        <div style={{ position: "absolute", inset: 0, background: "repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.04) 2px,rgba(0,0,0,.04) 4px)", zIndex: 15, pointerEvents: "none" }} />
        <div style={{ position: "absolute", left: 0, width: "100%", height: 80, background: "linear-gradient(180deg,transparent,rgba(255,255,255,.015),transparent)", animation: "scan 4s linear infinite", zIndex: 15, pointerEvents: "none" }} />
        {/* Vignette */}
        <div style={{ position: "absolute", inset: 0, background: "radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.4) 100%)", zIndex: 14, pointerEvents: "none" }} />
        {/* Starfield */}
        <svg width={B} height={B} style={{ position: "absolute", top: 0, left: 0, opacity: 0.4, zIndex: 0 }}>
          {Array.from({ length: 30 }, (_, i) => {
            const sx = (i * 137 + 43) % B, sy = (i * 89 + 17) % B, sr = 0.5 + (i % 3) * 0.5;
            return <circle key={`star${i}`} cx={sx} cy={sy} r={sr} fill="#fff" style={{ animation: `starTwinkle ${2 + i % 3}s ease-in-out ${i * 0.3}s infinite` }} />;
          })}
        </svg>

        {/* Grid dots */}
        <svg width={B} height={B} style={{ position: "absolute", top: 0, left: 0, opacity: 0.06 }}>
          {Array.from({ length: G }, (_, x) => Array.from({ length: G }, (_, y) => (
            <circle key={`${x}-${y}`} cx={x * C + C / 2} cy={y * C + C / 2} r={1} fill="#fff" />
          )))}
        </svg>

        {/* Screen flash */}
        {scrFlash && <div style={{ position: "absolute", inset: 0, background: scrFlash, opacity: 0.15, zIndex: 14, pointerEvents: "none", borderRadius: 12 }} />}

        {/* Trail */}
        {trail.map((t, i) => (
          <div key={`t${i}`} style={{
            position: "absolute", left: t.x * C + 3, top: t.y * C + 3, width: C - 6, height: C - 6,
            borderRadius: 7, background: `radial-gradient(circle,${mc}44,${mc}11)`, opacity: Math.max(0, 0.2 - t.age * 0.022),
            zIndex: 1, pointerEvents: "none", filter: "blur(3px)",
            boxShadow: `0 0 ${10 - t.age}px ${mc}33`,
          }} />
        ))}

        {/* Foods */}
        {foods.map((f, i) => (
          <div key={`f${i}`} style={{
            position: "absolute", left: f.x * C, top: f.y * C, width: C, height: C,
            display: "flex", alignItems: "center", justifyContent: "center", zIndex: 3,
            animation: `foodSpin ${1.8 + i * 0.15}s ease-in-out infinite`,
          }}>
            {/* Glow ring for correct food */}
            {f.ok && (hintOn || ci === 0) && <div style={{ position: "absolute", inset: -3, borderRadius: 12, border: "2px solid rgba(255,225,77,.2)", animation: "pulse 2s ease-in-out infinite", pointerEvents: "none" }} />}
            <div style={{
              width: C - 3, height: C - 3, borderRadius: 9, display: "flex", alignItems: "center", justifyContent: "center",
              fontSize: 23, fontWeight: 900, fontFamily: "'Noto Serif TC',serif",
              color: f.ok && (hintOn || ci === 0) ? "#ffe14d" : "#888",
              background: f.ok && (hintOn || ci === 0) ? "radial-gradient(circle,rgba(255,225,77,.25) 0%,rgba(255,225,77,.05) 70%,transparent)" : "rgba(255,255,255,.05)",
              border: f.ok && (hintOn || ci === 0) ? "1.5px solid rgba(255,225,77,.5)" : "1px solid rgba(255,255,255,.08)",
              boxShadow: f.ok && (hintOn || ci === 0) ? "0 0 18px rgba(255,225,77,.35), inset 0 0 8px rgba(255,225,77,.1)" : "none",
              animation: f.ok && (hintOn || ci === 0) ? "nPulse 2s ease-in-out infinite" : "none",
              textShadow: f.ok && (hintOn || ci === 0) ? "0 0 8px rgba(255,225,77,.6)" : "none",
            }}>
              {f.char}
            </div>
          </div>
        ))}

        {/* Snake */}
        {snake.map((s, i) => {
          const head = i === 0;
          const op = 1 - i / Math.max(snake.length, 1) * 0.55;
          const sz = head ? C - 1 : C - 3 - Math.min(i * 0.4, 6);
          const off = head ? 0.5 : (C - sz) / 2;
          const hueShift = (i * 25) % 360;
          const segColor = head ? mc : `hsl(${(parseInt(mc.slice(1), 16) * 0.001 * 360 + hueShift) % 360}, 80%, 55%)`;
          return (
            <div key={`s${i}`} style={{
              position: "absolute", left: s.x * C + off, top: s.y * C + off, width: sz, height: sz,
              borderRadius: head ? 10 : Math.max(4, 8 - i * 0.3),
              background: head ? `linear-gradient(135deg,${mc},#fff3,${mc})` : segColor,
              opacity: op, zIndex: 4,
              boxShadow: head ? `0 0 20px ${mc}cc,0 0 6px ${mc},0 0 40px ${mc}44` : `0 0 ${Math.max(0, 8 - i)}px ${segColor}66`,
              display: "flex", alignItems: "center", justifyContent: "center",
              animation: head ? "headGlow 1.5s ease-in-out infinite" : "none",
              transition: "box-shadow .3s",
            }}>
              {head && <div style={{ fontSize: 16, lineHeight: 1, color: "#000", fontWeight: 900, filter: "drop-shadow(0 1px 2px rgba(255,255,255,.5))" }}>
                {dir === "RIGHT" ? "➤" : dir === "LEFT" ? "◄" : dir === "UP" ? "▲" : "▼"}
              </div>}
            </div>
          );
        })}

        {/* Particles */}
        {particles.map(p => (
          <div key={p.id} style={{
            position: "absolute", left: p.x - p.size / 2, top: p.y - p.size / 2,
            width: p.size, height: p.size, borderRadius: "50%",
            background: `radial-gradient(circle,#fff,${p.color})`, opacity: p.life,
            boxShadow: `0 0 ${p.size * 3}px ${p.color}, 0 0 ${p.size}px #fff`,
            zIndex: 12, pointerEvents: "none",
          }} />
        ))}

        {/* Score popups */}
        {popups.map(p => (
          <div key={p.id} style={{
            position: "absolute", left: p.x, top: p.y,
            fontSize: 14, fontWeight: 900, color: p.color,
            fontFamily: "'Press Start 2P',monospace",
            opacity: p.life, transform: `translateY(${(1 - p.life) * -30}px)`,
            zIndex: 13, pointerEvents: "none", textShadow: `0 0 10px ${p.color}`,
          }}>{p.text}</div>
        ))}

        {/* Flash */}
        {flash && (
          <div style={{
            position: "absolute", top: "50%", left: "50%",
            animation: flash.type === "complete" ? "compFlash .6s ease-out forwards" : flash.type === "correct" ? "correctPop .4s ease-out" : "wrongShake .4s ease-out",
            transform: "translate(-50%,-50%)", zIndex: 16, textAlign: "center",
          }}>
            {flash.type === "complete" ? (
              <div style={{ padding: "20px 40px", borderRadius: 18, background: "rgba(10,10,20,.95)", border: `3px solid #ffe14d`, boxShadow: "0 0 60px rgba(255,225,77,.4), 0 0 120px rgba(255,225,77,.15)", maxWidth: 400 }}>
                <div style={{ fontSize: 14, color: "#ffe14d", fontFamily: "'Press Start 2P',monospace", letterSpacing: 3, marginBottom: 10, textShadow: "0 0 10px #ffe14d88" }}>✨ COMPLETE! ✨</div>
                <div style={{ fontSize: 38, fontWeight: 900, color: "#fff", fontFamily: "'Noto Serif TC',serif", textShadow: `0 0 30px ${mc}, 0 0 60px ${mc}66`, letterSpacing: 8, whiteSpace: "nowrap" }}>{flash.text}</div>
                
              </div>
            ) : flash.type === "correct" ? (
              <div style={{ padding: "12px 32px", borderRadius: 14, background: "linear-gradient(135deg,rgba(125,255,106,.95),rgba(80,200,70,.95))", color: "#0a1a0a", fontSize: 30, fontWeight: 900, fontFamily: "'Noto Serif TC',serif", boxShadow: "0 0 30px rgba(125,255,106,.5), 0 0 60px rgba(125,255,106,.2)", textShadow: "0 1px 2px rgba(0,0,0,.2)" }}>
                ✓ {flash.text}
              </div>
            ) : (
              <div style={{ padding: "12px 32px", borderRadius: 14, background: "linear-gradient(135deg,rgba(255,45,149,.95),rgba(200,30,120,.95))", color: "#fff", fontSize: 22, fontWeight: 900, fontFamily: "'Noto Serif TC',serif", boxShadow: "0 0 30px rgba(255,45,149,.5), 0 0 60px rgba(255,45,149,.2)" }}>
                ✗ {flash.text}
              </div>
            )}
          </div>
        )}

        {/* Pause */}
        {gs === "paused" && (
          <div style={{ position: "absolute", inset: 0, background: "rgba(5,5,16,.92)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 20, flexDirection: "column", gap: 16 }}>
            <div style={{ fontFamily: "'Press Start 2P',monospace", fontSize: 16, color: "#ffe14d", letterSpacing: 4 }}>PAUSED</div>
            <button onClick={() => { setGs("playing"); R.current.gs = "playing"; if (bgmOn) startBGM(); }} style={{
              padding: "12px 36px", borderRadius: 10, border: `2px solid ${mc}`,
              background: "transparent", color: mc, fontSize: 16, cursor: "pointer",
              fontFamily: "'Press Start 2P',monospace", letterSpacing: 2,
            }}>RESUME</button>
            <div style={{ display: "flex", gap: 12, marginTop: 4 }}>
              <button onClick={() => { setBgmOn(v => { const nv = !v; if (!nv) stopBGM(); return nv; }); }}
                style={{ padding: "8px 20px", borderRadius: 8, border: "1.5px solid #444", background: "transparent", color: bgmOn ? "#ffe14d" : "#555", fontSize: 14, cursor: "pointer", fontFamily: "'Noto Serif TC',serif" }}>
                {bgmOn ? "🔊 音樂 ON" : "🔇 音樂 OFF"}
              </button>
              <button onClick={goHome}
                style={{ padding: "8px 20px", borderRadius: 8, border: "1.5px solid #444", background: "transparent", color: "#888", fontSize: 14, cursor: "pointer", fontFamily: "'Noto Serif TC',serif" }}>
                🏠 回首頁
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );

  const ds = {
    width: 56, height: 56, borderRadius: 14, border: `1.5px solid ${mc}33`,
    background: "rgba(255,255,255,.03)", color: mc, fontSize: 22, cursor: "pointer",
    display: "flex", alignItems: "center", justifyContent: "center",
    WebkitTapHighlightColor: "transparent", touchAction: "manipulation",
  };

  return (
    <div style={{ minHeight: "100vh", background: "radial-gradient(ellipse at 50% 30%,#0f0f28,#080816 60%,#040408)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-start", fontFamily: "'Noto Serif TC',serif", padding: "8px 4px", gap: 2, overflow: "auto" }}>
      <style>{CSS}</style>

      {/* HUD */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", width: B, marginBottom: 4 }}>
        <div style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
          <div style={{ padding: "2px 8px", borderRadius: 6, background: `${DIFF_CFG[diff].color}15`, border: `1px solid ${DIFF_CFG[diff].color}44`, marginRight: 4 }}>
            <span style={{ fontFamily: "'Press Start 2P',monospace", fontSize: 8, color: DIFF_CFG[diff].color }}>{DIFF_CFG[diff].emoji}{DIFF_CFG[diff].label}</span>
          </div>
          <span style={{ fontSize: 24, fontWeight: 900, color: "#ffe14d", fontFamily: "'Press Start 2P',monospace", textShadow: "0 0 10px #ffe14d44" }}>{score}</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          {combo > 1 && (
            <div style={{ padding: "3px 12px", borderRadius: 8, background: combo > 5 ? "rgba(255,45,149,.2)" : "rgba(255,45,149,.12)", border: `1px solid ${combo > 5 ? "rgba(255,45,149,.5)" : "rgba(255,45,149,.3)"}`, animation: combo > 3 ? "cFire .8s ease-in-out infinite, comboScale .5s ease-out" : "comboScale .5s ease-out" }}>
              <span style={{ fontFamily: "'Press Start 2P',monospace", fontSize: combo > 5 ? 13 : 11, color: "#ff2d95" }}>🔥x{combo}</span>
            </div>
          )}
          <div style={{ padding: "3px 10px", borderRadius: 8, background: "rgba(255,255,255,.04)", border: "1px solid #2a2a4a" }}>
            <span style={{ fontFamily: "'Press Start 2P',monospace", fontSize: 9, color: "#666" }}>{done.length}/{DIFF_CFG[diff].target}</span>
          </div>
          {!hintOn && <div style={{ padding: "2px 6px", borderRadius: 4, background: "rgba(255,255,255,.04)", border: "1px solid #2a2a4a" }}>
            <span style={{ fontFamily: "'Press Start 2P',monospace", fontSize: 7, color: "#555" }}>🔒</span>
          </div>}
          <div style={{ display: "none" }}>
          </div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <button onClick={() => { setBgmOn(v => { const nv = !v; if (nv) startBGM(); else stopBGM(); return nv; }); }}
            style={{ width: 38, height: 38, borderRadius: 10, border: "1.5px solid #2a2a4a", background: "rgba(255,255,255,.03)", color: bgmOn ? "#ffe14d" : "#444", fontSize: 16, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}
            title={bgmOn ? "關閉音樂" : "開啟音樂"}>
            {bgmOn ? "🔊" : "🔇"}
          </button>
          <button onClick={() => {
            if (R.current.gs === "playing") { setGs("paused"); R.current.gs = "paused"; stopBGM(); }
            else if (R.current.gs === "paused") { setGs("playing"); R.current.gs = "playing"; if (bgmOn) startBGM(); }
          }} style={{ width: 38, height: 38, borderRadius: 10, border: "1.5px solid #2a2a4a", background: "rgba(255,255,255,.03)", color: "#555", fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
            ⏸
          </button>
          <button onClick={goHome}
            style={{ width: 38, height: 38, borderRadius: 10, border: "1.5px solid #2a2a4a", background: "rgba(255,255,255,.03)", color: "#555", fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}
            title="回首頁">
            🏠
          </button>
        </div>
      </div>

      {progress}

      {(hintOn || ci === 0) && <div style={{ fontSize: 15, color: "#556", marginBottom: 4, textAlign: "center" }}>
        <span style={{ fontFamily: "'Press Start 2P',monospace", fontSize: 10, letterSpacing: 1 }}>FIND </span>
        <span style={{ color: mc, fontSize: 24, fontWeight: 900, textShadow: `0 0 10px ${mc}66` }}>{idiom ? idiom[ci] : ""}</span>
      </div>}

      {board}

      {/* D-Pad */}
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4, marginTop: 10 }}>
        <button onClick={() => dBtn("UP")} onTouchStart={(e) => { e.preventDefault(); dBtn("UP"); }} style={ds}>▲</button>
        <div style={{ display: "flex", gap: 4 }}>
          <button onClick={() => dBtn("LEFT")} onTouchStart={(e) => { e.preventDefault(); dBtn("LEFT"); }} style={ds}>◀</button>
          <div style={{ width: 56, height: 56 }} />
          <button onClick={() => dBtn("RIGHT")} onTouchStart={(e) => { e.preventDefault(); dBtn("RIGHT"); }} style={ds}>▶</button>
        </div>
        <button onClick={() => dBtn("DOWN")} onTouchStart={(e) => { e.preventDefault(); dBtn("DOWN"); }} style={ds}>▼</button>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
